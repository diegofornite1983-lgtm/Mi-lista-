<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Últimos Cambios - Elcano</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 450px; }
        .card {
            background-color: #1a1a1a;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        .header-date { color: #ff3b30; font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .stats { font-size: 0.95em; color: #b0b0b0; margin-bottom: 20px; border-left: 3px solid #ff3b30; padding-left: 10px; }
        .section-title { font-size: 0.95em; font-weight: bold; margin: 20px 0 10px 0; }
        .channel-item {
            background-color: #242424; padding: 12px 14px; margin-bottom: 8px;
            border-radius: 8px; font-size: 0.9em; border-left: 4px solid #34c759; color: #e0e0e0;
        }
        .channel-item.removed { border-left-color: #ff3b30; }
        .btn-update {
            display: block; width: 100%; background-color: #ff1a1a; color: white;
            text-align: center; padding: 15px; border-radius: 10px; text-decoration: none;
            font-weight: bold; font-size: 1em; border: none; cursor: pointer; margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="header-date" id="fecha-actualizacion">📅 Leyendo fecha...</div>
        <div class="stats" id="info-canales">Cargando estado de la lista...</div>
        <div class="section-title" style="color: #34c759;">🟢 CANALES AÑADIDOS</div>
        <div id="lista-agregados"></div>
        <div class="section-title" style="color: #ff3b30;">🔴 CANALES ELIMINADOS</div>
        <div id="lista-eliminados"></div>
    </div>
    <button class="btn-update" onclick="location.reload()">🔄 ACTUALIZAR</button>
</div>
<script>
    fetch("ultimos_cambios.md?" + new Date().getTime())
        .then(response => response.text())
        .then(text => {
            let lineas = text.split("\n");
            let fechaTexto = "Actualizado recientemente";
            let agregados = [], eliminados = [], seccionActual = "";
            lineas.forEach(linea => {
                if (linea.includes("Resumen de cambios en ELCANO")) {
                    let partes = linea.split("-");
                    fechaTexto = partes.length > 1 ? partes.slice(1).join("-").trim() : fechaTexto;
                }
                if (linea.includes("Canales Nuevos")) seccionActual = "agregados";
                if (linea.includes("Canales Eliminados")) seccionActual = "eliminados";
                if (linea.startsWith("- ") && !linea.includes("Ninguno")) {
                    let canal = linea.replace("- ", "").trim();
                    if (seccionActual === "agregados") agregados.push(canal);
                    if (seccionActual === "eliminados") eliminados.push(canal);
                }
            });
            document.getElementById("fecha-actualizacion").innerText = "📅 " + fechaTexto;
            document.getElementById("info-canales").innerHTML = `📺 Estado actual de tu repositorio.<br>🟢 ${agregados.length} añadidos · 🔴 ${eliminados.length} eliminados`;
            document.getElementById("lista-agregados").innerHTML = agregados.length > 0 ? agregados.map(c => `<div class="channel-item">${c}</div>`).join('') : '<div style="color: #888; font-size: 0.85em; padding: 5px;">Ninguno.</div>';
            document.getElementById("lista-eliminados").innerHTML = eliminados.length > 0 ? eliminados.map(c => `<div class="channel-item removed">${c}</div>`).join('') : '<div style="color: #888; font-size: 0.85em; padding: 5px;">Ninguno.</div>';
        });
</script>
</body>
</html>
