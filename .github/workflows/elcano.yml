name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización completa con Elcano
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(
                  URL_ELCANO, 
                  headers={"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def normalizar(texto):
              return "".join(c.upper() for c in texto if c.isalnum())

          # Parsear Elcano extrayendo todos los canales disponibles con su hash limpio
          canales_elcano = []
          lineas_elcano = fuente_elcano.splitlines()
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_hash:
                          h_id = match_hash.group(1)
                          url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_limpia = url
                      
                      nombre = linea.rsplit(",", 1)[-1].strip()
                      canales_elcano.append({
                          "extinf": linea,
                          "nombre": nombre,
                          "nombre_norm": normalizar(nombre),
                          "url": url_limpia
                      })
                      i = j
              i += 1

          mapa_elcano = {c["nombre_norm"]: c["url"] for c in canales_elcano}

          # Actualizar los canales que ya tienes en casa
          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm_casa = normalizar(nombre_canal)
                  
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      if nombre_norm_casa in mapa_elcano:
                          lineas_actualizadas.append(mapa_elcano[nombre_norm_casa])
                      else:
                          # Búsqueda parcial por si el nombre varía ligeramente
                          encontrado = False
                          for k_elcano, v_elcano in mapa_elcano.items():
                              if k_elcano in nombre_norm_casa or nombre_norm_casa in k_elcano:
                                  lineas_actualizadas.append(v_elcano)
                                  encontrado = True
                                  break
                          if not encontrado:
                              lineas_actualizadas.append(url_actual)
                      i += 1
              i += 1

          lista_final_casa = "\n".join(lineas_actualizadas) + ("\n" if not "".join(lineas_actualizadas).endswith("\n") else "")
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          # Generar el archivo para Tailscale
          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización con Elcano realizada correctamente.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizacion de canales con Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
