name: Fusionar Canales de Elcano

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fusionar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista oficial de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Buscar lista y fusionar canales automáticamente
        run: |
          if [ -f "elcano_temp.m3u" ]; then
            echo "Lista de Elcano descargada con éxito."
            
            # Buscar tu archivo de canales (Canales m3u o similar)
            LISTA_M3U=$(find . -maxdepth 1 \( -name "*m3u*" -o -name "*acestream*" \) ! -name "elcano_temp.m3u" | head -n 1)
            
            if [ -n "$LISTA_M3U" ]; then
              echo "Archivo de lista encontrado: $LISTA_M3U"
              
              echo "" >> "$LISTA_M3U"
              echo "# ==========================================" >> "$LISTA_M3U"
              echo "# ACTUALIZADO DESDE ELCANO AUTOMÁTICAMENTE" >> "$LISTA_M3U"
              echo "# ==========================================" >> "$LISTA_M3U"
              
              grep -A 1 "^#EXTINF" elcano_temp.m3u >> "$LISTA_M3U"
              echo "Canales de Elcano añadidos correctamente al archivo."
            else
              echo "Error: No se encuentra tu archivo de canales."
              exit 1
            fi
          else
            echo "Error al descargar la lista de Elcano."
            exit 1
          fi
          
          rm -f elcano_temp.m3u

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-sync: Canales de Elcano fusionados en la lista"
          branch: main
