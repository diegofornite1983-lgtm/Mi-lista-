name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar Elcano y organizar carpetas
        id: update
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_lista = Path("Mi lista acestream")

          if not archivo_lista.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream' en la raíz.")

          try:
              original = archivo_lista.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = archivo_lista.read_text(encoding="latin-1")

          # Descargar Elcano con reintentos
          fuente = None
          for intento in range(1, 4):
              try:
                  peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0", "Accept": "*/*"})
                  with urllib.request.urlopen(peticion, timeout=30) as respuesta:
                      fuente = respuesta.read().decode("utf-8-sig", errors="replace")
                  if fuente and "#EXTINF" in fuente:
                      break
              except Exception as e:
                  print(f"Intento {intento} fallido: {e}")

          if not fuente or "#EXTINF" not in fuente:
              print("AVISO: Elcano no responde o está saturado. Se mantiene la lista actual intacta.")
              sys.exit(0)

          def normalizar_nombre(nombre):
              n = nombre.upper()
              n = re.sub(r'[⭐️*]', '', n)
              n = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', n)
              return "".join(n.split())

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre
                          })
                          i = j
                  i += 1
              return entradas

          canales_elcano = parsear_m3u(fuente)
          mapa_elcano = {normalizar_nombre(c["nombre"]): c["url"] for c in canales_elcano}

          lineas_casa = original.splitlines()
          lineas_actualizadas = []

          # Actualizar hashes de canales existentes
          i = 0
          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm = normalizar_nombre(nombre_canal)
                  
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      if nombre_norm in mapa_elcano:
                          lineas_actualizadas.append(mapa_elcano[nombre_norm])
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              i += 1

          def mapear_carpeta(nombre_canal, extinf_original):
              n = nombre_canal.upper()
              ext = extinf_original.upper()
              if "HYPERMOTION" in n or "HYPERMOTION" in ext:
                  return "HYPERMOTION"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n:
                  return "DAZN"
              elif "LALIGA" in n or "M+ LALIGA" in n or "DAZN LIGA" in n or ("LIGA" in n and "CAMPEONES" not in n):
                  return "LA LIGA Y DAZN LIGA"
              elif "DAZN" in n:
                  return "DAZN"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN"
              elif any(x in n for x in ["ESTRENOS", "ACCION", "CINE", "COMEDIA", "HITS", "DRAMA", "INDIE", "ROMANCE", "TERROR", "ORIGINALES", "DOCUMENTALES", "MOVISTAR PLUS", "MOVISTAR+"]):
                  return "MOVISTAR"
              else:
                  return "MOVISTAR DEP-VAMOS"

          # Detectar canales nuevos de Elcano que no tengas
          nombres_en_casa = {normalizar_nombre(c["nombre"]) for c in parsear_m3u(original)}
          clasificados = {}
          for c in canales_elcano:
              if normalizar_nombre(c["nombre"]) not in nombres_en_casa:
                  carp = mapear_carpeta(c["nombre"], c["extinf"])
                  if carp not in clasificados:
                      clasificados[carp] = []
                  extinf_f = c["extinf"]
                  if 'group-title="' in extinf_f:
                      extinf_f = re.sub(r'group-title="[^"]*"', f'group-title="{carp}"', extinf_f)
                  else:
                      extinf_f = extinf_f.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{carp}"')
                  clasificados[carp].append((c["nombre"], extinf_f, c["url"]))

          # Insertar los nuevos dentro de sus carpetas correspondientes
          lineas_finales = []
          i = 0
          while i < len(lineas_actualizadas):
              l = lineas_actualizadas[i]
              lineas_finales.append(l)
              for nombre_carp, lista_canales in list(clasificados.items()):
                  if nombre_carp.upper() in l.upper() and ("CARPETA:" in l.upper() or nombre_carp in l):
                      lineas_finales.append("")
                      for nom_f, extinf_f, url_f in lista_canales:
                          lineas_finales.append(extinf_f)
                          lineas_finales.append(url_f)
                      lineas_finales.append("")
                      del clasificados[nombre_carp]
              i += 1

          # Si queda alguna carpeta nueva sin cabecera, créala al final
          if clasificados:
              for carp, lista_canales in clasificados.items():
                  lineas_finales.append("")
                  lineas_finales.append(f"# ==========================================")
                  lineas_finales.append(f"# CARPETA: {carp}")
                  lineas_finales.append(f"# ==========================================")
                  for nom_f, extinf_f, url_f in lista_canales:
                      lineas_finales.append(extinf_f)
                      lineas_finales.append(url_f)

          archivo_lista.write_text("\n".join(lineas_finales) + "\n", encoding="utf-8")
          print("Sincronización completada con éxito.")
          PY

      - name: Generar Canales m3u para Tailscale
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync: Elcano y Tailscale actualizados correctamente"
            git push
          else
            echo "No hay cambios que guardar."
          fi
