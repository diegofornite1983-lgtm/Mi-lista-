name: Fusionar Canales de Elcano

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fusionar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista oficial de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Fusionar canales perfectamente
        run: |
          if [ -f "elcano_temp.m3u" ]; then
            echo "Lista de Elcano descargada con éxito."
            
            # Usamos el nuevo nombre sin espacios
            ARCHIVO_LISTA="milista.m3u"
            
            if [ -f "$ARCHIVO_LISTA" ]; then
              echo "Procesando la lista: $ARCHIVO_LISTA"
              
              echo "" >> "$ARCHIVO_LISTA"
              echo "# ==========================================" >> "$ARCHIVO_LISTA"
              echo "# ACTUALIZADO DESDE ELCANO AUTOMÁTICAMENTE" >> "$ARCHIVO_LISTA"
              echo "# ==========================================" >> "$ARCHIVO_LISTA"
              
              grep -A 1 "^#EXTINF" elcano_temp.m3u >> "$ARCHIVO_LISTA"
              echo "¡Canales de Elcano incorporados con éxito!"
            else
              echo "Error: No se encuentra el archivo milista.m3u"
              exit 1
            fi
          else
            echo "Error al descargar la lista de Elcano."
            exit 1
          fi
          
          rm -f elcano_temp.m3u

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-sync: Canales de Elcano incorporados en la lista"
          branch: main
