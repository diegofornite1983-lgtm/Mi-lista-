name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización perfecta con EPG y orden exactos
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre,
                              "raw_url": url
                          })
                          i = j
                  i += 1
              return entradas

          canales_elcano = parsear_m3u(fuente_elcano)
          mapa_elcano_por_nombre = {c["nombre"].upper(): c["url"] for c in canales_elcano}

          # 1. Actualizar enlaces y asegurar el tvg-id correcto con 'Movistar Plus+ HD'
          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          urls_en_casa = set()
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              
              # Si es un canal de Movistar Plus, unificamos el tvg-id al que sí funciona con la EPG
              if "MOVISTAR PLUS" in linea.upper() and "#EXTINF:" in linea:
                  linea = re.sub(r'tvg-id="[^"]*"', 'tvg-id="Movistar Plus+ HD"', linea)

              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip().upper()
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      urls_en_casa.add(url_actual)
                      if nombre_canal in mapa_elcano_por_nombre:
                          nueva_url = mapa_elcano_por_nombre[nombre_canal]
                          lineas_actualizadas.append(nueva_url)
                          urls_en_casa.add(nueva_url)
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              elif not linea.startswith("#") and linea.strip():
                  urls_en_casa.add(linea.strip())
              i += 1

          # 2. Descargar novedades de Elcano si las hubiera
          def mapear_carpeta(nombre_canal, extinf_original):
              n = nombre_canal.upper()
              ext = extinf_original.upper()
              if "HYPERMOTION" in n or "HYPERMOTION" in ext:
                  return "HYPERMOTION"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "LALIGA" in n or "M+ LALIGA" in n or "DAZN LIGA" in n or ("LIGA" in n and "CAMPEONES" not in n):
                  return "LA LIGA Y DAZN LIGA"
              elif "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n:
                  return "DAZN"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN"
              elif "ESTRENOS" in n or "ACCION" in n or "CINE" in n or "COMEDIA" in n or "HITS" in n or "DRAMA" in n or "INDIE" in n or "ROMANCE" in n or "TERROR" in n or "ORIGINALES" in n or "DOCUMENTALES" in n or "MOVISTAR PLUS" in n or "MOVISTAR+" in n:
                  return "MOVISTAR"
              else:
                  return "MOVISTAR DEP-VAMOS"

          novedades = []
          for c in canales_elcano:
              if c["url"] not in urls_en_casa and c["raw_url"] not in urls_en_casa:
                  novedades.append(c)

          clasificados = {}
          for c in novedades:
              carp = mapear_carpeta(c["nombre"], c["extinf"])
              if carp not in clasificados:
                  clasificados[carp] = []
              extinf_f = c["extinf"]
              if 'group-title="' in extinf_f:
                  extinf_f = re.sub(r'group-title="[^"]*"', f'group-title="{carp}"', extinf_f)
              else:
                  extinf_f = extinf_f.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{carp}"')
              clasificados[carp].append((extinf_f, c["url"]))

          lineas_finales_temp = []
          i = 0
          while i < len(lineas_actualizadas):
              l = lineas_actualizadas[i]
              lineas_finales_temp.append(l)
              for nombre_carp, lista_canales in list(clasificados.items()):
                  if nombre_carp.upper() in l.upper() and ("CARPETA:" in l.upper() or nombre_carp in l):
                      lineas_finales_temp.append("")
                      for extinf_f, url_f in lista_canales:
                          lineas_finales_temp.append(extinf_f)
                          lineas_finales_temp.append(url_f)
                      lineas_finales_temp.append("")
                      del clasificados[nombre_carp]
              i += 1

          if clasificados:
              for carp, lista_canales in clasificados.items():
                  lineas_finales_temp.append("")
                  lineas_finales_temp.append(f"# ==========================================")
                  lineas_finales_temp.append(f"# CARPETA: {carp}")
                  lineas_finales_temp.append(f"# ==========================================")
                  for extinf_f, url_f in lista_canales:
                      lineas_finales_temp.append(extinf_f)
                      lineas_finales_temp.append(url_f)

          # 3. ORDEN ESTRICTO PARA LA LIGA: Movistar LaLiga ARRIBA, DAZN LaLiga ABAJO
          texto_provisional = "\n".join(lineas_finales_temp)
          if "# CARPETA: LA LIGA Y DAZN LIGA" in texto_provisional:
              partes = texto_provisional.split("# CARPETA: LA LIGA Y DAZN LIGA")
              if len(partes) > 1:
                  subpartes = partes[1].split("# ==========================================")
                  bloque_liga = subpartes[0]
                  lineas_liga = [l for l in bloque_liga.splitlines() if l.strip()]
                  bloques_canales = []
                  k = 0
                  while k < len(lineas_liga):
                      if lineas_liga[k].startswith("#EXTINF:"):
                          ext = lineas_liga[k]
                          url_c = lineas_liga[k+1] if k+1 < len(lineas_liga) and not lineas_liga[k+1].startswith("#") else ""
                          bloques_canales.append((ext, url_c))
                          k += 2
                      else:
                          k += 1

                  def sort_laliga(item):
                      texto_inf = item[0].upper()
                      if "DAZN" in texto_inf and "M+" not in texto_inf and "MOVISTAR" not in texto_inf:
                          return 2
                      else:
                          return 1

                  bloques_canales.sort(key=sort_laliga)

                  nuevo_bloque_texto = "\n\n"
                  for ext, url_c in bloques_canales:
                      nuevo_bloque_texto += f"{ext}\n{url_c}\n"

                  subpartes[0] = nuevo_bloque_texto
                  partes[1] = "# ==========================================".join(subpartes)
                  texto_provisional = "# CARPETA: LA LIGA Y DAZN LIGA".join(partes)

          lista_final_casa = texto_provisional + ("\n" if not texto_provisional.endswith("\n") else "")
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización clavada al milímetro con EPG unificado.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Unificar tvg-id para EPG de Movistar Plus y ordenar La Liga"
            git push
          else
            echo "No hay cambios que guardar."
          fi
