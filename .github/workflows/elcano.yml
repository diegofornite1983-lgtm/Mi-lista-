name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización definitiva, EPG limpia y orden de Liga
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://workers.dev"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def normalizar_nombre(nombre):
              n = nombre.upper()
              n = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', n)
              return "".join(n.split())

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre,
                              "raw_url": url
                          })
                          i = j
                  i += 1
              return entradas

          canales_elcano = parsear_m3u(fuente_elcano)
          mapa_elcano_por_nombre = {normalizar_nombre(c["nombre"]): c["url"] for c in canales_elcano}

          # 1. Parsear los canales existentes de casa
          canales_casa_viejos = parsear_m3u(contenido_casa)
          urls_en_casa = set()
          
          # Actualizar los enlaces de casa existentes si están en Elcano
          for c in canales_casa_viejos:
              urls_en_casa.add(c["url"])
              urls_en_casa.add(c["raw_url"])
              norm_n = normalizar_nombre(c["nombre"])
              if norm_n in mapa_elcano_por_nombre:
                  c["url"] = mapa_elcano_por_nombre[norm_n]
                  urls_en_casa.add(c["url"])

          # 2. Capturar novedades verdaderas de Elcano
          novedades = []
          for c in canales_elcano:
              if c["url"] not in urls_en_casa and c["raw_url"] not in urls_en_casa:
                  novedades.append(c)

          def mapear_carpeta(nombre_canal, extinf_original):
              n = nombre_canal.upper()
              ext = extinf_original.upper()
              if "HYPERMOTION" in n or "HYPERMOTION" in ext:
                  return "HYPERMOTION"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "LALIGA" in n or "M+ LALIGA" in n or "DAZN LIGA" in n or ("LIGA" in n and "CAMPEONES" not in n) or "DAZN 1" in n:
                  return "LA LIGA Y DAZN LIGA"
              elif "DAZN" in n:
                  return "DAZN"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN"
              elif "ESTRENOS" in n or "ACCION" in n or "CINE" in n or "COMEDIA" in n or "HITS" in n or "DRAMA" in n or "INDIE" in n or "ROMANCE" in n or "TERROR" in n or "ORIGINALES" in n or "DOCUMENTALES" in n or "MOVISTAR PLUS" in n or "MOVISTAR+" in n:
                  return "MOVISTAR"
              else:
                  return "MOVISTAR DEP-VAMOS"

          # Combinar todos los canales de la carpeta Liga para reordenarlos por completo sin mezclas
          todos_los_canales_liga = []
          otros_canales_restantes = []

          # Clasificar los canales que ya tenías guardados en tu archivo
          for c in canales_casa_viejos:
              if mapear_carpeta(c["nombre"], c["extinf"]) == "LA LIGA Y DAZN LIGA":
                  todos_los_canales_liga.append(c)
              else:
                  otros_canales_restantes.append(c)

          # Añadir los nuevos de Elcano de la Liga al mismo saco
          for c in novedades:
              if mapear_carpeta(c["nombre"], c["extinf"]) == "LA LIGA Y DAZN LIGA":
                  todos_los_canales_liga.append(c)
              else:
                  # Para otras categorías se añadirán al final como novedades ordinarias
                  otros_canales_restantes.append(c)

          # PROCESAMIENTO Y PARCHE DE GUÍA (EPG) DE LA LIGA INTERNO
          for c in todos_los_canales_liga:
              nom_f = c["nombre"].upper()
              extinf_f = c["extinf"]
              # Forzado dinámico de tvg-id correcto según el nombre del canal
              if "DAZN" in nom_f:
                  if "2" in nom_f:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga 2 HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="DAZN LaLiga 2 HD"')
                  else:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="DAZN LaLiga HD"')
              else:
                  if "2" in nom_f:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 2 HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="M+ LaLiga 2 HD"')
                  elif "3" in nom_f:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 3 HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="M+ LaLiga 3 HD"')
                  elif "4" in nom_f:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 4 HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="M+ LaLiga 4 HD"')
                  else:
                      extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga HD"', extinf_f) if 'tvg-id="' in extinf_f else extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 tvg-id="M+ LaLiga HD"')
              
              # Forzar group-title unificado
              if 'group-title="' in extinf_f:
                  extinf_f = re.sub(r'group-title="[^"]*"', 'group-title="LA LIGA Y DAZN LIGA"', extinf_f)
              else:
                  extinf_f = extinf_f.replace('#EXTINF:-1', '#EXTINF:-1 group-title="LA LIGA Y DAZN LIGA"')
              c["extinf"] = extinf_f

          # ORDENACIÓN CRUCIAL ABSOLUTA: Todo Movistar Liga arriba del todo, todo DAZN Liga abajo
          movistar_liga_final = [c for c in todos_los_canales_liga if "DAZN" not in c["nombre"].upper()]
          dazn_liga_final = [c for c in todos_los_canales_liga if "DAZN" in c["nombre"].upper()]
          todos_los_canales_liga_ordenados = movistar_liga_final + dazn_liga_final

          # 3. Reconstruir el fichero final M3U estructurado
          lineas_finales = []
          lineas_finales.append('#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"')
          lineas_finales.append('#EXTVLCOPT:network-caching=1000\n')

          lineas_finales.append('# ==========================================')
          lineas_finales.append('# CARPETA: LA LIGA Y DAZN LIGA')
          lineas_finales.append('# ==========================================')
          for c in todos_los_canales_liga_ordenados:
              lineas_finales.append(c["extinf"])
              lineas_finales.append(c["url"])
          lineas_finales.append('')

          # Escribir el resto de canales que no pertenecen a la carpeta Liga respetando sus grupos
          carpetas_restantes = {}
          for c in otros_canales_restantes:
              carp = mapear_carpeta(c["nombre"], c["extinf"])
