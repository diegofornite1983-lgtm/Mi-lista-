name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano y añadir canales nuevos
        id: update
        run: |
          python <<'PY'
          import os
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          
                CARPETA = Path("Mi lista acestream")

          if not CARPETA.is_dir():
              sys.exit("ERROR: No existe la carpeta Mi lista acestream.")

          archivos = [
              p for p in CARPETA.rglob("*")
              if p.is_file() and p.suffix.lower() in (".m3u", ".m3u8", ".txt")
          ]

          if len(archivos) != 1:
              sys.exit(
                  "ERROR: Se esperaba un único archivo M3U/TXT dentro de "
                  f"Mi lista acestream, pero se encontraron {len(archivos)}. "
                  "No se ha modificado nada."
              )

          destino = archivos[0]


          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def leer_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0

              while i < len(lineas):
                  linea = lineas[i].strip()

                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1

                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1

                      if url:
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          grupo = re.search(r'group-title="([^"]*)"', linea)
                          entradas.append({
                              "extinf": linea,
                              "url": url,
                              "nombre": nombre,
                              "grupo": grupo.group(1) if grupo else ""
                          })
                          i = j

                  i += 1

              return entradas

          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          if "#EXTM3U" not in fuente or "#EXTINF:" not in fuente:
              sys.exit("ERROR: La dirección de Elcano no ha devuelto una lista M3U válida.")

          try:
              original = destino.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = destino.read_text(encoding="latin-1")

          canales_fuente = leer_m3u(fuente)
          canales_mios = leer_m3u(original)

          if not canales_fuente:
              sys.exit("ERROR: Elcano no contiene canales reconocibles.")

          nombres_existentes = {
              normalizar(c["nombre"]) for c in canales_mios
          }

          nuevos = []

          for canal in canales_fuente:
              nombre_id = normalizar(canal["nombre"])

              if not nombre_id or nombre_id in nombres_existentes:
                  continue

              extinf = canal["extinf"]
              url = canal["url"]

              nuevos.extend([extinf, url])
              nombres_existentes.add(nombre_id)

          if nuevos:
              with destino.open("a", encoding="utf-8", newline="\n") as archivo:
                  if original and not original.endswith("\n"):
                      archivo.write("\n")
                  archivo.write("\n".join(nuevos) + "\n")

          print(f"Archivo actualizado: {destino}")
          print(f"Canales encontrados en Elcano: {len(canales_fuente)}")
          print(f"Canales nuevos añadidos: {len(nuevos) // 2}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(f"path={destino.as_posix()}\n")
          PY

      - name: Guardar cambios en GitHub
        env:
          TARGET_FILE: ${{ steps.update.outputs.path }}
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add -- "$TARGET_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar canales nuevos de Elcano automáticamente"
            git push
          else
            echo "No hay canales nuevos que guardar."
          fi
