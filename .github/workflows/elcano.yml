name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano y actualizar lista
        id: update
        run: |
          python <<'PY'
          import os
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = {}
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas[normalizar(nombre)] = {
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre
                          }
                          i = j
                  i += 1
              return entradas

          # Descarga segura con control estricto del Error 429
          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  }
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except urllib.error.HTTPError as e:
              if e.code == 429:
                  print("AVISO: Servidor de Elcano saturado temporalmente (Error 429). Se omite este ciclo para evitar bloqueos.")
                  sys.exit(0)
              else:
                  sys.exit(f"ERROR HTTP descargando Elcano: {e}")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          canales_elcano = parsear_m3u(fuente)
          if not canales_elcano:
              sys.exit("ERROR: Elcano no contiene canales reconocibles.")

          try:
              original = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = archivo_casa.read_text(encoding="latin-1")

          lineas_casa = original.splitlines()
          lineas_actualizadas = []
          i = 0
          nombres_procesados = set()

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  norm_nombre = normalizar(nombre_canal)
                  nombres_procesados.add(norm_nombre)

                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      if norm_nombre in canales_elcano:
                          lineas_actualizadas.append(canales_elcano[norm_nombre]["url"])
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              i += 1

          nuevos_bloques = []
          for norm_nombre, datos in canales_elcano.items():
              if norm_nombre not in nombres_procesados:
                  nuevos_bloques.append(datos["extinf"])
                  nuevos_bloques.append(datos["url"])

          if nuevos_bloques:
              lineas_actualizadas.append("")
              lineas_actualizadas.append("# ==========================================")
              lineas_actualizadas.append("# NUEVOS CANALES DE ELCANO")
              lineas_actualizadas.append("# ==========================================")
              lineas_actualizadas.extend(nuevos_bloques)

          lista_final_casa = "\n".join(lineas_actualizadas) + "\n"
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Lista y Tailscale actualizados correctamente.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"

          if ! git diff --cached --quiet; then
            git commit -m "Sincronizacion automatica de Elcano y Tailscale"
            git push
          else
            echo "No hay cambios que guardar."
          fi
