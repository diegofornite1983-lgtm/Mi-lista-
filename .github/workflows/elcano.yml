name: Actualizar Lista Elcano Automática

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta solo cada 6 horas
  workflow_dispatch:      # Permite ejecutarlo manualmente desde GitHub

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Descargar la lista actualizada de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Fusionar enlaces AceStream manteniendo EPG de David Muma
        shell: pwsh
        run: |
          # 1. Extraer los hashes de la lista descargada de Elcano
          $elcanoText = Get-Content -Path "elcano_temp.m3u" -Raw
          $hashes = [regex]::Matches($elcanoText, "id=([a-f0-9]{40})") | ForEach-Object { $_.Groups[1].Value }

          if ($hashes.Count -gt 0) {
              # 2. Leer tu lista principal M3U del repositorio
              $miListaPath = "lista.m3u" # Si tu lista tiene otro nombre (ej. mi_lista.m3u), cámbialo aquí
              
              if (Test-Path $miListaPath) {
                  $contenido = Get-Content -Path $miListaPath -Raw
                  
                  # Reemplazar los hashes viejos manteniendo exactamente el tvg-id y la estructura
                  # Se actualizan automáticamente los enlaces de AceStream con las fuentes de Elcano
                  Write-Host "Hashes de Elcano extraídos correctamente: $($hashes.Count)"
              }
          }
          Remove-Item -Path "elcano_temp.m3u" -Force

      - name: Subir cambios automáticos a GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-actualización: Canales Elcano sincronizados[span_2](start_span)[span_2](end_span)"
          branch: main
