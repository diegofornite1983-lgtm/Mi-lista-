name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sintonizar y añadir canales nuevos de Elcano
        id: update
        run: |
          python <<'PY'
          import os
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          
          # Ruta de tu archivo base local
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def leer_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          grupo = re.search(r'group-title="([^"]*)"', linea)
                          entradas.append({
                              "extinf": linea,
                              "url": url,
                              "nombre": nombre,
                              "grupo": grupo.group(1) if grupo else ""
                          })
                          i = j
                  i += 1
              return entradas

          # Descargar la lista actualizada de Elcano
          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          if "#EXTM3U" not in fuente or "#EXTINF:" not in fuente:
              sys.exit("ERROR: La dirección de Elcano no ha devuelto una lista válida.")

          try:
              original = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = archivo_casa.read_text(encoding="latin-1")

          canales_fuente = leer_m3u(fuente)
          canales_mios = leer_m3u(original)

          nombres_existentes = {normalizar(c["nombre"]) for c in canales_mios}
          grupos_existentes = {c["grupo"] for c in canales_mios if c["grupo"]}

          equivalencias = {
              "LA LIGA": "LA LIGA Y DAZN LIGA"
          }

          nuevos = []
          for canal in canales_fuente:
              nombre_id = normalizar(canal["nombre"])
              if not nombre_id or nombre_id in nombres_existentes:
                  continue

              grupo_origen = canal["grupo"]
              grupo_destino = equivalencias.get(grupo_origen, grupo_origen)

              if not grupo_destino or grupo_destino not in grupos_existentes:
                  continue

              extinf = canal["extinf"]
              if grupo_destino != grupo_origen:
                  extinf = re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{grupo_destino}"',
                      extinf,
                      count=1
                  )

              nuevos.extend([extinf, canal["url"]])
              nombres_existentes.add(nombre_id)

          # Si hay canales nuevos, añadirlos al final respetando tu lista previa
          lista_final_casa = original
          if nuevos:
              if not lista_final_casa.endswith("\n"):
                  lista_final_casa += "\n"
              lista_final_casa += "\n".join(nuevos) + "\n"
              archivo_casa.write_text(lista_final_casa, encoding="utf-8")
              print(f"Canales nuevos añadidos: {len(nuevos) // 2}")
          else:
              print("No hay canales nuevos que añadir.")

          # Generar automáticamente la versión para Tailscale
          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")
          print("Archivo Tailscale actualizado correctamente.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"

          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automática de canales de Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
