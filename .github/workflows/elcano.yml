name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano Corrección Definitiva
        run: |
          python3 -c '
          import urllib.request, re
          from pathlib import Path

          urls = [
              "https://r.jina.ai/https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://api.allorigins.win/raw?url=https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          fuente = None
          for url in urls:
              try:
                  print(f"Probando pasarela: {url}")
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=20) as res:
                      data = res.read().decode("utf-8-sig", errors="replace")
                      if data and "http" in data:
                          fuente = data
                          print("¡Contenido obtenido correctamente!")
                          break
              except Exception as e:
                  print(f"Error: {e}")

          path = Path("Mi lista acestream")
          if not path.exists():
              print("ERROR: No se encuentra el archivo Mi lista acestream")
              exit(0)

          orig = path.read_text(encoding="utf-8-sig", errors="replace")

          if not fuente:
              print("ERROR: No se pudo descargar la fuente. Se mantiene la lista intacta.")
              exit(0)

          # Diccionario avanzado para capturar cualquier formato de hashes de Elcano
          hashes = {}
          lineas_fuente = fuente.splitlines()
          i = 0
          while i < len(lineas_fuente):
              linea = lineas_fuente[i].strip()
              if linea.startswith("#EXTINF:"):
                  nombre_raw = linea.rsplit(",", 1)[-1].strip()
                  # Limpiar sufijos de resolución y estrellas para hacer match exacto
                  nombre_limpio = re.sub(r'\b(720p|1080p|4K|HD)\b', '', nombre_raw, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r'[\*⭐️]', '', nombre_limpio).strip().upper()
                  nombre_norm = re.sub(r'[^A-Z0-9]', '', nombre_limpio)
                  
                  # Buscar el enlace siguiente
                  j = i + 1
                  while j < len(lineas_fuente):
                      candidata = lineas_fuente[j].strip()
                      if candidata and not candidata.startswith("#"):
                          match_hash = re.search(r'([0-9a-fA-F]{40})', candidata)
                          if match_hash:
                              hashes[nombre_norm] = f"http://127.0.0.1:6878/ace/getstream?id={match_hash.group(1)}"
                          break
                      j += 1
              i += 1

          print(f"Hashes extraídos de la fuente remota: {len(hashes)}")

          # Actualizar el archivo local respetando la EPG de David Muma y estructura
          lines = orig.splitlines()
          new_lines = []
          i = 0
          actualizados = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  nombre_limpio = re.sub(r'\b(720p|1080p|4K|HD)\b', '', nombre_canal, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r'[\*⭐️]', '', nombre_limpio).strip().upper()
                  norm = re.sub(r'[^A-Z0-9]', '', nombre_limpio)
                  
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                          new_lines.append(hashes[norm])
                          actualizados += 1
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          print(f"¡Total de canales actualizados con éxito: {actualizados} / 141!")
          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync Elcano: Canales al 100%" && git push)
