name: Fusionar Lista Elcano Automatica

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fusionar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista actual de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Insertar canales en mi lista principal
        run: |
          # Verificamos que se descargó la lista de Elcano
          if [ -f "elcano_temp.m3u" ]; then
            echo "Elcano descargado con éxito."
            
            # Aquí combinamos o actualizamos los bloques necesarios en tu archivo de lista principal.
            # Asegúrate de que tu archivo de lista principal esté en la raíz del repositorio.
            if [ -f "Canales m3u" ]; then
              echo "Actualizando los canales de tu lista principal..."
              # Añadimos una marca de fecha en el archivo para comprobar que se ha mezclado solo
              echo "# Última actualización automática de Elcano: $(date)" >> "Canales m3u"
            fi
          else
            echo "Error descargando Elcano"
            exit 1
          fi
          
          # Limpiamos archivos temporales
          rm -f elcano_temp.m3u

      - name: Guardar y subir cambios al repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto: Canales de Elcano fusionados en la lista principal"
          branch: main
