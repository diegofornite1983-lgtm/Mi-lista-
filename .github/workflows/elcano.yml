name: Fusionar Canales de Elcano

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas
  workflow_dispatch:      # Permite darle al botón manualmente

jobs:
  fusionar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista oficial de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Fusionar canales en tu archivo principal
        run: |
          if [ -f "elcano_temp.m3u" ]; then
            echo "Lista de Elcano descargada con éxito."
            
            # Verificamos si existe tu archivo de canales principal
            if [ -f "Canales m3u" ]; then
              echo "Añadiendo los nuevos canales de Elcano al final de tu archivo..."
              
              # Añadimos un salto de línea y volcamos el contenido de Elcano respetando la estructura
              echo "" >> "Canales m3u"
              echo "# ==========================================" >> "Canales m3u"
              echo "# ACTUALIZADO DESDE ELCANO AUTOMÁTICAMENTE" >> "Canales m3u"
              echo "# ==========================================" >> "Canales m3u"
              
              # Extraemos las líneas de canales de la lista de Elcano y las metemos en tu lista
              grep -A 1 "^#EXTINF" elcano_temp.m3u >> "Canales m3u"
              
              echo "¡Fusión completada con éxito!"
            else
              echo "No se encuentra el archivo 'Canales m3u' en la raíz."
              exit 1
            fi
          else
            echo "Error al descargar la lista de Elcano."
            exit 1
          fi
          
          # Limpiamos el archivo temporal
          rm -f elcano_temp.m3u

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-sync: Canales de Elcano fusionados en la lista principal"
          branch: main
