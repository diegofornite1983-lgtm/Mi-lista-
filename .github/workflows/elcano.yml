name: Actualizador Automatico Elcano, Tailscale y Amigos 

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización automática ELCANO, Tailscale y Amigos
        run: |
          python <<'PY'
          import re
          import sys
          import datetime
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # FUNCIÓN INTELIGENTE AMPLIADA CON TODOS LOS CANALES REVISADOS
          def obtener_tvg_id(nombre):
              n = nombre.upper()
              if "M+ LALIGA HDR" in n: return "M+ LaLiga HDR"
              if "M+ LALIGA 2" in n: return "M+ LaLiga 2 HD"
              if "M+ LALIGA 3" in n: return "M+ LaLiga 3 HD"
              if "M+ LALIGA 4" in n: return "M+ LaLiga 4 HD"
              if "LALIGA" in n and "DAZN" in n and "2" in n: return "DAZN LaLiga 2 HD"
              if "LALIGA" in n and "DAZN" in n: return "DAZN LaLiga HD"
              if "M+ LALIGA" in n: return "M+ LaLiga HD"
              if "CAMPEONES 2" in n: return "M+ Liga de Campeones 2 HD"
              if "CAMPEONES 3" in n: return "M+ Liga de Campeones 3 HD"
              if "CAMPEONES 4" in n: return "M+ Liga de Campeones 4"
              if "CAMPEONES 5" in n: return "M+ Liga de Campeones 5"
              if "CAMPEONES 6" in n: return "M+ Liga de Campeones 6"
              if "CAMPEONES 7" in n: return "M+ Liga de Campeones 7"
              if "CAMPEONES 8" in n: return "M+ Liga de Campeones 8"
              if "CAMPEONES" in n: return "M+ Liga de Campeones HD"
              if "HYPERMOTION 2" in n or "HYPERMOTION 2 HD" in n: return "LaLiga TV Hypermotion 2"
              if "HYPERMOTION 3" in n or "HYPERMOTION 3 HD" in n: return "LaLiga TV Hypermotion 3"
              if "HYPERMOTION 10" in n: return "LaLiga TV Hypermotion 10 HD"
              if "HYPERMOTION" in n: return "LaLiga TV Hypermotion HD"
              if "MOVISTAR PLUS" in n or "MOVISTAR+" in n: return "Movistar Plus+ HD"
              if "ESTRENOS" in n: return "M+ Estrenos HD"
              if "ACCION" in n or "ACCIÓN" in n: return "M+ Acción HD"
              if "CINE ESPAÑOL" in n: return "M+ Cine Español"
              if "COMEDIA" in n: return "M+ Comedia HD"
              if "HITS" in n: return "M+ Hits HD"
              if "DRAMA" in n: return "M+ Drama HD"
              if "INDIE" in n: return "M+ Indie HD"
              if "ROMANCE" in n: return "M+ Romance"
              if "TERROR" in n: return "Movistar Terror"
              if "DARK" in n: return "Dark HD"
              if "AXN MOVIES" in n: return "AXN Movies HD"
              if "ORIGINALES" in n: return "M+ Originales HD"
              if "CALLE 13" in n: return "Calle 13 HD"
              if "AMC" in n: return "AMC HD"
              if "AXN" in n and "MOVIES" not in n: return "AXN HD"
              if "COMEDY CENTRAL" in n: return "Comedy Central HD"
              if "SYFY" in n: return "Syfy"
              if "SKYSHOWTIME" in n: return "SkyShowtime 1"
              if "HBO MAX" in n: return "HBO Max Avances"
              if "DOCUMENTALES" in n: return "M+ Documentales HD"
              if "COCINA" in n: return "Canal Cocina HD"
              if "CAZA Y PESCA" in n: return "Caza y Pesca HD"
              if "ONETORO" in n or "ONE TORO" in n: return "OneToro HD"
              if "DEPORTES 2" in n: return "M+ Deportes 2 HD"
              if "DEPORTES 3" in n: return "M+ Deportes 3"
              if "DEPORTES 4" in n: return "M+ Deportes 4"
              if "DEPORTES 5" in n: return "M+ Deportes 5"
              if "DEPORTES 6" in n: return "M+ Deportes 6"
              if "DEPORTES 7" in n: return "M+ Deportes 7"
              if "DEPORTES 8" in n: return "M+ Deportes 8"
              if "DEPORTES" in n: return "M+ Deportes HD"
              if "GOLF 2" in n: return "M+ Golf 2 HD"
              if "GOLF" in n: return "M+ Golf HD"
              if "VAMOS 2" in n: return "M+ Vamos 2"
              if "VAMOS 3" in n: return "M+ Vamos 3"
              if "VAMOS" in n: return "M+ Vamos HD"
              if "UFC FIGHT PASS 1" in n: return "UFC Fight Pass 1"
              if "UFC FIGHT PASS 2" in n: return "UFC Fight Pass 2"
              if "DAZN BALONCESTO 2" in n: return "DAZN Baloncesto 2"
              if "DAZN BALONCESTO" in n: return "DAZN Baloncesto"
              if "M+ BALONCESTO 2" in n: return "M+ Baloncesto 2"
              if "M+ BALONCESTO 3" in n: return "M+ Baloncesto 3"
              if "M+ BALONCESTO" in n: return "M+ Baloncesto"
              if "FORMULA 1" in n or "F1" in n: return "DAZN F1 HD"
              if "MOTOGP" in n: return "DAZN MotoGP"
              if "DAZN 1" in n: return "DAZN 1 HD"
              if "DAZN 2" in n: return "DAZN 2 HD"
              if "DAZN 3" in n: return "DAZN 3 HD"
              if "DAZN 4" in n: return "DAZN 4 HD"
              if "RALLY TV" in n: return "DE | Rally TV"
              if "AZTECA" in n: return "TV Azteca 7"
              if "EUROSPORT 1" in n: return "Eurosport 1 HD"
              if "EUROSPORT 2" in n: return "Eurosport 2"
              if "TENNIS CHANNEL" in n: return "Tennis Channel"
              if "SKY SPORT TENNIS" in n: return "Sky Sport Tennis"
              if "NBA LEAGUE PASS" in n: return "NBA League Pass"
              if "SPORT TV 3" in n or "SPORT TV3" in n: return "Sport TV 3"
              if "NBC SPORTS" in n: return "NBC Sports"
              if "FOX SPORTS 2" in n: return "Fox Sports 2"
              if "FOX SPORTS" in n: return "Fox Sports 1"
              if "LA 1" in n: return "La 1 HD"
              if "LA 2" in n: return "La 2"
              if "CUATRO" in n: return "Cuatro HD"
              if "TELECINCO" in n: return "Telecinco HD"
              if "LA SEXTA" in n: return "La Sexta HD"
              if "ANTENA 3" in n: return "Antena 3 HD"
              if "TELEDEPORTE" in n: return "Teledeporte"
              if "ESPORT3" in n or "ESPORT 3" in n: return "Esport 3"
              if "REAL MADRID" in n: return "Real Madrid TV"
              if "A PUNT" in n or "À PUNT" in n: return "À Punt HD"
              if "PRIMERA" in n or "RFEF" in n or "1RFEF" in n: return "Primera Federación"
              if "NEOX" in n: return "Neox"
              if "NOVA" in n: return "Nova"
              if "MTV" in n: return "MTV España"
              if "NICKELODEON" in n: return "Nickelodeon HD"
              if "BABY TV" in n: return "Baby TV"
              if "24 HORAS" in n or "24H" in n: return "24 Horas"
              if "CLAN" in n: return "Clan"
              if "BEIN SPORTS XTRA" in n: return "beIN SPORTS XTRA ñ"
              return None

          # 1. Parsear los canales de Elcano
          lineas_elcano = fuente_elcano.splitlines()
          canales_raw = []
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_local = url

                      nombre_c = linea.rsplit(",", 1)[-1].upper()
                      extinf_mod = linea

                      # Asignación robusta de tvg-id
                      tvg_asignado = obtener_tvg_id(nombre_c)
                      if tvg_asignado:
                          if 'tvg-id=' in extinf_mod:
                              extinf_mod = re.sub(r'tvg-id="[^"]*"', f'tvg-id="{tvg_asignado}"', extinf_mod)
                          else:
                              extinf_mod = extinf_mod.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-id="{tvg_asignado}"')

                      # Forzar el group-title general
                      extinf_mod = re.sub(r'group-title="[^"]*"', 'group-title="⭐ ELCANO [MÁXIMA CALIDAD]"', extinf_mod)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="⭐ ELCANO [MÁXIMA CALIDAD]"')

                      canales_raw.append((nombre_c, extinf_mod, url_local))
                      i = j
              i += 1

          # Criterio de ordenación estricto
          def prioridad_elcano(item):
              nombre = item[0]
              es_multi = bool(re.search(r'\b(2|3|4|5|6|7|8|9|10)\b', nombre))

              if not es_multi or ("F1" in nombre or "MOTOGP" in nombre):
                  if "M+ LALIGA" in nombre: bloque = 1
                  elif "DAZN LALIGA" in nombre: bloque = 2
                  elif "MOVISTAR PLUS" in nombre or "MOVISTAR+" in nombre: bloque = 3
                  elif "CAMPEONES" in nombre: bloque = 4
                  elif "F1" in nombre or "FORMULA 1" in nombre: bloque = 5
                  elif "MOTOGP" in nombre: bloque = 6
                  elif "DAZN 1" in nombre: bloque = 7
                  elif "DEPORTES" in nombre: bloque = 8
                  elif "VAMOS" in nombre: bloque = 10
                  elif "HYPERMOTION" in nombre: bloque = 11
                  elif "PRIMERA" in nombre or "RFEF" in nombre or "1RFEF" in nombre: bloque = 12
                  else: bloque = 14
              else:
                  bloque = 14

              if es_multi and any(x in nombre for x in ["LALIGA", "CAMPEONES", "DAZN", "VAMOS", "HYPERMOTION", "DEPORTES", "BALONCESTO"]):
                  bloque = 13

              if any(x in nombre for x in ["AZTECA", "FOX SPORTS", "RALLY TV", "CUATRO", "TELEDEPORTE", "TELECINCO", "LA 1", "LA 2", "ESPORT3", "A PUNT", "À PUNT", "REAL MADRID", "ONE TORO", "ONETORO", "NEOX", "NOVA", "MTV", "NICKELODEON", "BABY TV", "24 HORAS", "CLAN", "ESTRENOS", "ACCION", "ACCIÓN", "CINE ESPAÑOL", "COMEDIA", "HITS", "DRAMA", "INDIE", "ROMANCE", "TERROR", "DARK", "AXN MOVIES", "ORIGINALES", "CALLE 13", "AMC", "AXN", "COMEDY CENTRAL", "SYFY", "SKYSHOWTIME", "HBO MAX", "DOCUMENTALES", "COCINA", "CAZA Y PESCA"]):
                      bloque = 15

              if "1080" in nombre or "4K" in nombre:
                  calidad = 0
              elif "720" in nombre:
                  calidad = 2
              else:
                  calidad = 1

              return (bloque, calidad, nombre)

          canales_ordenados = sorted(canales_raw, key=prioridad_elcano)

          bloque_automatico = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          for _, inf, u in canales_ordenados:
              bloque_automatico.append(inf)
              bloque_automatico.append(u)

          texto_nuevo_elcano = "\n".join(bloque_automatico)

          def extraer_nombres_zona_auto(texto_m3u):
              nombres = set()
              en_zona_auto = False
              for linea in texto_m3u.splitlines():
                  if "ZONA AUTOMATICA" in linea:
                      en_zona_auto = True
                      continue
                  if "ZONA PERSONAL" in linea or "CARPETA:" in linea or "SECCIÓN:" in linea:
                      en_zona_auto = False
                  if en_zona_auto and linea.startswith("#EXTINF:"):
                      if "," in linea:
                          nombres.add(linea.rsplit(",", 1)[-1].strip().upper())
              return nombres

          canales_viejos = extraer_nombres_zona_auto(contenido_casa)
          
          canales_nuevos_set = set()
          for linea in texto_nuevo_elcano.splitlines():
              if linea.startswith("#EXTINF:") and "," in linea:
                  canales_nuevos_set.add(linea.rsplit(",", 1)[-1].strip().upper())

          agregados = sorted(list(canales_nuevos_set - canales_viejos))
          eliminados = sorted(list(canales_viejos - canales_nuevos_set))

          timestamp_actual = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")

          reporte_md = f"# 🔄 Resumen de cambios en ELCANO - {timestamp_actual}\n\n"
          reporte_md += f"### 🟢 Canales Nuevos ({len(agregados)}):\n"
          reporte_md += "\n".join([f"- {c}" for c in agregados]) if agregados else "- Ninguno en esta actualización."
          reporte_md += f"\n\n### 🔴 Canales Eliminados por Elcano ({len(eliminados)}):\n"
          reporte_md += "\n".join([f"- {c}" for c in eliminados]) if eliminados else "- Ninguno."

          Path("ultimos_cambios.md").write_text(reporte_md, encoding="utf-8")

          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*CARPETA:\s*LA LIGA', contenido_casa, maxsplit=1)
          
          if len(partes) > 1:
              cuerpo_personal = "# CARPETA: LA LIGA" + partes[1]
          else:
              partes_alt = re.split(r'(?i)#\s*={5,}\s*\n#\s*SECCIÓN:', contenido_casa, maxsplit=1)
              cuerpo_personal = partes_alt[1] if len(partes_alt) > 1 else contenido_casa

          cuerpo_personal = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_personal).strip()

          cabecera_m3u = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n'
              '#EXTGRP: group-title="⭐ ELCANO [MÁXIMA CALIDAD]" group-logo="https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20LaLiga.png"\n\n'
          )
          
          texto_final = (
              cabecera_m3u + 
              texto_nuevo_elcano + 
              "\n\n\n# ==========================================\n" +
              "# ZONA PERSONAL: TUS CATEGORÍAS Y LISTAS\n" +
              "# ==========================================\n\n" + 
              cuerpo_personal + 
              f"\n\n# Ultima sincronizacion: {timestamp_actual}\n"
          )

          archivo_casa.write_text(texto_final, encoding="utf-8")
          texto_ts = texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_ts, encoding="utf-8")
          archivo_amigos.write_text(texto_final, encoding="utf-8")

          print("¡Sincronización completa con EPG infalible para todos los canales!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos" "ultimos_cambios.md"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática: EPG robusta y completa"
            git push
          else
            echo "No hay cambios que guardar."
          fi

