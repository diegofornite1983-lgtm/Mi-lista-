name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar manteniendo tu lista limpia y agrupando Elcano al final
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          # 1. Leer tu lista limpia de casa
          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          # 2. Descargar los nuevos enlaces de Elcano
          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def extraer_entradas(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          entradas.append((linea, url))
                          i = j
                  i += 1
              return entradas

          canales_elcano = extraer_entradas(fuente_elcano)
          
          # Detectar qué URLs ya tienes para no duplicar
          urls_existentes = set(re.findall(r'https?://[^\s]+|acestream://[a-zA-Z0-9]+', contenido_casa))
          
          novedades = []
          for extinf, url in canales_elcano:
              if url not in urls_existentes:
                  novedades.append((extinf, url))

          print(f"Se han encontrado {len(novedades]} canales nuevos de Elcano.")

          # 3. Guardar la lista de casa INTACTA (solo con tus cosas y IPs 127.0.0.1)
          # Limpiamos posibles restos de ejecuciones anteriores si los hubiera
          limpia_casa = contenido_casa.split("# ==========================================\n# CARPETA: CANALES NUEVOS ELCANO")[0]
          archivo_casa.write_text(limpia_casa.strip() + "\n", encoding="utf-8")

          # 4. Crear el archivo de Tailscale con tu IP fija y la carpeta dedicada de Elcano al final
          contenido_ts = limpia_casa.strip()
          
          if novedades:
              bloque_elcano = "\n\n# ==========================================\n# CARPETA: CANALES NUEVOS ELCANO\n# ==========================================\n"
              for extinf, url in novedades:
                  # Si vienen con localhost, las adaptamos a Tailscale
                  url_ts = url.replace("127.0.0.1:6878", "100.90.204.66:6878")
                  bloque_elcano += f"{extinf}\n{url_ts}\n"
              contenido_ts += bloque_elcano

          # Convertir todas las IPs del archivo de Tailscale a tu IP de Tailscale
          contenido_ts = contenido_ts.replace("127.0.0.1:6878", "100.90.204.66:6878")
          
          archivo_tailscale.write_text(contenido_ts.strip() + "\n", encoding="utf-8")
          print("Archivos sincronizados correctamente.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Lista de casa intacta y Tailscale con carpeta limpia de Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
