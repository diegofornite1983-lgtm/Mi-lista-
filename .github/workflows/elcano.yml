name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano y clasificar ordenadamente
        run: |
          python <<'PY'
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          destino = Path("Mi lista acestream")

          if not destino.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream' en la raíz.")

          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def leer_m3u_completo(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url,
                              "nombre": nombre
                          })
                          i = j
                  i += 1
              return entradas

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          try:
              original = destino.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = destino.read_text(encoding="latin-1")

          canales_fuente = leer_m3u_completo(fuente)
          canales_mios = leer_m3u_completo(original)

          urls_existentes = {c["url"] for c in canales_mios}
          nombres_existentes = {normalizar(c["nombre"]) for c in canales_mios}

          nuevos = []
          for canal in canales_fuente:
              nombre_id = normalizar(canal["nombre"])
              if not nombre_id or nombre_id in nombres_existentes or canal["url"] in urls_existentes:
                  continue
              nuevos.append(canal)
              nombres_existentes.add(nombre_id)
              urls_existentes.add(canal["url"])

          if not nuevos:
              print("No hay canales nuevos que añadir. La lista se mantiene intacta.")
              sys.exit(0)

          def detectar_grupo(nombre_canal):
              n = nombre_canal.upper()
              if "LALIGA" in n or "LIGA" in n:
                  return "LA LIGA Y DAZN LIGA"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n:
                  return "DAZN 1"
              elif "HYPERMOTION" in n:
                  return "HYPERMOTION"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "DEPORTES" in n or "VAMOS" in n or "GOLF" in n or "UFC" in n:
                  return "MOVISTAR DEP-VAMOS"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN"
              else:
                  return "MOVISTAR"

          pendientes_por_grupo = {}
          for c in nuevos:
              g = detectar_grupo(c["nombre"])
              if g not in pendientes_por_grupo:
                  pendientes_por_grupo[g] = []
              pendientes_por_grupo[g].append(c)

          lineas_org = original.splitlines()
          nuevas_lineas = []
          
          i = 0
          while i < len(lineas_org):
              l = lineas_org[i]
              nuevas_lineas.append(l)
              if "CARPETA:" in l.upper():
                  for nombre_carp, lista_c in list(pendientes_por_grupo.items()):
                      if nombre_carp.upper() in l.upper():
                          nuevas_lineas.append("") 
                          for nc in lista_c:
                              # Asegurar group-title correcto para que vaya a su carpeta sin duplicar
                              extinf_mod = nc["extinf"]
                              if 'group-title="' in extinf_mod:
                                  extinf_mod = re.sub(r'group-title="[^"]*23"', f'group-title="{nombre_carp}"', extinf_mod)
                              nuevas_lineas.append(extinf_mod)
                              nuevas_lineas.append(nc["url"])
                          nuevas_lineas.append("")
                          del pendientes_por_grupo[nombre_carp]
              i += 1

          if pendientes_por_grupo:
              nuevas_lineas.append("")
              nuevas_lineas.append("# ==========================================")
              nuevas_lineas.append("# CARPETA: OTROS CANALES NUEVOS ELCANO")
              nuevas_lineas.append("# ==========================================")
              for g, lista_c in pendientes_por_grupo.items():
                  for nc in lista_c:
                      nuevas_lineas.append(nc["extinf"])
                      nuevas_lineas.append(nc["url"])

          destino.write_text("\n".join(nuevas_lineas) + "\n", encoding="utf-8")
          print(f"Se han añadido {len(nuevos)} canales nuevos ordenados en sus carpetas.")
          PY

      - name: Generar Canales m3u para Tailscale
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizar carpetas limpias y actualizar Tailscale"
            git push
          else
            echo "No hay cambios que guardar."
          fi
