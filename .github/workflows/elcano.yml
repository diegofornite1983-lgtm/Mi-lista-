name: Actualizador Automatico Elcano, Tailscale y Amigos

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización automática ELCANO, Tailscale y Amigos
        run: |
          python <<'PY'
          import re
          import sys
          import datetime
          import unicodedata
          import urllib.request
          from pathlib import Path

          # ==========================================================
          # CONFIGURACION
          # ==========================================================

          URL_ELCANO = (
              "https://tokyo2.elcano-ipfs.workers.dev/"
              "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/"
              "hashes_acestream.m3u"
          )

          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          # TU LOGOTIPO PERSONALIZADO MODERNO
          URL_LOGO_PERSONAL = "https://raw.githubusercontent.com/cristorodriguez13517-maker/p/refs/heads/main/plus%20(1).png"

          # UNIFICAMOS EL TVG-ID PARA QUE COJA LA MISMA EPG QUE TUS CANALES MANUALES
          TGV_ID_MOVISTAR_UNIFICADO = "Movistar Plus HD"

          GROUP_TITLE = "⭐ ELCANO [MÁXIMA CALIDAD]"

          # ==========================================================
          # COMPROBAR ARCHIVO PRINCIPAL
          # ==========================================================

          if not archivo_casa.is_file():
              sys.exit(
                  "ERROR: No se encuentra el archivo "
                  "'Mi lista acestream'. No se modifica ningún archivo."
              )

          try:
              contenido_casa = archivo_casa.read_bytes().decode("utf-8-sig")
          except UnicodeDecodeError:
              try:
                  contenido_casa = archivo_casa.read_bytes().decode("latin-1")
              except Exception as error:
                  sys.exit(f"ERROR leyendo la lista principal: {error}")

          salto = "\r\n" if "\r\n" in contenido_casa else "\n"

          # ==========================================================
          # LOCALIZAR Y PROTEGER LAS CARPETAS PERSONALES
          # ==========================================================

          lineas_casa = contenido_casa.splitlines(keepends=True)

          marcador_personal = re.compile(
              r"^\s*#?\s*(CARPETA:|ZONA PERSONAL:|SECCI[ÓO]N:)",
              re.IGNORECASE
          )

          indice_personal = None

          for indice, linea in enumerate(lineas_casa):
              if marcador_personal.search(linea):
                  indice_personal = indice
                  break

          if indice_personal is None:
              sys.exit(
                  "ERROR DE SEGURIDAD: No se ha encontrado el comienzo "
                  "de tus carpetas personales (CARPETA:, ZONA PERSONAL: "
                  "o SECCIÓN:). No se modifica ni sobrescribe ningún archivo."
              )

          inicio_personal = indice_personal

          while inicio_personal > 0:
              anterior = lineas_casa[inicio_personal - 1].strip()

              if not anterior or re.fullmatch(r"#\s*=+", anterior):
                  inicio_personal -= 1
              else:
                  break

          cuerpo_personal = "".join(lineas_casa[inicio_personal:])

          # ==========================================================
          # DESCARGAR ELCANO
          # ==========================================================

          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={
                      "User-Agent": "Mozilla/5.0",
                      "Accept": "*/*"
                  }
              )

              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode(
                      "utf-8-sig",
                      errors="replace"
                  )

          except Exception as error:
              sys.exit(
                  f"ERROR descargando Elcano: {error}. "
                  "No se modifica ningún archivo."
              )

          # ==========================================================
          # FUNCIONES AUXILIARES
          # ==========================================================

          def normalizar(texto):
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  caracter for caracter in texto
                  if unicodedata.category(caracter) != "Mn"
              )
              return texto.upper().strip()


          def poner_atributo(linea, atributo, valor):
              patron = rf'{re.escape(atributo)}="[^"]*"'

              if re.search(patron, linea, flags=re.IGNORECASE):
                  return re.sub(
                      patron,
                      f'{atributo}="{valor}"',
                      linea,
                      count=1,
                      flags=re.IGNORECASE
                  )

              return linea.replace(
                  "#EXTINF:-1",
                  f'#EXTINF:-1 {atributo}="{valor}"',
                  1
              )


          def limpiar_y_forzar_m0(linea):
              linea = re.sub(r'tvg-id="[^"]*"', '', linea, flags=re.IGNORECASE)
              linea = re.sub(r'tvg-logo="[^"]*"', '', linea, flags=re.IGNORECASE)
              linea = re.sub(r'\s+', ' ', linea)
              linea = linea.replace('#EXTINF:-1 ', '#EXTINF:-1 ')
              
              nuevo_sufijo = f'tvg-id="{TGV_ID_MOVISTAR_UNIFICADO}" tvg-logo="{URL_LOGO_PERSONAL}"'
              return linea.replace('#EXTINF:-1', f'#EXTINF:-1 {nuevo_sufijo}', 1)


          def numero_canal(nombre):
              coincidencia = re.search(
                  r"\b([1-9])\b",
                  nombre
              )

              if coincidencia:
                  return int(coincidencia.group(1))

              return 0


          def calidad_canal(nombre):
              if "4K" in nombre:
                  return 0

              if "1080" in nombre:
                  return 1

              if "720" in nombre:
                  return 2

              return 3


          # ==========================================================
          # ORDEN ESTRICTO DE CANALES
          # ==========================================================

          def prioridad_canal(canal):
              nombre_original = canal["nombre"]
              nombre = normalizar(nombre_original)

              numero = numero_canal(nombre)
              calidad = calidad_canal(nombre)

              if (
                  nombre.startswith("MOVISTAR PLUS")
                  or nombre.startswith("MOVISTAR+")
              ):
                  return (0, 0, calidad, canal["indice"])

              if re.search(r"\bM\+\s*0\b", nombre):
                  return (1, 0, calidad, canal["indice"])

              if (
                  ("LALIGA" in nombre or "LA LIGA" in nombre or "DAZN LALIGA" in nombre)
                  and "HYPERMOTION" not in nombre
              ):
                  if nombre.startswith("M+"):
                      suborden = 0
                  elif "DAZN" in nombre:
                      suborden = 1
                  else:
                      suborden = 2

                  return (2, suborden, numero, calidad, canal["indice"])

              if "CAMPEONES" in nombre or "CHAMPIONS" in nombre:
                  return (3, numero, calidad, canal["indice"])

              if "DEPORTES" in nombre and "BALONCESTO" not in nombre:
                  return (4, numero, calidad, canal["indice"])

              if "F1" in nombre or "FORMULA 1" in nombre:
                  return (5, 0, calidad, canal["indice"])

              if "MOTOGP" in nombre:
                  return (5, 1, calidad, canal["indice"])

              if (
                  "DAZN" in nombre
                  and not any(
                      palabra in nombre
                      for palabra in (
                          "F1",
                          "FORMULA",
                          "MOTOGP",
                          "LALIGA",
                          "BALONCESTO"
                      )
                  )
              ):
                  return (6, numero, calidad, canal["indice"])

              if "VAMOS" in nombre:
                  return (7, 0, numero, calidad, canal["indice"])

              if "HYPERMOTION" in nombre:
                  return (8, 0, numero, calidad, canal["indice"])

              if (
                  "RFEF" in nombre
                  or "PRIMERA FEDERACION" in nombre
              ):
                  return (9, 0, nombre, calidad, canal["indice"])

              if "GOLF" in nombre:
                  return (10, 0, numero, calidad, canal["indice"])

              if "EUROSPORT" in nombre:
                  return (10, 1, calidad, canal["indice"])

              if (
                  "TENIS" in nombre
                  or "TENNIS" in nombre
              ):
                  return (10, 2, calidad, canal["indice"])

              if "SPORT TV" in nombre:
                  return (10, 3, calidad, canal["indice"])

              if (
                  "BALONCESTO" not in nombre
                  and not nombre.startswith("NBA")
                  and not es_tdt_abierto(nombre)
              ):
                  return (11, 0, nombre, calidad, canal["indice"])

              if (
                  "BALONCESTO" in nombre
                  or nombre.startswith("NBA")
              ):
                  return (12, numero, calidad, canal["indice"])

              if es_tdt_abierto(nombre):
                  return (13, 0, nombre, calidad, canal["indice"])

              return (11, 0, nombre, calidad, canal["indice"])


          def es_tdt_abierto(nombre):
              canales_abiertos = (
                  "CUATRO",
                  "TELECINCO",
                  "TELEDEPORTE",
                  "ESPORT3",
                  "A PUNT",
                  "APUNT",
                  "LA 1",
                  "LA 2",
                  "LA 3",
                  "TVE",
                  "ANTENA 3",
                  "ANTENA3",
                  "LA SEXTA",
                  "LASEXTA",
                  "REAL MADRID TV",
                  "ONETORO",
                  "ONE TORO"
              )

              return any(canal in nombre for canal in canales_abiertos)


          # ==========================================================
          # LEER Y PROCESAR LOS CANALES DE ELCANO
          # ==========================================================

          lineas_elcano = fuente_elcano.splitlines()
          canales = []

          indice = 0

          while indice < len(lineas_elcano):
              linea = lineas_elcano[indice].strip()

              if not linea.startswith("#EXTINF:"):
                  indice += 1
                  continue

              url = None
              siguiente = indice + 1

              while siguiente < len(lineas_elcano):
                  candidata = lineas_elcano[siguiente].strip()

                  if candidata and not candidata.startswith("#"):
                      url = candidata
                      break

                  siguiente += 1

              if not url:
                  indice += 1
                  continue

              nombre = linea.rsplit(",", 1)[-1].strip()
              nombre_normalizado = normalizar(nombre)

              extinf_mod = linea

              # ------------------------------------------------------
              # DICCIONARIO MILIMÉTRICO Y EXACTO PARA TODOS LOS CANALES
              # ------------------------------------------------------

              # 1. Movistar Plus Clásico
              if nombre_normalizado.startswith("MOVISTAR PLUS") or nombre_normalizado.startswith("MOVISTAR+"):
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", TGV_ID_MOVISTAR_UNIFICADO)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", URL_LOGO_PERSONAL)

              # 2. M+ 0
              elif re.search(r"\bM\+\s*0\b", nombre_normalizado):
                  extinf_mod = limpiar_y_forzar_m0(extinf_mod)

              # 3. Movistar Deportes (Del 1 al 8 exactos)
              elif "DEPORTES" in nombre_normalizado and "BALONCESTO" not in nombre_normalizado:
                  if " 2" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 2 HD", "https://i.ibb.co/q95fBKV/deportes2.png"
                  elif " 3" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 3", "https://i.ibb.co/jDg5qWD/deportes3.png"
                  elif " 4" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 4", "https://i.ibb.co/WDN9NN9/deportes4.png"
                  elif " 5" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 5", "https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/spain/deportes-5-por-movistar-plus-es.png"
                  elif " 6" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 6", "https://www.movistarplus.es/recorte/n/caratula5/M2114916V1621463"
                  elif " 7" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 7", "https://www.movistarplus.es/recorte/n/caratula5/M2114916V1621463"
                  elif " 8" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Deportes 8", "https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/spain/deportes-8-por-movistar-plus-es.png"
                  else:
                      tvg_id, logo_url = "M+ Deportes HD", "https://i.ibb.co/CV4CLjz/deportes.png"
                  
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", tvg_id)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", logo_url)

              # 4. Liga de Campeones (Del 1 al 8 exactos)
              elif "CAMPEONES" in nombre_normalizado or "CHAMPIONS" in nombre_normalizado:
                  if " 2" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Liga de Campeones 2 HD", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%202.png"
                  elif " 3" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Liga de Campeones 3 HD", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%203.png"
                  elif " 4" in nombre_normalizado:
                      tvg_id, logo_url = "M+ Liga de Campeones 4", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%204.png"
                  elif any(n in nombre_normalizado for n in [" 5", " 6", " 7", " 8"]):
                      num_c = re.search(r'\b([5-8])\b', nombre_normalizado).group(1)
                      tvg_id, logo_url = f"M+ Liga de Campeones {num_c}", f"https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%20{num_c}.png"
                  else:
                      tvg_id, logo_url = "M+ Liga de Campeones HD", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones.png"
                  
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", tvg_id)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", logo_url)

              # 5. LaLiga / DAZN LaLiga
              elif "LALIGA" in nombre_normalizado or "LA LIGA" in nombre_normalizado:
                  if "DAZN LALIGA 2" in nombre_normalizado:
                      tvg_id, logo_url = "DAZN LaLiga 2 HD", "https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/spain/dazn-laliga-2-es.png"
                  elif "DAZN LALIGA" in nombre_normalizado:
                      tvg_id, logo_url = "DAZN LaLiga HD", "https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/spain/dazn-laliga-es.png"
                  elif " 2" in nombre_normalizado:
                      tvg_id, logo_url = "M+ LaLiga 2 HD", "https://i.ibb.co/Tc97zSb/liga2.png"
                  elif " 3" in nombre_normalizado:
                      tvg_id, logo_url = "M+ LaLiga 3 HD", "https://i.ibb.co/BZF0xG9/liga3.png"
                  else:
                      tvg_id, logo_url = "M+ LaLiga HD", "https://i.ibb.co/yfV1Q8n/liga.png"
                  
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", tvg_id)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", logo_url)

              # 6. DAZN (F1, MotoGP, Baloncesto y del 1 al 4)
              elif "DAZN" in nombre_normalizado:
                  if "F1" in nombre_normalizado or "FORMULA 1" in nombre_normalizado:
                      tvg_id, logo_url = "DAZN F1 HD", "https://i.ibb.co/2Ndmtbp/f1.png"
                  elif "MOTOGP" in nombre_normalizado:
                      tvg_id, logo_url = "DAZN MotoGP", "https://hips.hearstapps.com/vader-prod.s3.amazonaws.com/1772006365-dazn-motogp-699eaba85423e.jpg"
                  elif "BALONCESTO" in nombre_normalizado:
                      num_b = re.search(r'\b([1-3])\b', nombre_normalizado)
                      num_b_str = f" {num_b.group(1)}" if num_b else ""
                      tvg_id, logo_url = f"DAZN Baloncesto{num_b_str}".strip(), "https://www.adslzone.net/app/uploads-adslzone.net/2025/12/dazn-baloncesto-movistar-plus.png"
                  elif " 2" in nombre_normalizado:
                      tvg_id, logo_url = "DAZN 2 HD", "https://i.ibb.co/Kz0GXSX/dazn2.png"
                  else:
                      num_d = re.search(r'\b([1-4])\b', nombre_normalizado)
                      num_d_str = num_d.group(1) if num_d else "1"
                      tvg_id, logo_url = f"DAZN {num_d_str} HD", "https://i.ibb.co/FVzKq1y/dazn1.png"
                  
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", tvg_id)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", logo_url)

              # 7. Onetoro
              elif "ONETORO" in nombre_normalizado or "ONE TORO" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Onetoro")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/Onetoro.png")

              # ------------------------------------------------------
              # GROUP-TITLE DE LA ZONA AUTOMÁTICA
              # ------------------------------------------------------

              extinf_mod = poner_atributo(
                  extinf_mod,
                  "group-title",
                  GROUP_TITLE
              )

              # ------------------------------------------------------
              # CONVERTIR HASH ACESTREAM A DIRECCIÓN LOCAL
              # ------------------------------------------------------

              coincidencia_hash = re.search(
                  r"([0-9a-fA-F]{40})",
                  url
              )

              if coincidencia_hash:
                  hash_id = coincidencia_hash.group(1)

                  url_final = (
                      "http://127.0.0.1:6878/ace/getstream?id="
                      + hash_id
                  )
              else:
                  url_final = url

              canales.append({
                  "nombre": nombre,
                  "extinf": extinf_mod,
                  "url": url_final,
                  "indice": len(canales)
              })

              indice = siguiente + 1

          if not canales:
              sys.exit(
                  "ERROR: Elcano no ha proporcionado canales válidos. "
                  "No se modifica ningún archivo."
              )

          # ==========================================================
          # ORDEN SIN ELIMINAR CANALES NI DUPLICADOS
          # ==========================================================

          canales_ordenados = sorted(
              canales,
              key=prioridad_canal
          )

          # ==========================================================
          # CONSTRUIR LA ZONA AUTOMÁTICA
          # ==========================================================

          bloque_automatico = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]

          for canal in canales_ordenados:
              bloque_automatico.append(canal["extinf"])
              bloque_automatico.append(canal["url"])

          texto_nuevo_elcano = salto.join(bloque_automatico)

          # ==========================================================
          # COMPARAR CANALES PARA EL INFORME
          # ==========================================================

          def extraer_nombres(texto):
              nombres = set()

              for linea in texto.splitlines():
                  if linea.startswith("#EXTINF:") and "," in linea:
                      nombres.add(
                          linea.rsplit(",", 1)[-1].strip().upper()
                      )

              return nombres


          zona_anterior = "".join(lineas_casa[:inicio_personal])

          canales_viejos = extraer_nombres(zona_anterior)
          canales_new = extraer_nombres(texto_nuevo_elcano)

          agregados = sorted(canales_new - canales_viejos)
          eliminados = sorted(canales_viejos - canales_new)

          timestamp_actual = datetime.datetime.now().strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          reporte = [
              f"# Resumen de cambios ELCANO - {timestamp_actual}",
              "",
              f"## Canales nuevos ({len(agregados)})"
          ]

          if agregados:
              reporte.extend(f"- {canal}" for canal in agregados)
          else:
              reporte.append("- Ninguno.")

          reporte.extend([
              "",
              f"## Canales eliminados ({len(eliminados)})"
          ])

          if eliminados:
              reporte.extend(f"- {canal}" for canal in eliminados)
          else:
              reporte.append("- Ninguno.")

          Path("ultimos_cambios.md").write_text(
              "\n".join(reporte),
              encoding="utf-8"
          )

          # ==========================================================
          # CABECERA M3U
          # ==========================================================

          cabecera_m3u = (
              '#EXTM3U url-tvg="'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" '
              'refresh="3600"'
              + salto
              + '#EXTVLCOPT:network-caching=1000'
              + salto
              + '#EXTGRP: group-title="⭐ ELCANO [MÁXIMA CALIDAD]" '
              'group-logo="https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20LaLiga.png"'
              + salto
              + salto
          )

          # ==========================================================
          # MONTAR ARCHIVO SIN TOCAR LA ZONA PERSONAL
          # ==========================================================

          separador = salto + salto

          texto_final = (
              cabecera_m3u
              + texto_nuevo_elcano
              + separador
              + cuerpo_personal
          )

          bloque_tailscale = texto_nuevo_elcano.replace(
              "127.0.0.1:6878",
              "100.90.204.66:6878"
          )

          texto_tailscale = (
              cabecera_m3u
              + bloque_tailscale
              + separador
              + cuerpo_personal
          )

          texto_amigos = texto_final

          # ==========================================================
          # COMPROBACIONES FINALES ANTES DE ESCRIBIR
          # ==========================================================

          if cuerpo_personal not in texto_final:
              sys.exit(
                  "ERROR: La comprobación de la zona personal ha fallado. "
                  "No se guardan los archivos."
              )

          if cuerpo_personal not in texto_tailscale:
              sys.exit(
                  "ERROR: La zona personal de Tailscale no coincide. "
                  "No se guardan los archivos."
              )

          # ==========================================================
          # GUARDAR ARCHIVOS
          # ==========================================================

          archivo_casa.write_bytes(
              texto_final.encode("utf-8")
          )

          archivo_tailscale.write_bytes(
              texto_tailscale.encode("utf-8")
          )

          archivo_amigos.write_bytes(
              texto_amigos.encode("utf-8")
          )

          print("==========================================")
          print("SINCRONIZACIÓN COMPLETADA")
          print("==========================================")
          print(f"Canales procesados: {len(canales_ordenados)}")
          print(f"Canales nuevos: {len(agregados)}")
          print(f"Canales eliminados: {len(eliminados)}")
          print('Diccionario milimétrico aplicado correctamente')
          print("Carpetas personales: conservadas sin cambios")
          print("Casa, Tailscale y Amigos: actualizados")
          print("==========================================")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos" "ultimos_cambios.md"
          
          if ! git diff --cached --quiet; then
