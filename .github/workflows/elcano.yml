name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta CADA HORA
  workflow_dispatch: # Botón de ejecución manual

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de GitHub
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script inyector de IDs
        run: |
          python << 'EOF'
          import urllib.request
          import re
          import os

          url_elcano = "http://elcano.top"
          ruta_mia = "lista-elcano.txt"

          if not os.path.exists(ruta_mia):
              print(f"Error: No existe el archivo base '{ruta_mia}' en el repositorio.")
              exit(1)

          # 1. Descargar fuente externa
          try:
              req = urllib.request.Request(
                  url_elcano, 
                  headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  }
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  contenido_elcano = r.read().decode("utf-8", errors="ignore")
          except Exception as e:
              print(f"Error crítico al descargar la fuente de Elcano: {e}")
              exit(1)

          # 2. Función para normalizar nombres
          def limpiar_nombre(n):
              n = n.strip().lower()
              n = n.replace("抢", "").replace("⭐", "").replace("movistar", "m+").replace("liga", "laliga")
              n = re.sub(r"\s+[a-f0-9]{4,5}$", "", n)
              n = re.sub(r"\s*\*+\s*$", "", n)
              return "".join(n.split())

          # 3. Mapear enlaces de Elcano
          diccionario_elcano = {}
          lineas_fuente = contenido_elcano.splitlines()
          for idx, l in enumerate(lineas_fuente):
              if l.strip().startswith("#EXTINF"):
                  match_name = re.search(r",\s*(.*)", l)
                  if match_name and (idx + 1) < len(lineas_fuente):
                      nxt = lineas_fuente[idx + 1].strip()
                      if nxt.startswith("http"):
                          nombre_limpio = limpiar_nombre(match_name.group(1))
                          diccionario_elcano[nombre_limpio] = nxt

          print(f"Canales detectados en la fuente externa: {len(diccionario_elcano)}")

          # 4. Leer lista propia y actualizar
          with open(ruta_mia, "r", encoding="utf-8", errors="ignore") as f:
              lineas_mias = f.readlines()

          lineas_nuevas = []
          i = 0
          actualizados = 0

          while i < len(lineas_mias):
              linea = lineas_mias[i]
              lineas_nuevas.append(linea)

          if linea.strip().startswith("#EXTINF"):
                  match_mia = re.search(r",\s*(.*)", linea)
                  if match_mia:
                      nombre_mia_limpio = limpiar_nombre(match_mia.group(1))
                      url_nueva = diccionario_elcano.get(nombre_mia_limpio)

                      if not url_nueva:
                          for k, v in diccionario_elcano.items():
                              if nombre_mia_limpio in k or k in nombre_mia_limpio:
                                  url_nueva = v
                                  break

                      if (i + 1) < len(lineas_mias):
                          siguiente_linea = lineas_mias[i+1].strip()
                          if siguiente_linea.startswith("http") or "getstream" in siguiente_linea:
                              if url_nueva:
                                  lineas_nuevas.append(url_nueva + "\n")
                                  actualizados += 1
                              else:
                                  lineas_nuevas.append(lineas_mias[i+1])
                              i += 1 
              i += 1

          print(f"Canales actualizados con éxito: {actualizados}")

          # 5. Guardar los cambios de vuelta en el archivo txt
          with open(ruta_mia, "w", encoding="utf-8") as f:
              f.writelines(lineas_nuevas)
          EOF

      - name: Guardar cambios y subir a GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add lista-elcano.txt
          if ! git diff --cached --quiet; then
            git commit -m "Lista de canales actualizada automáticamente por Elcano Bot"
            git push
          else
            echo "No hay cambios detectados en los canales."
          fi
