
name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-elcano
  cancel-in-progress: false

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sincronizacion inteligente de Elcano
        run: |
          python <<'PY'
          import re
          import sys
          import time
          import unicodedata
          import requests
          from pathlib import Path

          # ==========================================
          # CONFIGURACION
          # ==========================================

          URLS_ELCANO = [
              "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",

              "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u",

              "https://ipfs.io/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          ARCHIVO = Path("Mi lista acestream")

          URL_LOCAL = "http://127.0.0.1:6878/ace/getstream?id="

          # ==========================================
          # DESCARGA CON REINTENTOS
          # ==========================================

          def descargar_elcano():

              sesion = requests.Session()

              sesion.headers.update({
                  "User-Agent": "Mozilla/5.0 (compatible; ElcanoUpdater/1.0)",
                  "Accept": "application/vnd.apple.mpegurl, application/x-mpegURL, text/plain, */*"
              })

              for url in URLS_ELCANO:

                  for intento in range(3):

                      try:
                          print(f"Descargando: {url}")
                          respuesta = sesion.get(url, timeout=30)

                          if respuesta.status_code == 200:

                              contenido = respuesta.text

                              if "#EXTM3U" in contenido:
                                  print("Lista Elcano descargada correctamente.")
                                  return contenido

                              print("Respuesta recibida, pero no es una lista M3U.")
                              break

                          if respuesta.status_code == 429:
                              espera = 15 * (intento + 1)

                              retry = respuesta.headers.get("Retry-After", "")
                              if retry.isdigit():
                                  espera = max(espera, min(int(retry), 60))

                              print(f"Limite 429. Esperando {espera} segundos.")
                              time.sleep(espera)
                              continue

                          if respuesta.status_code >= 500:
                              espera = 15 * (intento + 1)
                              print(f"Error {respuesta.status_code}. Esperando {espera}s.")
                              time.sleep(espera)
                              continue

                          print(f"Error HTTP {respuesta.status_code}. Probando otra fuente.")
                          break

                      except requests.RequestException as error:
                          print(f"Error de conexion: {error}")
                          if intento < 2:
                              time.sleep(15 * (intento + 1))

              return None

          # ==========================================
          # NORMALIZAR NOMBRES
          # ==========================================

          def normalizar(nombre):

              nombre = unicodedata.normalize("NFKD", nombre)
              nombre = "".join(
                  c for c in nombre
                  if not unicodedata.combining(c)
              )

              return re.sub(
                  r"[^A-Z0-9]",
                  "",
                  nombre.upper()
              )

          # ==========================================
          # EXTRAER HASH ACESTREAM
          # ==========================================

          def obtener_hash(url):

              match = re.search(
                  r"(?i)([a-f0-9]{40})",
                  url
              )

              return match.group(1).lower() if match else None

          # ==========================================
          # LEER CANALES DE ELCANO
          # ==========================================

          def parsear_m3u(texto):

              lineas = texto.splitlines()
              canales = []
              i = 0

              while i < len(lineas):

                  linea = lineas[i].strip()

                  if linea.startswith("#EXTINF:"):

                      j = i + 1

                      while j < len(lineas):

                          candidata = lineas[j].strip()

                          if candidata and not candidata.startswith("#"):
                              break

                          j += 1

                      if j < len(lineas):

                          hash_id = obtener_hash(lineas[j])

                          if hash_id:

                              nombre = linea.rsplit(",", 1)[-1].strip()

                              canales.append({
                                  "nombre": nombre,
                                  "normalizado": normalizar(nombre),
                                  "extinf": linea,
                                  "hash": hash_id,
                                  "url": URL_LOCAL + hash_id
                              })

                          i = j

                  i += 1

              return canales

          # ==========================================
          # COMPROBAR ARCHIVO PRINCIPAL
          # ==========================================

          if not ARCHIVO.is_file():
              sys.exit("ERROR: No existe Mi lista acestream.")

          try:
              contenido = ARCHIVO.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido = ARCHIVO.read_text(encoding="latin-1")

          if not contenido.strip().startswith("#EXTM3U"):
              sys.exit("ERROR: El archivo principal no es una M3U valida.")

          # ==========================================
          # DESCARGAR ELCANO
          # ==========================================

          fuente = descargar_elcano()

          if not fuente:
              sys.exit("ERROR: Ninguna fuente de Elcano ha respondido. No se modifica ningun archivo.")

          canales = parsear_m3u(fuente)

          if not canales:
              sys.exit("ERROR: Elcano no contiene canales con hashes validos.")

          print(f"Canales validos encontrados: {len(canales)}")

          # ==========================================
          # CREAR MAPA DE CANALES
          # ==========================================

          mapa = {}

          for canal in canales:
              mapa[canal["normalizado"]] = canal

          # ==========================================
          # ACTUALIZAR CANALES EXISTENTES
          # SIN CAMBIAR SUS METADATOS
          # ==========================================

          lineas = contenido.splitlines()
          resultado = []
          nombres_existentes = set()

          actualizados = 0
          i = 0

          while i < len(lineas):

              linea = lineas[i]
              resultado.append(linea)

              if linea.strip().startswith("#EXTINF:"):

                  nombre = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm = normalizar(nombre)

                  nombres_existentes.add(nombre_norm)

                  j = i + 1

                  while j < len(lineas):

                      candidata = lineas[j].strip()

                      if candidata and not candidata.startswith("#"):
                          break

                      j += 1

                  if j < len(lineas):

                      for k in range(i + 1, j):
                          resultado.append(lineas[k])

                      if nombre_norm in mapa:

                          url_nueva = mapa[nombre_norm]["url"]
                          url_actual = lineas[j].strip()

                          if url_actual != url_nueva:
                              actualizados += 1
                              print(f"Actualizado: {nombre}")

                          resultado.append(url_nueva)

                      else:
                          resultado.append(lineas[j])

                      i = j + 1

                  else:
                      i += 1

              else:
                  i += 1

          # ==========================================
          # AÑADIR CANALES NUEVOS
          # SIN DUPLICADOS
          # ==========================================

          nuevos = 0
          vistos = set(nombres_existentes)

          for canal in canales:

              nombre_norm = canal["normalizado"]

              if not nombre_norm or nombre_norm in vistos:
                  continue

              extinf = canal["extinf"]

              # Conservar la categoria de Elcano.
              # Si no existe, crear una categoria de nuevos.

              if "group-title=" not in extinf.lower():

                  partes = extinf.split(",", 1)

                  if len(partes) == 2:
                      extinf = (
                          partes[0]
                          + ' group-title="ELCANO - NUEVOS",'
                          + partes[1]
                      )

              resultado.append(extinf)
              resultado.append(canal["url"])

              vistos.add(nombre_norm)
              nuevos += 1

              print(f"CANAL NUEVO: {canal['nombre']} | HASH: {canal['hash']}")

          # ==========================================
          # GUARDAR SOLO SI HAY CAMBIOS
          # ==========================================

          lista_final = "\n".join(resultado) + "\n"

          if lista_final != contenido:

              temporal = ARCHIVO.with_suffix(".tmp")

              temporal.write_text(
                  lista_final,
                  encoding="utf-8"
              )

              temporal.replace(ARCHIVO)

              print("Archivo Mi lista acestream guardado.")

          else:
              print("No hay cambios. Se conserva el archivo original.")

          # ==========================================
          # RESUMEN
          # ==========================================

          print("")
          print("================================")
          print("       RESUMEN DE ELCANO")
          print("================================")
          print(f"Canales encontrados: {len(canales)}")
          print(f"Canales actualizados: {actualizados}")
          print(f"Canales nuevos: {nuevos}")
          print("Canales antiguos conservados.")
          print("Metadatos existentes conservados.")
          print("Canales m3u: SIN MODIFICAR")
          print("================================")

          PY

      # ==========================================
      # GUARDAR CAMBIOS EN GITHUB
      # ==========================================

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"

          git add -- "Mi lista acestream"

          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automatica Elcano"
            git push
            echo "Cambios guardados correctamente."
          else
            echo "No hay cambios nuevos que guardar."
          fi
