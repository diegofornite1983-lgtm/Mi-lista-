name: Prueba Elcano Pura en Tiempo Real

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar-elcano:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descarga Pura de Elcano
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          f_casa = Path("Mi lista acestream")
          f_ts = Path("Canales m3u")
          f_amigos = Path("lista-amigos")

          if not f_casa.is_file():
              sys.exit("ERROR: No existe el archivo 'Mi lista acestream'")

          # 1. Leer el archivo local para conservar la Zona Personal de abajo
          try:
              contenido_local = f_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_local = f_casa.read_text(encoding="latin-1")

          # 2. Descargar la lista directamente de la web de Elcano en vivo
          try:
              req = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  fuente_elcano = resp.read().decode("utf-8-sig", errors="replace")
          except Exception as e:
              sys.exit(f"ERROR conectando a Elcano: {e}")

          # 3. Procesar SOLO lo que viene en la web de Elcano tal cual
          lineas = fuente_elcano.splitlines()
          bloque_elcano = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          
          contador = 0
          i = 0
          while i < len(lineas):
              linea = lineas[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas):
                      cand = lineas[j].strip()
                      if cand and not cand.startswith("#"):
                          url = cand
                          break
                      j += 1
                  if url:
                      # Extraer Hash y convertir a IP local AceStream
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      url_local = f"http://127.0.0.1:6878/ace/getstream?id={match_h.group(1)}" if match_h else url

                      # Asignar a la carpeta estrella sin alterar el nombre que haya puesto Elcano
                      if 'group-title=' in linea:
                          linea_mod = re.sub(r'group-title="[^"]*"', 'group-title="⭐ ELCANO [MÁXIMA CALIDAD]"', linea)
                      else:
                          linea_mod = linea.replace('#EXTINF:-1', '#EXTINF:-1 group-title="⭐ ELCANO [MÁXIMA CALIDAD]"')

                      bloque_elcano.append(linea_mod)
                      bloque_elcano.append(url_local)
                      contador += 1
                      i = j
              i += 1

          print(f"Canales leídos EN VIVO desde Elcano: {contador}")
          if contador == 0:
              sys.exit("ERROR: Elcano no ha devuelto ningún canal.")

          texto_elcano = "\n".join(bloque_elcano)

          # 4. Respetar tus carpetas personales de abajo
          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*CARPETA:', contenido_local, maxsplit=1)
          if len(partes) > 1:
              cuerpo_personal = "# CARPETA:" + partes[1]
          else:
              partes_alt = re.split(r'(?i)#\s*={5,}\s*\n#\s*SECCIÓN:', contenido_local, maxsplit=1)
              cuerpo_personal = partes_alt[1] if len(partes_alt) > 1 else contenido_local

          cuerpo_personal = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_personal).strip()

          # 5. Cabecera básica de la lista
          cabecera = "#EXTM3U\n#EXTVLCOPT:network-caching=1000\n\n"

          final_casa = (
              cabecera + 
              texto_elcano + 
              "\n\n\n# ==========================================\n" +
              "# ZONA PERSONAL\n" +
              "# ==========================================\n\n" + 
              cuerpo_personal + "\n"
          )

          # 6. Escribir archivos de Casa, Tailscale y Amigos
          f_casa.write_text(final_casa, encoding="utf-8")
          f_ts.write_text(final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878"), encoding="utf-8")
          f_amigos.write_text(final_casa, encoding="utf-8")
          
          print("¡Vuelco directo finalizado con éxito!")
          PY

      - name: Guardar en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          git diff --cached --quiet || git commit -m "Vuelco 100% puro directo de Elcano" && git push
