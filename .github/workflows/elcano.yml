name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización limpia de Elcano y listas personales
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # 1. Parsear Elcano y ordenar arriba
          lineas_elcano = fuente_elcano.splitlines()
          canales_raw = []
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_local = url

                      extinf_mod = re.sub(r'group-title="[^"]*"', 'group-title="ELCANO"', linea)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="ELCANO"')

                      nombre_c = linea.rsplit(",", 1)[-1].upper()
                      canales_raw.append((nombre_c, extinf_mod, url_local))
                      i = j
              i += 1

          def prioridad_elcano(item):
              n = item[0]
              if "M+ LALIGA" in n: return 1
              if "DAZN LALIGA" in n: return 2
              if "CAMPEONES" in n: return 3
              if "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n: return 4
              if "F1" in n: return 5
              if "MOTOGP" in n: return 6
              if "DEPORTES" in n or "VAMOS" in n: return 7
              if "BALONCESTO" in n: return 8
              return 9

          canales_ordenados = sorted(canales_raw, key=prioridad_elcano)

          bloque_elcano = [
              "# ==========================================",
              "# CARPETA: ELCANO",
              "# =========================================="
          ]
          for _, inf, u in canales_ordenados:
              bloque_elcano.append(inf)
              bloque_elcano.append(u)

          # 2. Conservar todo tu archivo original a partir de tu primera categoría o separador
          lineas_casa = contenido_casa.splitlines()
          lineas_personales = []
          copiando = False

          for linea in lineas_casa:
              if linea.startswith("#EXTM3U") or linea.startswith("#EXTVLCOPT"):
                  continue
              # Detectar el inicio de tus categorías personales reales
              if "CARPETA: LA LIGA" in linea or "CARPETA: MOVISTAR" in linea or "group-title=" in linea and "ELCANO" not in linea:
                  copiando = True
              
              if copiando:
                  lineas_personales.append(linea)

          # Si por lo que sea no detectó la bandera, metemos todo lo que no sea el viejo ELCANO
          if not lineas_personales:
              saltando = False
              for linea in lineas_casa:
                  if linea.startswith("#EXTM3U") or linea.startswith("#EXTVLCOPT"):
                      continue
                  if "CARPETA: ELCANO" in linea:
                      saltando = True
                      continue
                  if saltando and ("CARPETA:" in linea or "TUS CATEGORÍAS" in linea):
                      saltando = False
                  if not saltando:
                      lineas_personales.append(linea)

          # Estructura EPG exacta de David Muma y cabecera
          cabecera_epg = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n'
          )

          separador = (
              "\n\n# ==========================================\n"
              "# TUS CATEGORÍAS ORIGINALES\n"
              "# ==========================================\n"
          )

          texto_final = cabecera_epg + "\n" + "\n".join(bloque_elcano) + separador + "\n".join(lineas_personales) + "\n"

          archivo_casa.write_text(texto_final, encoding="utf-8")

          texto_ts = texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_ts, encoding="utf-8")

          print("¡Actualización completada con éxito!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática de listas y ELCANO"
            git push
          else
            echo "No hay cambios que guardar."
          fi
