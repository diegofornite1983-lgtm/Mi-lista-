name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano y actualizar hashes respetando EPG
        id: update
        run: |
          python <<'PY'
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          
          # Buscar cualquier archivo .m3u, .m3u8 o .txt en todo el repositorio de forma automática
          archivos = [
              p for p in Path(".").rglob("*")
              if p.is_file() and p.suffix.lower() in (".m3u", ".m3u8", ".txt") and ".git" not in p.parts
          ]

          if not archivos:
              sys.exit("ERROR: No se ha encontrado ningún archivo M3U o TXT en el repositorio.")

          # Si hay varios, cogemos el primero que no sea un archivo del sistema o logs
          destino = archivos[0]
          print(f"Archivo de lista detectado: {destino}")

          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          if "#EXTM3U" not in fuente or "#EXTINF:" not in fuente:
              sys.exit("ERROR: La dirección de Elcano no ha devuelto una lista M3U válida.")

          try:
              original = destino.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = destino.read_text(encoding="latin-1")

          # Extraer enlaces de la fuente de Elcano
          def extraer_enlaces_fuente(texto):
              lineas = texto.splitlines()
              mapa_canales = {}
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_id = re.search(r'tvg-id="([^"]*)"', linea)
                          tvg_id = match_id.group(1) if match_id else None
                          nombre_limpio = linea.rsplit(",", 1)[-1].strip()
                          mapa_canales[nombre_limpio.lower()] = url
                          if tvg_id:
                              mapa_canales[tvg_id.lower()] = url
                      i = j
                  i += 1
              return mapa_canales

          mapa_elcano = extraer_enlaces_fuente(fuente)

          # Actualizar manteniendo estrictamente el esqueleto y tvg-id
          lineas_originales = original.splitlines()
          nuevas_lineas = []
          i = 0
          actualizados = 0

          while i < len(lineas_originales):
              linea = lineas_originales[i].strip()
              nuevas_lineas.append(lineas_originales[i])

              if linea.startswith("#EXTINF:"):
                match_tvg = re.search(r'tvg-id="([^"]*)"', linea)
                nombre_canal = linea.rsplit(",", 1)[-1].strip()
                
                url_idx = i + 1
                while url_idx < len(lineas_originales):
                    candidata = lineas_originales[url_idx].strip()
                    if candidata and not candidata.startswith("#"):
                        break
                    url_idx += 1

                nueva_url = None
                if match_tvg and match_tvg.group(1).lower() in mapa_elcano:
                    nueva_url = mapa_elcano[match_tvg.group(1).lower()]
                elif nombre_canal.lower() in mapa_elcano:
                    nueva_url = mapa_elcano[nombre_canal.lower()]

                if url_idx < len(lineas_originales):
                    if nueva_url and nueva_url != lineas_originales[url_idx].strip():
                        nuevas_lineas.append(nueva_url)
                        actualizados += 1
                    else:
                        nuevas_lineas.append(lineas_originales[url_idx])
                    i = url_idx
              i += 1

          destino.write_text("\n".join(nuevas_lineas) + "\n", encoding="utf-8")

          print(f"Archivo actualizado correctamente: {destino}")
          print(f"Canales con hashes actualizados: {actualizados}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(f"path={destino.as_posix()}\n")
          PY

      - name: Guardar cambios en GitHub
        env:
          TARGET_FILE: ${{ steps.update.outputs.path }}
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add -- "$TARGET_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar hashes de Elcano manteniendo estructura EPG"
            git push
          else
            echo "No hay cambios nuevos que guardar."
          fi
