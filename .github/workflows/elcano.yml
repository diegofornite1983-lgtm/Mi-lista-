name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano Modo Blindado
        run: |
          python3 -c '
          import urllib.request, re, subprocess
          from pathlib import Path

          # Enlaces alternativos y espejos directos sin restricciones de Cloudflare
          urls = [
              "https://raw.githubusercontent.com/lucas-m-o-o-m/elcano/main/hashes_acestream.m3u",
              "https://corsproxy.io/?https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://r.jina.ai/https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          fuente = None
          for url in urls:
              try:
                  print(f"Probando enlace alternativo: {url}")
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15",
                      "Accept": "*/*"
                  })
                  with urllib.request.urlopen(req, timeout=15) as res:
                      data = res.read().decode("utf-8-sig", errors="replace")
                      if data and "#EXTINF" in data:
                          fuente = data
                          print("¡Conectado y descargado con éxito!")
                          break
              except Exception as e:
                  print(f"Intento fallido: {e}")

          path = Path("Mi lista acestream")
          if not path.exists(): 
              print("ERROR: No existe el archivo Mi lista acestream")
              exit(0)
              
          orig = path.read_text(encoding="utf-8-sig", errors="replace")

          if not fuente or "#EXTINF" not in fuente:
              print("AVISO: Las pasarelas externas están ocupadas. Se mantiene tu lista actual intacta y operativa para Tailscale.")
              exit(0)
          
          hashes = {}
          for m in re.finditer(r"#EXTINF:[^\n]*,\s*([^\n]+)\n(http[^\n]+)", fuente):
              nombre = m.group(1).strip().upper()
              link = m.group(2).strip()
              h_match = re.search(r"([0-9a-fA-F]{40})", link)
              if h_match:
                  hashes[re.sub(r"[^A-Z0-9]", "", nombre)] = f"http://127.0.0.1:6878/ace/getstream?id={h_match.group(1)}"

          lines = orig.splitlines()
          new_lines = []
          i = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_canal.upper())
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                        new_lines.append(hashes[norm])
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          print("¡Lista sincronizada y hashes actualizados correctamente!")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync hashes y Tailscale" && git push)
