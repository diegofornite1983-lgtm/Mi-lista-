name: Sincronizar Elcano Directo

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualizar lista desde la URL de Elcano
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_lista = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          if not archivo_lista.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          # 1. Leer tu archivo actual para conservar tu Zona Personal de abajo
          try:
              contenido_actual = archivo_lista.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_actual = archivo_lista.read_text(encoding="latin-1")

          # 2. Descargar la lista en vivo directamente de la URL de Elcano
          try:
              req = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "VLC/3.0.18"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  fuente_elcano = resp.read().decode("utf-8-sig", errors="replace")
          except Exception as e:
              sys.exit(f"ERROR descargando la URL de Elcano: {e}")

          # 3. Extraer y formatear los canales de la web de Elcano
          lineas = fuente_elcano.splitlines()
          bloque_nuevo = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          
          contador = 0
          i = 0
          while i < len(lineas):
              linea = lineas[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas):
                      cand = lineas[j].strip()
                      if cand and not cand.startswith("#"):
                          url = cand
                          break
                      j += 1
                  if url:
                      # Extraer el hash de 40 caracteres de Elcano y adaptarlo a tu reproductor local
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={match_h.group(1)}"
                      else:
                          url_local = url

                      # Asegurar que la categoría sea la estrella arriba del todo
                      if 'group-title=' in linea:
                          linea_mod = re.sub(r'group-title="[^"]*"', 'group-title="⭐ ELCANO [MÁXIMA CALIDAD]"', linea)
                      else:
                          linea_mod = linea.replace('#EXTINF:-1', '#EXTINF:-1 group-title="⭐ ELCANO [MÁXIMA CALIDAD]"')

                      bloque_nuevo.append(linea_mod)
                      bloque_nuevo.append(url_local)
                      contador += 1
                      i = j
              i += 1

          print(f"Canales importados directamente desde la URL: {contador}")
          if contador == 0:
              sys.exit("ERROR: La URL de Elcano no devolvió canales.")

          texto_elcano_generado = "\n".join(bloque_nuevo)

          # 4. Separar tu zona personal inferior (respetando tus carpetas hechas a mano)
          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*(?:CARPETA|SECCIÓN):', contenido_actual, maxsplit=1)
          if len(partes) > 1:
              cuerpo_personal = "# CARPETA:" + partes[1]
          else:
              # Si no encuentra el separador exacto, intenta buscar el inicio de la zona personal
              partes_alt = re.split(r'(?i)#\s*={5,}\s*\n#\s*ZONA PERSONAL.*', contenido_actual, maxsplit=1)
              cuerpo_personal = partes_alt[1] if len(partes_alt) > 1 else ""

          # Limpiar marcas viejas de sincronización para que quede impecable
          cuerpo_personal = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_personal).strip()

          # 5. Estructura final del archivo M3U (Con la EPG de David Muma arriba)
          cabecera_m3u = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n\n'
          )
          
          texto_final = (
              cabecera_m3u + 
              texto_elcano_generado + 
              "\n\n\n# ==========================================\n" +
              "# ZONA PERSONAL\n" +
              "# ==========================================\n\n" + 
              cuerpo_personal + "\n"
          )

          # 6. Guardar en tus tres archivos automáticamente
          archivo_lista.write_text(texto_final, encoding="utf-8")
          archivo_tailscale.write_text(texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878"), encoding="utf-8")
          archivo_amigos.write_text(texto_final, encoding="utf-8")
          print("¡Proceso completado con éxito!")
          PY

      - name: Subir cambios a GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          git diff --cached --quiet || git commit -m "Sincronizacion automatica desde la URL de Elcano" && git push
