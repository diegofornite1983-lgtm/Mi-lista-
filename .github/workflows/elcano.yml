name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano Local IPFS
        run: |
          python3 -c '
          import urllib.request, re
          from pathlib import Path

          url = "http://127.0.0.1:8080/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          
          fuente = None
          try:
              print("Conectando al nodo local IPFS...")
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as res:
                  fuente = res.read().decode("utf-8-sig", errors="replace")
          except Exception as e:
              print(f"Aviso de red local: {e}")

          # Si por lo que sea el local no responde en el runner, usar espejo directo de respaldo
          if not fuente or "#EXTINF" not in fuente:
              url_respaldo = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
              try:
                  print("Probando respaldo remoto...")
                  req = urllib.request.Request(url_respaldo, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      fuente = res.read().decode("utf-8-sig", errors="replace")
              except Exception as e:
                  print(f"Respaldo también ocupado: {e}")

          path = Path("Mi lista acestream")
          if not path.exists():
              exit(0)

          orig = path.read_text(encoding="utf-8-sig", errors="replace")

          if not fuente or "#EXTINF" not in fuente:
              print("Mantenemos la lista actual intacta.")
              exit(0)

          hashes = {}
          for m in re.finditer(r"#EXTINF:[^\n]*,\s*([^\n]+)\n(http[^\n]+)", fuente):
              nombre = m.group(1).strip().upper()
              link = m.group(2).strip()
              h_match = re.search(r"([0-9a-fA-F]{40})", link)
              if h_match:
                  nombre_limpio = re.sub(r"\b(720p|1080p|4K|HD)\b", "", nombre, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r"[\*⭐️]", "", nombre_limpio).strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_limpio)
                  hashes[norm] = f"http://127.0.0.1:6878/ace/getstream?id={h_match.group(1)}"

          lines = orig.splitlines()
          new_lines = []
          i = 0
          actualizados = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  nombre_limpio = re.sub(r"\b(720p|1080p|4K|HD)\b", "", nombre_canal, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r"[\*⭐️]", "", nombre_limpio).strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_limpio)
                  
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                          new_lines.append(hashes[norm])
                          actualizados += 1
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          print(f"Canales sincronizados con éxito: {actualizados}")
          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync Elcano OK" && git push)
