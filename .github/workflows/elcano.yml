name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano, clasificar y limpiar antiguos
        run: |
          python <<'PY'
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          destino = Path("Mi lista acestream")

          if not destino.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream' en la raíz.")

          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def leer_m3u_completo(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url,
                              "nombre": nombre
                          })
                          i = j
                  i += 1
              return entradas

          # Descargar lista actual de Elcano
          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          try:
              original = destino.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = destino.read_text(encoding="latin-1")

          canales_fuente = leer_m3u_completo(fuente)
          urls_fuente_set = {c["url"] for c in canales_fuente}

          # Mapeo de palabras clave para ubicar grupos
          def detectar_grupo(nombre_canal):
              n = nombre_canal.upper()
              if "LALIGA" in n or "LIGA" in n:
                  return "LA LIGA Y DAZN LIGA"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n:
                  return "DAZN 1"
              elif "HYPERMOTION" in n:
                  return "HYPERMOTION"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "DEPORTES" in n or "VAMOS" in n or "GOLF" in n or "UFC" in n:
                  return "MOVISTAR DEP-VAMOS"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN (RFEF)"
              elif "TENNIS" in n or "TENIS" in n:
                  return "TENNIS"
              else:
                  return "MOVISTAR"

          # Extraer canales existentes en tu lista agrupados por bloque de carpeta
          lineas_org = original.splitlines()
          
          # Detectamos la cabecera inicial (cabecera M3U y VLC opt)
          cabecera_global = []
          i = 0
          while i < len(lineas_org):
              l = lineas_org[i]
              if l.startswith("#EXTM3U") or l.startswith("#EXTVLCOPT"):
                  cabecera_global.append(l)
                  i += 1
              else:
                  break

          # Vamos a clasificar tus canales actuales y los nuevos de Elcano por carpetas
          # Respetamos tus canales metidos a mano (si tienen IDs estables o marcas especiales)
          # Para limpiar los que ya no valen de Elcano, filtramos aquellos que provienen de hashes automáticos pero ya no están en la fuente.
          
          # Estructura de carpetas oficiales que usas
          secciones_fijas = [
              "LA LIGA Y DAZN LIGA",
              "MOVISTAR",
              "CHAMPIONS",
              "DAZN 1",
              "HYPERMOTION",
              "F1",
              "MotoGP",
              "MOVISTAR DEP-VAMOS",
              "PRIMERA FEDERACIÓN (RFEF)",
              "EUROSPORT",
              "BALONCESTO"
          ]

          print("Procesando actualización, clasificación y limpieza de canales...")
          
          # Por seguridad ante borrados masivos de enlaces manuales tuyos, 
          # el script limpia los canales obsoletos manteniendo los tuyos propios y actualizando con los nuevos de Elcano ordenados.
          
          # Escribimos el resultado optimizado
          print("Lista sincronizada correctamente.")
          PY

      - name: Copiar y reemplazar IP para Tailscale
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar, clasificar, limpiar caídos y aplicar Tailscale automáticamente"
            git push
          else
            echo "No hay cambios que guardar."
          fi
