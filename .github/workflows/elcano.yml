name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización quirúrgica: actualizar ELCANO arriba y dejar tus listas intactas
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # 1. Parsear Elcano y ordenar los canales clave arriba (Ligas, DAZN, Campeones, etc.)
          lineas_elcano = fuente_elcano.splitlines()
          canales_raw = []
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_local = url

                      # Asegurar group-title ELCANO
                      extinf_mod = re.sub(r'group-title="[^"]*"', 'group-title="ELCANO"', linea)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="ELCANO"')

                      # REGLA DE ORO: Conservar tvg-id y nombre exactos
                      nombre_c = linea.rsplit(",", 1)[-1].upper()
                      canales_raw.append((nombre_c, extinf_mod, url_local))
                      i = j
              i += 1

          # Criterio de ordenación para la carpeta ELCANO arriba
          def prioridad_elcano(item):
              n = item[0]
              if "M+ LALIGA" in n: return 1
              if "DAZN LALIGA" in n: return 2
              if "CAMPEONES" in n: return 3
              if "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n: return 4
              if "F1" in n: return 5
              if "MOTOGP" in n: return 6
              if "DEPORTES" in n or "VAMOS" in n: return 7
              if "BALONCESTO" in n: return 8
              return 9

          canales_ordenados = sorted(canales_raw, key=prioridad_elcano)

          # Construir el bloque exacto de ELCANO
          bloque_elcano = [
              "# ==========================================",
              "# CARPETA: ELCANO",
              "# =========================================="
          ]
          for _, inf, u in canales_ordenados:
              bloque_elcano.append(inf)
              bloque_elcano.append(u)

          texto_nuevo_elcano = "\n".join(bloque_elcano)

          # 2. Reemplazar únicamente el bloque antiguo de Elcano dentro de tu lista manteniendo TODO lo demás intacto
          # Buscamos el patrón desde "# CARPETA: ELCANO" hasta la primera categoría personal o separador de tus listas
          patron_reemplazo = re.compile(
              r'(#\s*={5,}\s*\n#\s*CARPETA:\s*ELCANO[\s\S]*?)(?=\n\s*#\s*={5,}\s*\n\s*#\s*(?:TUS CATEGORÍAS|CARPETA:\s*LA LIGA|LA LIGA Y DAZN))',
              re.IGNORECASE
          )

          if patron_reemplazo.search(contenido_casa):
              texto_final = patron_reemplazo.sub(texto_nuevo_elcano, contenido_casa, count=1)
          else:
              # Si por formato estricto no encuentra la frontera exacta, ponemos ELCANO arriba del todo 
              # conservando toda el agua de tu archivo original debajo
              cabecera_epg_match = re.search(r'(#EXTM3U.*?\n#EXTVLCOPT:network-caching=1000\n)', contenido_casa)
              if cabecera_epg_match:
                  cuerpo_resto = contenido_casa.replace(cabecera_epg_match.group(1), "")
                  # Quitamos un posible bloque viejo de ELCANO si estuviera suelto
                  cuerpo_resto = re.sub(r'#\s*={5,}\s*\n#\s*CARPETA:\s*ELCANO[\s\S]*?(?=#\s*={5,}\s*\n#\s*CARPETA:|\Z)', '', cuerpo_resto, count=1)
                  texto_final = cabecera_epg_match.group(1) + "\n" + texto_nuevo_elcano + "\n\n" + cuerpo_resto.strip() + "\n"
              else:
                  texto_final = texto_nuevo_elcano + "\n\n" + contenido_casa

          archivo_casa.write_text(texto_final, encoding="utf-8")

          # Versión Tailscale cambiando la IP del motor AceStream
          texto_ts = texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_ts, encoding="utf-8")

          print("¡Sincronización quirúrgica completada con éxito!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualización quirúrgica ELCANO y listas personales intactas"
            git push
          else
            echo "No hay cambios que guardar."
          fi
