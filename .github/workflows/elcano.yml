name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta CADA HORA
  workflow_dispatch: # Botón de ejecución manual

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio de GitHub
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Ejecutar script inyector de IDs
        run: |
          python << 'EOF'
          import urllib.request
          import re
          import os

          # Fuente publica de Elcano accesible desde servidores de GitHub
          url_elcano = "http://elcano.top/elcano.m3u"
          ruta_mia = "lista-elcano.txt"

          if not os.path.exists(ruta_mia):
              print(f"Error: No existe el archivo base '{ruta_mia}' en el repositorio.")
              exit(1)

          # 1. Descargar fuente de Elcano
          try:
              req = urllib.request.Request(url_elcano, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  contenido_elcano = r.read().decode("utf-8", errors="ignore")
          except Exception as e:
              print("Error al descargar la fuente de Elcano:", e)
              exit(0)

          # 2. Función para normalizar nombres y cruzar datos
          def limpiar_nombre(n):
              n = n.strip().lower()
              n = n.replace("⭐️", "").replace("movistar", "m+").replace("liga", "laliga")
              n = re.sub(r"\s+[a-f0-9]{4,5}$", "", n)
              n = re.sub(r"\s*\*+\s*$", "", n)
              return "".join(n.split())

          # 3. Mapear enlaces AceStream de Elcano
          diccionario_elcano = {}
          bloques = re.findall(r"(#EXTINF:.*?\n)(http://\S+)", contenido_elcano, re.DOTALL)

          for extinf, url in bloques:
              match_name = re.search(r",\s*(.*)", extinf)
              if match_name:
                  nombre_limpio = limpiar_nombre(match_name.group(1))
                  diccionario_elcano[nombre_limpio] = url.strip()

          # 4. Leer lista propia y actualizar únicamente el stream conservando tvg-id y estructura EPG
          with open(ruta_mia, "r", encoding="utf-8", errors="ignore") as f:
              lineas_mias = f.readlines()

          lineas_nuevas = []
          i = 0
          while i < len(lineas_mias):
              linea = lineas_mias[i]
              lineas_nuevas.append(linea)

              if linea.strip().startswith("#EXTINF"):
                  match_mia = re.search(r",\s*(.*)", linea)
                  if match_mia:
                      nombre_mia_limpio = limpiar_nombre(match_mia.group(1))
                      url_nueva = diccionario_elcano.get(nombre_mia_limpio)

                      if not url_nueva:
                          for k, v in diccionario_elcano.items():
                              if nombre_mia_limpio in k or k in nombre_mia_limpio:
                                  url_nueva = v
                                  break

                      if i + 1 < len(lineas_mias) and ("ace/getstream" in lineas_mias[i+1] or "http" in lineas_mias[i+1]):
                          if url_nueva:
                              lineas_nuevas.append(url_nueva + "\n")
                          else:
                              lineas_nuevas.append(lineas_mias[i+1])
                          i += 1
              i += 1

          # 5. Guardar cambios en el archivo del repositorio
          with open(ruta_mia, "w", encoding="utf-8") as f:
              f.writelines(lineas_nuevas)
          print("Sincronización completada con éxito.")
          EOF

      - name: Guardar y subir cambios a GitHub
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "lista-elcano.txt"
          git diff --quiet && git diff --staged --quiet || git commit -m "Actualización automática de enlaces AceStream"
          git push origin HEAD:main
