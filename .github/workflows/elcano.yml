name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano con Multi-Gateway y Curl
        run: |
          python3 -c '
          import urllib.request, re, subprocess
          from pathlib import Path

          urls = [
              "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://ipfs.io/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://gateway.pinata.cloud/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://cloudflare-ipfs.com/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          fuente = None
          # Intentar con urllib
          for url in urls:
              try:
                  print(f"Probando URL: {url}")
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      "Accept": "*/*"
                  })
                  with urllib.request.urlopen(req, timeout=12) as res:
                      data = res.read().decode("utf-8-sig", errors="replace")
                      if data and "#EXTINF" in data:
                          fuente = data
                          print("¡Descargado con éxito por urllib!")
                          break
              except Exception as e:
                  print(f"Fallo con urllib: {e}")

          # Si falla, forzar con subprocess curl
          if not fuente:
              for url in urls:
                  print(f"Intentando forzar con curl: {url}")
                  res = subprocess.run(["curl", "-sL", "--max-time", "15", "-A", "Mozilla/5.0", url], capture_output=True, text=True)
                  if res.returncode == 0 and res.stdout and "#EXTINF" in res.stdout:
                      fuente = res.stdout
                      print("¡Descargado con éxito mediante curl!")
                      break

          if not fuente or "#EXTINF" not in fuente:
              print("ERROR: Ninguna pasarela respondió. Abortando para no dañar la lista.")
              exit(0)

          path = Path("Mi lista acestream")
          if not path.exists(): 
              print("ERROR: No existe el archivo Mi lista acestream")
              exit(0)
              
          orig = path.read_text(encoding="utf-8-sig", errors="replace")
          
          hashes = {}
          for m in re.finditer(r"#EXTINF:[^\n]*,\s*([^\n]+)\n(http[^\n]+)", fuente):
              nombre = m.group(1).strip().upper()
              link = m.group(2).strip()
              h_match = re.search(r"([0-9a-fA-F]{40})", link)
              if h_match:
                  hashes[re.sub(r"[^A-Z0-9]", "", nombre)] = f"http://127.0.0.1:6878/ace/getstream?id={h_match.group(1)}"

          lines = orig.splitlines()
          new_lines = []
          i = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_canal.upper())
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                          new_lines.append(hashes[norm])
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          print("¡Sincronización y actualización de hashes completada con éxito!")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync Elcano hashes" && git push)
