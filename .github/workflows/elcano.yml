name: Actualizador Elcano Desde Cero

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar desde cero
        run: |
          python <<'PY'
          import re
          import sys
          import datetime
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo principal 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          # 1. Descargar la lista directamente de Elcano
          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # 2. Parsear canales y forzar la carpeta superior exacta con estrella
          lineas_elcano = fuente_elcano.splitlines()
          bloque_automatico = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          
          i = 0
          contador = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={match_h.group(1)}"
                      else:
                          url_local = url

                      # Forzar el group-title para que vaya directo a la carpeta con estrella
                      if 'group-title=' in linea:
                          linea_mod = re.sub(r'group-title="[^"]*"', 'group-title="⭐ ELCANO [MÁXIMA CALIDAD]"', linea)
                      else:
                          linea_mod = linea.replace('#EXTINF:-1', '#EXTINF:-1 group-title="⭐ ELCANO [MÁXIMA CALIDAD]"')

                      bloque_automatico.append(linea_mod)
                      bloque_automatico.append(url_local)
                      contador += 1
                      i = j
              i += 1

          print(f"Canales sincronizados desde Elcano: {contador}")
          if contador == 0:
              sys.exit("ERROR: La fuente de Elcano no devolvió ningún canal.")

          texto_nuevo_elcano = "\n".join(bloque_automatico)

          # 3. Respetar y extraer la zona personal inferior (tus carpetas intactas)
          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*CARPETA:', contenido_casa, maxsplit=1)
          if len(partes) > 1:
              cuerpo_personal = "# CARPETA:" + partes[1]
          else:
              partes_alt = re.split(r'(?i)#\s*={5,}\s*\n#\s*SECCIÓN:', contenido_casa, maxsplit=1)
              cuerpo_personal = partes_alt[1] if len(partes_alt) > 1 else contenido_casa

          cuerpo_personal = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_personal).strip()

          # 4. Cabecera limpia con la EPG de David Muma para los logos y la programación
          cabecera_m3u = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n\n'
          )

          timestamp_actual = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S")
          
          # 5. Unir todo en el texto final
          texto_final = (
              cabecera_m3u + 
              texto_nuevo_elcano + 
              "\n\n\n# ==========================================\n" +
              "# ZONA PERSONAL: TUS CATEGORÍAS Y LISTAS\n" +
              "# ==========================================\n\n" + 
              cuerpo_personal + 
              f"\n\n# Ultima sincronizacion: {timestamp_actual}\n"
          )

          # Guardar en los tres archivos
          archivo_casa.write_text(texto_final, encoding="utf-8")
          archivo_tailscale.write_text(texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878"), encoding="utf-8")
          archivo_amigos.write_text(texto_final, encoding="utf-8")

          print("¡Sincronización desde cero completada con éxito!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          
          if ! git diff --cached --quiet; then
            git commit -m "Sincronización limpia desde cero con Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
