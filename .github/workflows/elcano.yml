name: Sincronizar Elcano Seguro

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sincronizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualizar lista limpia
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          f_casa = Path("Mi lista acestream")
          f_ts = Path("Canales m3u")
          f_amigos = Path("lista-amigos")

          if not f_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_total = f_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_total = f_casa.read_text(encoding="latin-1")

          # 1. Descargar canales en vivo de la URL de Elcano
          try:
              req = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  fuente_elcano = resp.read().decode("utf-8-sig", errors="replace")
          except Exception as e:
              sys.exit(f"ERROR descargando Elcano: {e}")

          # 2. Extraer el bloque de Elcano limpio
          lineas = fuente_elcano.splitlines()
          bloque_elcano = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          
          contador = 0
          i = 0
          while i < len(lineas):
              linea = lineas[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas):
                      cand = lineas[j].strip()
                      if cand and not cand.startswith("#"):
                          url = cand
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      url_local = f"http://127.0.0.1:6878/ace/getstream?id={match_h.group(1)}" if match_h else url

                      if 'group-title=' in linea:
                          linea_mod = re.sub(r'group-title="[^"]*"', 'group-title="⭐ ELCANO [MÁXIMA CALIDAD]"', linea)
                      else:
                          linea_mod = linea.replace('#EXTINF:-1', '#EXTINF:-1 group-title="⭐ ELCANO [MÁXIMA CALIDAD]"')

                      bloque_elcano.append(linea_mod)
                      bloque_elcano.append(url_local)
                      contador += 1
                      i = j
              i += 1

          print(f"Canales de Elcano obtenidos: {contador}")

          # 3. Extraer tu Zona Personal respetando todo lo tuyo de abajo
          # Buscamos exactamente el inicio de tu zona personal en el archivo
          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*ZONA PERSONAL', contenido_total)
          if len(partes) > 1:
              cuerpo_personal = partes[1].strip()
          else:
              # Si por lo que sea no encuentra el título exacto, busca desde la primera carpeta personal
              partes_alt = re.split(r'(?i)#\s*CARPETA:', contenido_total, maxsplit=1)
              cuerpo_personal = ("# CARPETA:" + partes_alt[1]) if len(partes_alt) > 1 else ""

          # Limpiar marcas viejas
          cuerpo_personal = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_personal).strip()

          # 4. Construir el archivo final uniendo la cabecera EPG, Elcano arriba y tu zona personal intacta abajo
          cabecera_m3u = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n\n'
          )

          texto_final = (
              cabecera_m3u + 
              "\n".join(bloque_elcano) + 
              "\n\n\n# ==========================================\n" +
              "# ZONA PERSONAL\n" +
              "# ==========================================\n\n" + 
              cuerpo_personal + "\n"
          )

          # 5. Guardar en los tres archivos del repositorio
          f_casa.write_text(texto_final, encoding="utf-8")
          f_ts.write_text(texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878"), encoding="utf-8")
          f_amigos.write_text(texto_final, encoding="utf-8")
          print("¡Actualización completada!")
          PY

      - name: Subir a GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          git diff --cached --quiet || git commit -m "Sincronizacion limpia y segura" && git push
