name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano IPNS Oficial
        run: |
          python3 -c '
          import urllib.request, re
          from pathlib import Path

          # Pasarelas públicas IPNS oficiales que apuntan exactamente al nodo de Elcano
          urls = [
              "https://w3s.link/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://ipfs.io/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://dweb.link/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://gateway.pinata.cloud/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          fuente = None
          for url in urls:
              try:
                  print(f"Probando pasarela IPNS: {url}")
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as res:
                      data = res.read().decode("utf-8-sig", errors="replace")
                      if data and "#EXTINF" in data:
                          fuente = data
                          print("¡Descarga de hashes conseguida con éxito!")
                          break
              except Exception as e:
                  print(f"Fallo en pasarela: {e}")

          path = Path("Mi lista acestream")
          if not path.exists():
              exit(0)

          orig = path.read_text(encoding="utf-8-sig", errors="replace")

          if not fuente or "#EXTINF" not in fuente:
              print("AVISO: Pasarelas ocupadas. Se mantiene la lista actual intacta.")
              exit(0)

          hashes = {}
          for m in re.finditer(r"#EXTINF:[^\n]*,\s*([^\n]+)\n(http[^\n]+)", fuente):
              nombre = m.group(1).strip()
              link = m.group(2).strip()
              h_match = re.search(r"([0-9a-fA-F]{40})", link)
              if h_match:
                  nombre_limpio = re.sub(r"\b(720p|1080p|4K|HD)\b", "", nombre, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r"[\*⭐️]", "", nombre_limpio).strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_limpio.upper())
                  hashes[norm] = f"http://127.0.0.1:6878/ace/getstream?id={h_match.group(1)}"

          lines = orig.splitlines()
          new_lines = []
          i = 0
          actualizados = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  nombre_limpio = re.sub(r"\b(720p|1080p|4K|HD)\b", "", nombre_canal, flags=re.IGNORECASE)
                  nombre_limpio = re.sub(r"[\*⭐️]", "", nombre_limpio).strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_limpio.upper())
                  
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                          new_lines.append(hashes[norm])
                          actualizados += 1
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          print(f"¡Canales sincronizados y actualizados con éxito: {actualizados}!")
          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync Elcano IPNS OK" && git push)
