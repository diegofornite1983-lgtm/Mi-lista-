          # 1. Parsear Elcano y ordenar los canales clave arriba (Ligas, DAZN, Campeones, etc.)
          lineas_elcano = fuente_elcano.splitlines()
          canales_raw = []
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                        url = candidata
                        break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_local = url

                      # Asegurar group-title ELCANO
                      extinf_mod = re.sub(r'group-title="[^"]*"', 'group-title="ELCANO"', linea)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="ELCANO"')

                      # REGLA DE ORO: Conservar tvg-id y nombre numérico exactamente igual
                      # Prohibido cambiar tvg-id ni el nombre numérico final
                      nombre_c = linea.rsplit(",", 1)[-1].upper()
                      canales_raw.append((nombre_c, extinf_mod, url_local))
                      i = j
              i += 1

          # Criterio de ordenación para la carpeta ELCANO arriba
          def prioridad_elcano(item):
              nombre = item[0]
              if "M+ LALIGA" in nombre: return 1
              if "DAZN LALIGA" in nombre: return 2
              if "CAMPEONES" in nombre: return 3
              if "DAZN 1" in nombre or "DAZN 2" in nombre or "DAZN 3" in nombre or "DAZN 4" in nombre: return 4
              if "F1" in nombre: return 5
              if "MOTOGP" in nombre: return 6
              if "DEPORTES" in nombre or "VAMOS" in nombre: return 7
              if "BALONCESTO" in nombre: return 8
              return 9

          canales_ordenados = sorted(canales_raw, key=prioridad_elcano)

          # Construir bloque ELCANO con su barrera clara
          bloque_elcano = [
              "# ==========================================",
              "# CARPETA: ELCANO (CANALES OFICIALES)",
              "# =========================================="
          ]
          for _, inf, u in canales_ordenados:
              bloque_elcano.append(inf)
              bloque_elcano.append(u)

          # 2. Extraer tus categorías originales limpiando cualquier rastro viejo de Elcano
          lineas_casa = contenido_casa.splitlines()
          cuerpo_tus_categorias = []
          saltar_viejo = False

          for linea in lineas_casa:
              if linea.startswith("#EXTM3U") or linea.startswith("#EXTVLCOPT"):
                  continue
              if "CARPETA: ELCANO" in linea:
                  saltar_viejo = True
                  continue
              if saltar_viejo:
                  if "CARPETA:" in linea or "TUS CATEGORÍAS" in linea or "====================" in linea:
                      # Si encontramos otra sección o barrera, dejamos de saltar
                      saltar_viejo = False
                      cuerpo_tus_categorias.append(linea)
                  else:
                      continue
              if not saltar_viejo:
                  cuerpo_tus_categorias.append(linea)

          # Cabecera oficial EPG exacta (Estructura EPG_dobleM)
          cabecera_epg = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n'
          )

          # Barrera clara separando Elcano de tus categorías personales
          separador_barrera = (
              "\n\n# ==========================================\n"
              "# ZONA PERSONAL: TUS CATEGORÍAS Y LISTAS\n"
              "# ==========================================\n"
          )

          # Unir todo con orden absoluto
          texto_final = cabecera_epg + "\n" + "\n".join(bloque_elcano) + separador_barrera + "\n".join(cuerpo_tus_categorias) + "\n"

          archivo_casa.write_text(texto_final, encoding="utf-8")

          # Versión Tailscale cambiando la IP del motor AceStream
          texto_ts = texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_ts, encoding="utf-8")
