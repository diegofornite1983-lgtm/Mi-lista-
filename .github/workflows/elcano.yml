name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización forzada de Elcano sin mover carpetas
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # Extraer todos los hashes y nombres limpios de Elcano
          def parsear_elcano(texto):
              lineas = texto.splitlines()
              mapa = {}
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre_bruto = linea.rsplit(",", 1)[-1].strip()
                          # Limpieza profunda para asegurar cruce exacto
                          nombre_limpio = re.sub(r'[^A-Z0-9]', '', nombre_bruto.upper())
                          mapa[nombre_limpio] = url_limpia
                          i = j
                  i += 1
              return mapa

          mapa_elcano = parsear_elcano(fuente_elcano)

          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_limpio_casa = re.sub(r'[^A-Z0-9]', '', nombre_canal.upper())
                  
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      
                      # Busqueda directa o por coincidencia parcial para asegurar que pille el hash de Elcano
                      nueva_url = None
                      if nombre_limpio_casa in mapa_elcano:
                          nueva_url = mapa_elcano[nombre_limpio_casa]
                      else:
                          # Buscar si alguna clave de Elcano contiene el nombre o viceversa
                          for k, v in mapa_elcano.items():
                              if k in nombre_limpio_casa or nombre_limpio_casa in k:
                                  nueva_url = v
                                  break

                      if nueva_url:
                          lineas_actualizadas.append(nueva_url)
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              i += 1

          lista_final_casa = "\n".join(lineas_actualizadas) + ("\n" if not "".join(lineas_actualizadas).endswith("\n") else "")
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización forzada completada con éxito.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion forzada de hashes de Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
