name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generar lista con carpeta ELCANO al inicio y tu estructura intacta
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # 1. Parsear la lista de Elcano para armar la carpeta inicial "ELCANO"
          lineas_elcano = fuente_elcano.splitlines()
          bloque_elcano_generado = []
          bloque_elcano_generado.append("# ==========================================")
          bloque_elcano_generado.append("# CARPETA: ELCANO")
          bloque_elcano_generado.append("# ==========================================")
          
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      # Limpiar el enlace para que use tu motor local 127.0.0.1:6878
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                      else:
                          url_local = url

                      # Asegurar que el group-title de estos canales sea ELCANO
                      extinf_mod = re.sub(r'group-title="[^"]*"]*', 'group-title="ELCANO"', linea)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="ELCANO"')

                      bloque_elcano_generado.append(extinf_mod)
                      bloque_elcano_generado.append(url_local)
                      i = j
              i += 1

          bloque_elcano_generado.append("\n# ==========================================")
          bloque_elcano_generado.append("# TUS CATEGORÍAS ORIGINALES")
          bloque_elcano_generado.append("# ==========================================\n")

          # 2. Limpiar tu archivo base por si tuviera restos de pruebas anteriores y dejarlo puro
          # Mantenemos la cabecera EPG original intacta
          lineas_casa = contenido_casa.splitlines()
          cuerpo_original = []
          capturando = False

          for linea in lineas_casa:
              if linea.startswith("#EXTM3U") or linea.startswith("#EXTVLCOPT"):
                cuerpo_original.append(linea)
              elif "CARPETA: ELCANO" in linea:
                  capturando = False # Ignoramos bloques viejos de elcano si los hubiera
              elif linea.startswith("#EXTINF:") or linea.startswith("# =========================================="):
                  capturando = True
              
              if capturando:
                  cuerpo_original.append(linea)

          # Si no se filtró bien por seguridad, usamos todo el contenido exceptuando las cabeceras repetidas
          lineas_limpias_casa = [l for l in cuerpo_original if not l.startswith("#EXTM3U") and not l.startswith("#EXTVLCOPT")]

          # Cabecera oficial EPG de David Muma solicitada
          cabecera_epg = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n'
          )

          # Unir todo: Cabecera EPG + Carpeta ELCANO al principio + Tus carpetas originales intactas
          texto_final = cabecera_epg + "\n".join(bloque_elcano_generado) + "\n" + "\n".join(lineas_limpias_casa) + "\n"

          archivo_casa.write_text(texto_final, encoding="utf-8")

          # Versión Tailscale cambiando la IP del motor
          texto_ts = texto_final.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_ts, encoding="utf-8")

          print("Lista sincronizada con carpeta ELCANO al inicio y estructura respetada.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Estructura limpia con carpeta ELCANO al inicio y EPG"
            git push
          else
            echo "No hay cambios que guardar."
          fi
