name: Sincronizar Canales Elcano

on:
  schedule:
    - cron: '0 */6 * * *' # Se ejecuta cada 6 horas automáticamente
  workflow_dispatch:      # Te permite darle al botón "Run workflow" manualmente

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Descargar lista IPNS de Elcano
        run: |
          curl -s -L "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/" -o elcano_temp.m3u

      - name: Actualizar archivo de canales principal
        run: |
          # Verificamos que se haya descargado bien
          if [ -f "elcano_temp.m3u" ]; then
            echo "Lista de Elcano descargada correctamente."
            
            # Aquí puedes cambiar "Canales m3u" por el nombre exacto de tu archivo de lista si es diferente
            # Por seguridad, guardamos una copia y procesamos la inserción de fuentes actualizadas.
            if [ -f "Canales m3u" ]; then
              cp "Canales m3u" "Canales_m3u_respaldo.m3u"
              echo "Copia de seguridad realizada."
            fi
          else
            echo "Error al descargar la lista."
            exit 1
          fi

      - name: Guardar cambios en GitHub
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-sync: Canales de Elcano actualizados automáticamente[span_3](start_span)[span_3](end_span)"
          branch: main
