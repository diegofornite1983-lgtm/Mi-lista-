name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización definitiva y orden estricto de La Liga
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          import time
          from pathlib import Path

          # Pasarelas IPFS públicas oficiales en cascada para sortear el bloqueo 429
          urls_elcano = [
              "https://dweb.link/ipfs/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://gateway.pinata.cloud/ipfs/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://cloudflare-ipfs.com/ipfs/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          fuente_elcano = None
          headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"}

          for url in urls_elcano:
              try:
                  peticion = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(peticion, timeout=35) as respuesta:
                      texto_prueba = respuesta.read().decode("utf-8-sig", errors="replace")
                      if texto_prueba and "#EXTINF" in texto_prueba:
                          fuente_elcano = texto_prueba
                          print(f"¡Conectado con éxito a través de IPFS!")
                          break
              except Exception as e:
                  print(f"Fallo en pasarela: {e}")
                  time.sleep(1)
                  continue

          if not fuente_elcano:
              sys.exit("ERROR CRÍTICO: Todas las pasarelas de Elcano han dado error de red o 429.")

          def normalizar_nombre(nombre):
              n = nombre.upper()
              n = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', n)
              return "".join(n.split())

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre,
                              "raw_url": url
                          })
                          i = j
                  i += 1
              return entradas

          canales_elcano = parsear_m3u(fuente_elcano)
          mapa_elcano_por_nombre = {normalizar_nombre(c["nombre"]): c["url"] for c in canales_elcano}

          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          urls_en_casa = set()
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              
              if "#EXTINF:" in linea and 'tvg-id="Movistar Plus+ HD"' in linea:
                  nombre_mayus = linea.rsplit(",", 1)[-1].strip().upper()
                  if "LALIGA" in nombre_mayus or "LIGA" in nombre_mayus:
                      if "2" in nombre_mayus:
                          linea = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 2 HD"', linea)
                      elif "3" in nombre_mayus:
                          linea = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 3 HD"', linea)
                      else:
                          linea = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga HD"', linea)

              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm = normalizar_nombre(nombre_canal)
                  
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      urls_en_casa.add(url_actual)
                      
                      if nombre_norm in mapa_elcano_por_nombre:
                          nueva_url = mapa_elcano_por_nombre[nombre_norm]
                          lineas_actualizadas.append(nueva_url)
                          urls_en_casa.add(nueva_url)
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              elif not linea.startswith("#") and linea.strip():
                  urls_en_casa.add(linea.strip())
              i += 1

          def mapear_carpeta(nombre_canal, extinf_original):
              n = nombre_canal.upper()
              ext = extinf_original.upper()
              if "HYPERMOTION" in n or "HYPERMOTION" in ext:
                  return "HYPERMOTION"
              elif "CHAMPIONS" in n or "CAMPEONES" in n:
                  return "CHAMPIONS"
              elif "LALIGA" in n or "M+ LALIGA" in n or "DAZN LIGA" in n or ("LIGA" in n and "CAMPEONES" not in n):
                  return "LA LIGA Y DAZN LIGA"
              elif "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n:
                  return "DAZN"
              elif "F1" in n or "FORMULA" in n:
                  return "F1"
              elif "MOTOGP" in n:
                  return "MotoGP"
              elif "BALONCESTO" in n or "NBA" in n:
                  return "BALONCESTO"
              elif "EUROSPORT" in n:
                  return "EUROSPORT"
              elif "FEDERACION" in n or "RFEF" in n:
                  return "PRIMERA FEDERACIÓN"
              elif "ESTRENOS" in n or "ACCION" in n or "CINE" in n or "COMEDIA" in n or "HITS" in n or "DRAMA" in n or "INDIE" in n or "ROMANCE" in n or "TERROR" in n or "ORIGINALES" in n or "DOCUMENTALES" in n or "MOVISTAR PLUS" in n or "MOVISTAR+" in n:
                  return "MOVISTAR"
              else:
                  return "MOVISTAR DEP-VAMOS"

          novedades = []
          for c in canales_elcano:
              if c["url"] not in urls_en_casa and c["raw_url"] not in urls_en_casa:
                  novedades.append(c)

          clasificados = {}
          for c in novedades:
              carp = mapear_carpeta(c["nombre"], c["extinf"])
              if carp not in clasificados:
                  clasificados[carp] = []
              extinf_f = c["extinf"]
              if 'group-title="' in extinf_f:
                  extinf_f = re.sub(r'group-title="[^"]*"', f'group-title="{carp}"', extinf_f)
              else:
                  extinf_f = extinf_f.replace('#EXTINF:-1', f'#EXTINF:-1 group-title="{carp}"')
              clasificados[carp].append((c["nombre"], extinf_f, c["url"]))

          if "LA LIGA Y DAZN LIGA" in clasificados:
              lista_liga = clasificados["LA LIGA Y DAZN LIGA"]
              movistar_liga_nuevos = [ch for ch in lista_liga if "DAZN" not in ch[0].upper()]
              dazn_liga_nuevos = [ch for ch in lista_liga if "DAZN" in ch[0].upper()]
              clasificados["LA LIGA Y DAZN LIGA"] = movistar_liga_nuevos + dazn_liga_nuevos

          lineas_finales_temp = []
          i = 0
          while i < len(lineas_actualizadas):
              l = lineas_actualizadas[i]
              lineas_finales_temp.append(l)
              for nombre_carp, lista_canales in list(clasificados.items()):
                  if nombre_carp.upper() in l.upper() and ("CARPETA:" in l.upper() or nombre_carp in l):
                      lineas_finales_temp.append("")
                      for nom_f, extinf_f, url_f in lista_canales:
                          if "DAZN" in nom_f.upper():
                              if "2" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga 2 HD"', extinf_f)
                              else:
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga HD"', extinf_f)
                          else:
                              if "2" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 2 HD"', extinf_f)
                              elif "3" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 3 HD"', extinf_f)
                              else:
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga HD"', extinf_f)
                          lineas_finales_temp.append(extinf_f)
                          lineas_finales_temp.append(url_f)
                      lineas_finales_temp.append("")
                      del clasificados[nombre_carp]
              i += 1

          if clasificados:
              for carp, lista_canales in clasificados.items():
                  if carp == "LA LIGA Y DAZN LIGA":
                      no_dazn = [ch for ch in lista_canales if "DAZN" not in ch[0].upper()]
                      si_dazn = [ch for ch in lista_canales if "DAZN" in ch[0].upper()]
                      lista_canales = no_dazn + si_dazn

                  lineas_finales_temp.append("")
                  lineas_finales_temp.append(f"# ==========================================")
                  lineas_finales_temp.append(f"# CARPETA: {carp}")
                  lineas_finales_temp.append(f"# ==========================================")
                  for nom_f, extinf_f, url_f in lista_canales:
                      if carp == "LA LIGA Y DAZN LIGA":
                          if "DAZN" in nom_f.upper():
                              if "2" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga 2 HD"', extinf_f)
                              else:
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="DAZN LaLiga HD"', extinf_f)
                          else:
                              if "2" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 2 HD"', extinf_f)
                              elif "3" in nom_f.upper():
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga 3 HD"', extinf_f)
                              else:
                                  extinf_f = re.sub(r'tvg-id="[^"]*"', 'tvg-id="M+ LaLiga HD"', extinf_f)
                      lineas_finales_temp.append(extinf_f)
                      lineas_finales_temp.append(url_f)

          lista_final_casa = "\n".join(lineas_finales_temp) + ("\n" if not "".join(lineas_finales_temp).endswith("\n") else "")
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización final completada correctamente.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Sincronizacion de canales y hashes"
            git push
          else
            echo "No hay cambios que guardar."
          fi
