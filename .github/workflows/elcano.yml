name: Actualizador Automatico Elcano, Tailscale y Amigos

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización automática ELCANO, Tailscale y Amigos
        run: |
          python <<'PY'
          import re
          import sys
          import datetime
          import unicodedata
          import urllib.request
          from pathlib import Path

          # ==========================================================
          # CONFIGURACION
          # ==========================================================

          IPNS_HASH = "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs"

          URLS_ELCANO = [
              f"https://ipfs.bytokyo.dpdns.org/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://ipfs2.bytokyo.dpdns.org/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://tokyo2.elcano-ipfs.workers.dev/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://ipfs.io/ipns/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://gateway.pinata.cloud/ipns/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://cloudflare-ipfs.com/ipns/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://dweb.link/ipns/{IPNS_HASH}/hashes_acestream.m3u",
              f"https://w3s.link/ipns/{IPNS_HASH}/hashes_acestream.m3u"
          ]

          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          # LOGOTIPO OFICIAL ACORDADO PARA MOVISTAR PLUS Y M+ 0
          URL_LOGO_PERSONAL = "https://i.ibb.co/hFYPWbpJ/plus.png"

          # UNIFICAMOS EL TVG-ID PARA QUE COJA LA MISMA EPG QUE TUS CANALES MANUALES
          TGV_ID_MOVISTAR_UNIFICADO = "Movistar Plus HD"

          GROUP_TITLE = "⭐ ELCANO [MÁXIMA CALIDAD]"

          # ==========================================================
          # COMPROBAR ARCHIVO PRINCIPAL
          # ==========================================================

          if not archivo_casa.is_file():
              sys.exit(
                  "ERROR: No se encuentra el archivo "
                  "'Mi lista acestream'. No se modifica ningún archivo."
              )

          try:
              contenido_casa = archivo_casa.read_bytes().decode("utf-8-sig")
          except UnicodeDecodeError:
              try:
                  contenido_casa = archivo_casa.read_bytes().decode("latin-1")
              except Exception as error:
                  sys.exit(f"ERROR leyendo la lista principal: {error}")

          salto = "\r\n" if "\r\n" in contenido_casa else "\n"

          # ==========================================================
          # LOCALIZAR Y PROTEGER LAS CARPETAS PERSONALES
          # ==========================================================

          lineas_casa = contenido_casa.splitlines(keepends=True)

          marcador_personal = re.compile(
              r"^\s*#?\s*(CARPETA:|ZONA PERSONAL:|SECCI[ÓO]N:)",
              re.IGNORECASE
          )

          indice_personal = None

          for indice, linea in enumerate(lineas_casa):
              if marcador_personal.search(linea):
                  indice_personal = indice
                  break

          if indice_personal is None:
              sys.exit(
                  "ERROR DE SEGURIDAD: No se ha encontrado el comienzo "
                  "de tus carpetas personales (CARPETA:, ZONA PERSONAL: "
                  "o SECCIÓN:). No se modifica ni sobrescribe ningún archivo."
              )

          inicio_personal = indice_personal

          while inicio_personal > 0:
              anterior = lineas_casa[inicio_personal - 1].strip()

              if not anterior or re.fullmatch(r"#\s*=+", anterior):
                  inicio_personal -= 1
              else:
                  break

          cuerpo_personal = "".join(lineas_casa[inicio_personal:])

          # ==========================================================
          # DESCARGAR ELCANO (PROBANDO VARIAS URLS)
          # ==========================================================

          fuente_elcano = None
          errores_descarga = []

          for url_intento in URLS_ELCANO:
              try:
                  peticion = urllib.request.Request(
                      url_intento,
                      headers={
                          "User-Agent": "Mozilla/5.0",
                          "Accept": "*/*"
                      }
                  )

                  with urllib.request.urlopen(peticion, timeout=30) as respuesta:
                      fuente_elcano = respuesta.read().decode(
                          "utf-8-sig",
                          errors="replace"
                      )
                      break
              except Exception as error:
                  errores_descarga.append(f"{url_intento} -> {error}")

          if not fuente_elcano:
              sys.exit(
                  "ERROR descargando Elcano desde todas las URLs disponibles:\n"
                  + "\n".join(errores_descarga)
                  + "\nNo se modifica ningún archivo."
              )

          # ==========================================================
          # FUNCIONES AUXILIARES
          # ==========================================================

          def normalizar(texto):
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(
                  caracter for caracter in texto
                  if unicodedata.category(caracter) != "Mn"
              )
              return texto.upper().strip()


          def es_tdt_abierto(nombre):
              canales_abiertos = (
                  "CUATRO",
                  "TELECINCO",
                  "TELEDEPORTE",
                  "ESPORT3",
                  "A PUNT",
                  "APUNT",
                  "LA 1",
                  "LA 2",
                  "LA 3",
                  "TVE",
                  "ANTENA 3",
                  "ANTENA3",
                  "LA SEXTA",
                  "LASEXTA",
                  "ONETORO",
                  "ONE TORO"
              )
              return any(canal in nombre for canal in canales_abiertos)


          def poner_atributo(linea, atributo, valor):
              patron = rf'{re.escape(atributo)}="[^"]*"'

              if re.search(patron, linea, flags=re.IGNORECASE):
                  return re.sub(
                      patron,
                      f'{atributo}="{valor}"',
                      linea,
                      count=1,
                      flags=re.IGNORECASE
                  )

              return linea.replace(
                  "#EXTINF:-1",
                  f'#EXTINF:-1 {atributo}="{valor}"',
                  1
              )


          def limpiar_y_forzar_m0(linea):
              linea = re.sub(r'tvg-id="[^"]*"', '', linea, flags=re.IGNORECASE)
              linea = re.sub(r'tvg-logo="[^"]*"', '', linea, flags=re.IGNORECASE)
              linea = re.sub(r'\s+', ' ', linea)
              linea = linea.replace('#EXTINF:-1 ', '#EXTINF:-1 ')

              nuevo_sufijo = f'tvg-id="{TGV_ID_MOVISTAR_UNIFICADO}" tvg-logo="{URL_LOGO_PERSONAL}"'
              return linea.replace('#EXTINF:-1', f'#EXTINF:-1 {nuevo_sufijo}', 1)


          def numero_canal(nombre):
              coincidencia = re.search(
                  r"\b([1-9])\b",
                  nombre
              )
              if coincidencia:
                  return int(coincidencia.group(1))
              return 0


          def calidad_canal(nombre):
              if "4K" in nombre:
                  return 0
              if "1080" in nombre:
                  return 1
              if "720" in nombre:
                  return 2
              return 3


          def prioridad_estrellas(nombre):
              if "**" in nombre:
                  return 0
              if "*" in nombre:
                  return 1
              return 2


          # ==========================================================
          # ORDEN ESTRICTO DE CANALES (M+ 0 BAJO LOS MOVISTAR PLUS)
          # ==========================================================

          def prioridad_canal(canal):
              nombre = normalizar(canal["nombre"])
              numero = numero_canal(nombre)
              calidad = calidad_canal(nombre)
              estrellas = prioridad_estrellas(nombre)
              idx = canal["indice"]

              # 1. Movistar Plus clásico
              if nombre.startswith("MOVISTAR PLUS") or nombre.startswith("MOVISTAR+"):
                  return (0, 0, 0, calidad, estrellas, idx)

              # 2. M+ 0
              if re.search(r"\bM\+\s*0\b", nombre):
                  return (1, 0, 0, calidad, estrellas, idx)

              # 3. LaLiga y sus multis (excluyendo Hypermotion)
              if ("LALIGA" in nombre or "LA LIGA" in nombre or "DAZN LALIGA" in nombre) and "HYPERMOTION" not in nombre:
                  suborden = 0 if nombre.startswith("M+") else (1 if "DAZN" in nombre else 2)
                  return (2, suborden, numero, calidad, estrellas, idx)

              # 4. Liga de Campeones, del 1 al 8
              if "CAMPEONES" in nombre or "CHAMPIONS" in nombre:
                  return (3, 0, numero, calidad, estrellas, idx)

              # 5. Movistar Deportes: principal y del 2 al 8
              if "DEPORTES" in nombre and "BALONCESTO" not in nombre:
                  return (4, 0, numero, calidad, estrellas, idx)

              # 6. DAZN F1 y MotoGP
              if "F1" in nombre or "FORMULA 1" in nombre:
                  return (5, 0, 0, calidad, estrellas, idx)
              if "MOTOGP" in nombre:
                  return (5, 1, 0, calidad, estrellas, idx)

              # 7. DAZN generales: del 1 al 4
              if "DAZN" in nombre and not any(p in nombre for p in ("F1", "FORMULA", "MOTOGP", "LALIGA", "BALONCESTO")):
                  return (6, 0, numero, calidad, estrellas, idx)

              # 8. M+ Vamos
              if "VAMOS" in nombre:
                  return (7, 0, numero, calidad, estrellas, idx)

              # 9. LaLiga Hypermotion
              if "HYPERMOTION" in nombre:
                  return (8, 0, numero, calidad, estrellas, idx)

              # 10. Primera Federación / RFEF
              if "RFEF" in nombre or "PRIMERA FEDERACION" in nombre:
                  return (9, 0, 0, calidad, estrellas, idx)

              # 11. Golf, Eurosport, Tenis y Sport TV
              if "GOLF" in nombre:
                  return (10, 0, numero, calidad, estrellas, idx)
              if "EUROSPORT" in nombre:
                  return (10, 1, numero, calidad, estrellas, idx)
              if "TENIS" in nombre or "TENNIS" in nombre:
                  return (10, 2, numero, calidad, estrellas, idx)
              if "SPORT TV" in nombre:
                  return (10, 3, numero, calidad, estrellas, idx)

              # 12. Otros canales generales y variados
              if "BALONCESTO" not in nombre and not nombre.startswith("NBA") and not es_tdt_abierto(nombre):
                  return (11, 0, 0, calidad, estrellas, idx)

              # 13. Baloncesto y NBA
              if "BALONCESTO" in nombre or nombre.startswith("NBA"):
                  return (12, 0, numero, calidad, estrellas, idx)

              # 14. TDT y canales abiertos
              if es_tdt_abierto(nombre):
                  return (13, 0, 0, calidad, estrellas, idx)

              return (11, 0, 0, calidad, estrellas, idx)


          # ==========================================================
          # LEER Y PROCESAR LOS CANALES DE ELCANO
          # ==========================================================

          lineas_elcano = fuente_elcano.splitlines()
          canales = []
          indice = 0

          while indice < len(lineas_elcano):
              linea = lineas_elcano[indice].strip()

              if not linea.startswith("#EXTINF:"):
                  indice += 1
                  continue

              url = None
              siguiente = indice + 1

              while siguiente < len(lineas_elcano):
                  candidata = lineas_elcano[siguiente].strip()
                  if candidata and not candidata.startswith("#"):
                      url = candidata
                      break
                  siguiente += 1

              if not url:
                  indice += 1
                  continue

              nombre = linea.rsplit(",", 1)[-1].strip() if "," in linea else linea
              nombre_normalizado = normalizar(nombre)
              extinf_mod = linea

              # M+ 0
              if re.search(r"\bM\+\s*0\b", nombre_normalizado):
                  extinf_mod = limpiar_y_forzar_m0(extinf_mod)

              # MOVISTAR PLUS CLÁSICO
              elif nombre_normalizado.startswith("MOVISTAR PLUS") or nombre_normalizado.startswith("MOVISTAR+"):
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", TGV_ID_MOVISTAR_UNIFICADO)
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", URL_LOGO_PERSONAL)

              # ONETORO
              elif "ONETORO" in nombre_normalizado or "ONE TORO" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Onetoro TV")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/spain/onetoro-tv-es.png")

              # MOVISTAR DEPORTES
              elif "DEPORTES 8" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Deportes 8")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/refs/heads/main/countries/spain/deportes-8-por-movistar-plus-es.png")
              elif "DEPORTES 7" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Deportes 7")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Deportes%207.png")
              elif "DEPORTES 6" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Deportes 6")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Deportes%206.png")
              elif "DEPORTES 5" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Deportes 5")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Deportes%205.png")

              # CAMPEONES 6-8
              elif "CAMPEONES 8" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Liga de Campeones 8")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%208.png")
              elif "CAMPEONES 7" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Liga de Campeones 7")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%207.png")
              elif "CAMPEONES 6" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Liga de Campeones 6")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Liga%20de%20Campeones%206.png")

              # DAZN 4 / MOTOGP
              elif "DAZN 4" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "DAZN 4 HD")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/spain/dazn-4-es.png")
              elif "MOTOGP" in nombre_normalizado and "SKY" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Sky Sport MotoGP")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/italy/sky-sport-motogp-it.png")
              elif "MOTOGP" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "DAZN MotoGP")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://hips.hearstapps.com/vader-prod.s3.amazonaws.com/1772006365-dazn-motogp-699eaba85423e.jpg")

              # VAMOS 2 Y 3
              elif "VAMOS 3" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Vamos 3")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Vamos%203.png")
              elif "VAMOS 2" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Vamos 2")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Vamos%202.png")

              # GOLF / TENIS / SPORT TV / NBA / TDT
              elif "GOLF 2" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Golf 2 HD")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://r2.thesportsdb.com/images/media/channel/logo/irjqp71744196637.png")
              elif "GOLF" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Golf HD")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Golf.png")

              elif "DAZN BALONCESTO 3" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "DAZN Baloncesto 3")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/DAZN%20Baloncesto%203.png")
              elif "DAZN BALONCESTO 2" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "DAZN Baloncesto 2")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/DAZN%20Baloncesto%202.png")
              elif "DAZN BALONCESTO" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "DAZN Baloncesto")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/DAZN%20Baloncesto.png")

              elif "M+ BALONCESTO 5" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Baloncesto 5")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Baloncesto%205.png")
              elif "M+ BALONCESTO 4" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Baloncesto 4")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Baloncesto%204.png")
              elif "M+ BALONCESTO 3" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Baloncesto 3")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Baloncesto%203.png")
              elif "M+ BALONCESTO 2" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Baloncesto 2")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Baloncesto%202.png")
              elif "M+ BALONCESTO" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "M+ Baloncesto")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20Baloncesto.png")

              elif "PRIMERA FEDERACION" in nombre_normalizado or "RFEF" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Primera Federación")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/Primera%20Federaci%C3%B3n.png")

              elif "SKY SPORT TENNIS" in nombre_normalizado or "SKY SPORTS TENNIS" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Sky Sports Tennis")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/Sky%20Sports%20Tennis.png")

              elif "TENNIS CHANNEL" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Tennis Channel")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/tennis-channel-us.png")

              elif "SPORT TV+" in nombre_normalizado or "SPORT TV +" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Sport TV+")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/portugal/sport-tv-plus-pt.png")

              elif "SPORT TV3" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "SPORT TV3")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://r2.thesportsdb.com/images/media/channel/logo/fjy5d31700902671.png")

              elif "REAL MADRID TV" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Real Madrid TV")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/spain/real-madrid-tv-es.png")

              elif "NBC SPORTS" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "NBC Sports")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/united-states/nbc-sports-us.png")

              elif nombre_normalizado.startswith("NBA"):
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "NBA")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/NBA.png")

              elif "CUATRO" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "Cuatro HD")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/spain/cuatro-es.png")

              elif "A PUNT" in nombre_normalizado or "APUNT" in nombre_normalizado:
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", "À Punt")
                  extinf_mod = poner_atributo(extinf_mod, "tvg-logo", "https://www.apuntmedia.es/static/media/logo-apunt.png")

              # GROUP-TITLE DE LA ZONA AUTOMÁTICA
              extinf_mod = poner_atributo(
                  extinf_mod,
                  "group-title",
                  GROUP_TITLE
              )

              # CONVERTIR HASH ACESTREAM A DIRECCIÓN LOCAL
              coincidencia_hash = re.search(
                  r"([0-9a-fA-F]{40})",
                  url
              )

              if coincidencia_hash:
                  hash_id = coincidencia_hash.group(1)
                  url_final = "http://127.0.0.1:6878/ace/getstream?id=" + hash_id
              else:
                  url_final = url

              canales.append({
                  "nombre": nombre,
                  "extinf": extinf_mod,
                  "url": url_final,
                  "indice": len(canales)
              })

              indice = siguiente + 1

          if not canales:
              sys.exit(
                  "ERROR: Elcano no ha proporcionado canales válidos. "
                  "No se modifica ningún archivo."
              )

          # ==========================================================
          # ORDEN SIN ELIMINAR CANALES NI DUPLICADOS
          # ==========================================================

          canales_ordenados = sorted(
              canales,
              key=prioridad_canal
          )

          # ==========================================================
          # CONSTRUIR LA ZONA AUTOMÁTICA
          # ==========================================================

          bloque_automatico = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]

          for canal in canales_ordenados:
              bloque_automatico.append(canal["extinf"])
              bloque_automatico.append(canal["url"])

          texto_nuevo_elcano = salto.join(bloque_automatico)

          # ==========================================================
          # COMPARAR CANALES PARA EL INFORME
          # ==========================================================

          def extraer_nombres(texto):
              nombres = set()
              for linea in texto.splitlines():
                  if linea.startswith("#EXTINF:") and "," in linea:
                      nombres.add(
                          linea.rsplit(",", 1)[-1].strip().upper()
                      )
              return nombres


          zona_anterior = "".join(lineas_casa[:inicio_personal])

          canales_viejos = extraer_nombres(zona_anterior)
          canales_new = extraer_nombres(texto_nuevo_elcano)

          agregados = sorted(canales_new - canales_viejos)
          eliminados = sorted(canales_viejos - canales_new)

          timestamp_actual = datetime.datetime.now().strftime(
              "%Y-%m-%d %H:%M:%S"
          )

          reporte = [
              f"# Resumen de cambios ELCANO - {timestamp_actual}",
              "",
              f"## Canales nuevos ({len(agregados)})"
          ]

          if agregados:
              reporte.extend(f"- {canal}" for canal in agregados)
          else:
              reporte.append("- Ninguno.")

          reporte.extend([
              "",
              f"## Canales eliminados ({len(eliminados)})"
          ])

          if eliminados:
              reporte.extend(f"- {canal}" for canal in eliminados)
          else:
              reporte.append("- Ninguno.")

          Path("ultimos_cambios.md").write_text(
              "\n".join(reporte),
              encoding="utf-8"
          )

          # ==========================================================
          # CABECERA M3U
          # ==========================================================

          cabecera_m3u = (
              '#EXTM3U url-tvg="'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz" '
              'refresh="3600"'
              + salto
              + '#EXTVLCOPT:network-caching=1000'
              + salto
              + '#EXTGRP: group-title="⭐ ELCANO [MÁXIMA CALIDAD]" '
              'group-logo="https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20LaLiga.png"'
              + salto
              + salto
          )

          # ==========================================================
          # MONTAR ARCHIVO CASA (Mantiene IP local 127.0.0.1 abajo)
          # ==========================================================

          separador = salto + salto

          texto_final = (
              cabecera_m3u
              + texto_nuevo_elcano
              + separador
              + cuerpo_personal
          )

          # ==========================================================
          # MONTAR ARCHIVO TAILSCALE (CAMBIA LA IP ARRIBA Y ABAJO)
          # ==========================================================

          bloque_tailscale_elcano = texto_nuevo_elcano.replace(
              "127.0.0.1:6878",
              "100.90.204.66:6878"
          )

          cuerpo_tailscale_personal = cuerpo_personal.replace(
              "127.0.0.1:6878",
              "100.90.204.66:6878"
          )

          texto_tailscale = (
              cabecera_m3u
              + bloque_tailscale_elcano
              + separador
              + cuerpo_tailscale_personal
          )

          texto_amigos = texto_final

          # ==========================================================
          # COMPROBACIONES FINALES ANTES DE ESCRIBIR
          # ==========================================================

          if cuerpo_personal not in texto_final:
              sys.exit(
                  "ERROR: La comprobación de la zona personal ha fallado. "
                  "No se guardan los archivos."
              )

          if cuerpo_tailscale_personal not in texto_tailscale:
              sys.exit(
                  "ERROR: La zona personal de Tailscale no coincide. "
                  "No se guardan los archivos."
              )

          if f'tvg-id="{TGV_ID_MOVISTAR_UNIFICADO}"' not in texto_final:
              sys.exit(
                  'ERROR: No se ha aplicado el tvg-id unificado a Movistar. '
                  "No se guardan los archivos."
              )

          # ==========================================================
          # GUARDAR ARCHIVOS
          # ==========================================================

          archivo_casa.write_bytes(
              texto_final.encode("utf-8")
          )

          archivo_tailscale.write_bytes(
              texto_tailscale.encode("utf-8")
          )

          archivo_amigos.write_bytes(
              texto_amigos.encode("utf-8")
          )

          print("==========================================")
          print("SINCRONIZACIÓN COMPLETADA CON TAILSCALE")
          print("==========================================")
          print(f"Canales procesados: {len(canales_ordenados)}")
          print(f"Canales nuevos: {len(agregados)}")
          print(f"Canales eliminados: {len(eliminados)}")
          print('M+ 0 y Movistar Plus unificados con logo moderno y EPG')
          print("Carpetas personales: adaptadas a Tailscale en Canales m3u")
          print("Casa, Tailscale y Amigos: actualizados")
          print("==========================================")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos" "ultimos_cambios.md"
          
          if ! git diff --cached --quiet; then
            git commit -m "Sincronización completa con IP Tailscale en Elcano y carpetas manuales"
            git push
          else
            echo "No hay cambios que guardar."
          fi
