name: actualizador-lista

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Sincronizar Elcano con Bypass Jina
        run: |
          python3 -c '
          import urllib.request, re
          from pathlib import Path

          # Usar Jina Reader y proxys inteligentes para saltar el bloqueo de Cloudflare en GitHub
          urls = [
              "https://r.jina.ai/https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://api.allorigins.win/raw?url=https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://corsproxy.io/?https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          ]

          fuente = None
          for url in urls:
              try:
                  print(f"Probando pasarela proxy: {url}")
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
                  })
                  with urllib.request.urlopen(req, timeout=20) as res:
                      data = res.read().decode("utf-8-sig", errors="replace")
                      if data and ("#EXTINF" in data or "http" in data):
                          fuente = data
                          print("¡Descarga de la lista conseguida con éxito!")
                          break
              except Exception as e:
                  print(f"Fallo en pasarela: {e}")

          path = Path("Mi lista acestream")
          if not path.exists():
              print("ERROR: No se encuentra el archivo Mi lista acestream")
              exit(0)

          orig = path.read_text(encoding="utf-8-sig", errors="replace")

          if not fuente or "#EXTINF" not in fuente:
              print("ERROR CRÍTICO: No se pudo obtener la fuente de canales. Abortando para proteger la lista.")
              exit(0)

          # Extraer hashes manteniendo concordancia exacta de nombres y Regla de Oro
          hashes = {}
          for m in re.finditer(r"#EXTINF:[^\n]*,\s*([^\n]+)\n(http[^\n]+)", fuente):
              nombre = m.group(1).strip().upper()
              link = m.group(2).strip()
              h_match = re.search(r"([0-9a-fA-F]{40})", link)
              if h_match:
                  norm = re.sub(r"[^A-Z0-9]", "", nombre)
                  hashes[norm] = f"http://127.0.0.1:6878/ace/getstream?id={h_match.group(1)}"

          # Reconstruir la lista actualizando únicamente los hashes de tus canales
          lines = orig.splitlines()
          new_lines = []
          i = 0
          actualizados = 0
          while i < len(lines):
              line = lines[i]
              new_lines.append(line)
              if line.startswith("#EXTINF:"):
                  nombre_canal = line.rsplit(",", 1)[-1].strip()
                  norm = re.sub(r"[^A-Z0-9]", "", nombre_canal.upper())
                  if i + 1 < len(lines) and not lines[i+1].startswith("#"):
                      if norm in hashes:
                          new_lines.append(hashes[norm])
                          actualizados += 1
                      else:
                          new_lines.append(lines[i+1])
                      i += 1
              i += 1

          print(f"Total de canales actualizados con sus hashes nuevos: {actualizados}")
          path.write_text("\n".join(new_lines) + "\n", encoding="utf-8")
          print("¡Archivo guardado correctamente respetando toda la EPG y estructura!")
          '

      - name: Tailscale y Git
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          git diff --cached --quiet || (git commit -m "Auto-sync Elcano: Canales actualizados" && git push)
