name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta CADA HORA las 24 horas del día automáticamente
  workflow_dispatch: # Activa el botón manual en GitHub Actions

permissions:
  contents: write

