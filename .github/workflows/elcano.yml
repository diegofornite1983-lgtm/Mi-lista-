name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización exacta respetando tu estructura
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # Normalizador fino para comparar nombres de canales con Elcano
          def normalizar(texto):
              t = texto.upper()
              t = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', t)
              t = re.sub(r'[^\w\s]', '', t)
              return "".join(t.split())

          # Parsear Elcano para extraer mapa de nombres y hashes
          lineas_elcano = fuente_elcano.splitlines()
          mapa_elcano = {}
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                        url = candidata
                        break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          nombre_c = linea.rsplit(",", 1)[-1].strip()
                          mapa_elcano[normalizar(nombre_c)] = h_id
                      i = j
              i += 1

          # Recorrer tu lista manteniendo el esqueleto exacto y actualizando solo el hash si coincide
          lineas_casa = contenido_casa.splitlines()
          nuevas_lineas = []
          i = 0
          while i < len(lineas_casa):
              linea = lineas_casa[i]
              nuevas_lineas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm = normalizar(nombre_canal)

                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_linea = lineas_casa[i+1].strip()
                      
                      # Buscar si este canal está en Elcano para actualizar su hash manteniendo tu estructura
                      encontrado_nuevo_hash = None
                      for clave_elcano, h_val in mapa_elcano.items():
                          if clave_elcano in nombre_norm or nombre_norm in clave_elcano:
                              encontrado_nuevo_hash = h_val
                              break

                      if encontrado_nuevo_hash:
                          if "manifest.m3u8" in url_linea:
                              nueva_url = f"http://127.0.0.1:6878/ace/manifest.m3u8?id={encontrado_nuevo_hash}"
                          elif "infohash=" in url_linea:
                              nueva_url = f"http://127.0.0.1:6878/ace/getstream?infohash={encontrado_nuevo_hash}"
                          else:
                              nueva_url = f"http://127.0.0.1:6878/ace/getstream?id={encontrado_nuevo_hash}"
                          nuevas_lineas.append(nueva_url)
                      else:
                          nuevas_lineas.append(url_linea)
                      i += 1
              i += 1

          lista_final_casa = "\n".join(nuevas_lineas) + "\n"
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          # Generar la versión de Tailscale cambiando la IP del motor AceStream
          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización exacta completada respetando tu lista al milímetro.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion exacta respetando estructura original"
            git push
          else
            echo "No hay cambios que guardar."
          fi
