name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización exacta respetando tu estructura y nombres
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # Parsear la lista de Elcano para obtener un diccionario de nombre_normalizado -> hash
          def limpiar_nombre(nombre):
              n = nombre.upper()
              # Quitar símbolos raros, estrellas o sufijos numéricos temporales para buscar concordancia
              n = re.sub(r'[⭐️⭐]', '', n)
              n = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', n)
              n = re.sub(r'[^\w\s]', '', n)
              return "".join(n.split())

          lineas_elcano = fuente_elcano.splitlines()
          mapa_elcano = {}
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          nombre_canal_elcano = linea.rsplit(",", 1)[-1].strip()
                          mapa_elcano[limpiar_nombre(nombre_canal_elcano)] = h_id
                      i = j
              i += 1

          # Recorrer tu lista línea por línea respetando absolutamente todo el esqueleto
          lineas_casa = contenido_casa.splitlines()
          nuevas_lineas = []
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              nuevas_lineas.append(linea)

              # Si es una línea de canal, miramos la siguiente para actualizar el enlace si procede
              if linea.startswith("#EXTINF:"):
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      
                      # Extraer el nombre de tu canal desde la línea EXTINF
                        partes_inf = linea.rsplit(",", 1)
                      if len(partes_inf) > 1:
                          nombre_tu_canal = partes_inf[1].strip()
                          nombre_norm = limpiar_nombre(nombre_tu_canal)
                          
                          # Buscar coincidencia exacta o parcial limpia en Elcano
                          nuevo_hash = None
                          for k_elcano, h_val in mapa_elcano.items():
                              # Si tu nombre contiene el de elcano o viceversa de forma lógica
                              if k_elcano in nombre_norm or nombre_norm in k_elcano:
                                  nuevo_hash = h_val
                                  break
                          
                          if nuevo_hash and "127.0.0.1:6878" in url_actual:
                              if "manifest.m3u8" in url_actual:
                                  url_actual = f"http://127.0.0.1:6878/ace/manifest.m3u8?id={nuevo_hash}"
                              elif "infohash=" in url_actual:
                                  url_actual = f"http://127.0.0.1:6878/ace/getstream?infohash={nuevo_hash}"
                              else:
                                  url_actual = f"http://127.0.0.1:6878/ace/getstream?id={nuevo_hash}"

                      nuevas_lineas.append(url_actual)
                      i += 1
              i += 1

          lista_final_casa = "\n".join(nuevas_lineas) + "\n"
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          # Generar la versión de Tailscale manteniendo intacta tu estructura pero cambiando la IP
          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización finalizada respetando nombres y estructura al milímetro.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion precisa respetando nombres personalizados de Diego"
            git push
          else
            echo "No hay cambios que guardar."
          fi
