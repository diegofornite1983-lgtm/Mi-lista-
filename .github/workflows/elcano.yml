name: Actualizador Automatico Elcano, Tailscale y Amigos

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización automática ELCANO, Tailscale y Amigos
        run: |
          python <<'PY'
          import re
          import sys
          import datetime
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = (
              "https://tokyo2.elcano-ipfs.workers.dev/"
              "k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/"
              "hashes_acestream.m3u"
          )

          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")
          archivo_amigos = Path("lista-amigos")

          URL_LOGO_M0 = "https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/Movistar%20Plus%2B.png"
          TGV_ID_M0 = "#0 HD"
          TGV_ID_MOVISTAR_PLUS = "Movistar Plus HD"
          GROUP_TITLE = "⭐ ELCANO [MÁXIMA CALIDAD]"

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_bytes().decode("utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_bytes().decode("latin-1")

          salto = "\r\n" if "\r\n" in contenido_casa else "\n"

          lineas_casa = contenido_casa.splitlines(keepends=True)
          marcador_personal = re.compile(r"^\s*#?\s*(CARPETA:|ZONA PERSONAL:|SECCI[ÓO]N:)", re.IGNORECASE)
          indice_personal = None

          for indice, linea in enumerate(lineas_casa):
              if marcador_personal.search(linea):
                  indice_personal = indice
                  break

          if indice_personal is None:
              sys.exit("ERROR DE SEGURIDAD: No se encuentra el inicio de tus carpetas personales.")

          inicio_personal = indice_personal
          while inicio_personal > 0:
              anterior = lineas_casa[inicio_personal - 1].strip()
              if not anterior or re.fullmatch(r"#\s*=+", anterior):
                  inicio_personal -= 1
              else:
                  break

          cuerpo_personal = "".join(lineas_casa[inicio_personal:])

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0", "Accept": "*/*"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def normalizar(texto):
              texto = unicodedata.normalize("NFD", texto)
              texto = "".join(c for c in texto if unicodedata.category(c) != "Mn")
              return texto.upper().strip()

          def poner_atributo(linea, atributo, valor):
              patron = rf'{re.escape(atributo)}="[^"]*"'
              if re.search(patron, linea, flags=re.IGNORECASE):
                  return re.sub(patron, f'{atributo}="{valor}"', linea, count=1, flags=re.IGNORECASE)
              return linea.replace("#EXTINF:-1", f'#EXTINF:-1 {atributo}="{valor}"', 1)

          def limpiar_y_forzar_m0(linea):
              # Limpiamos tvg-id y tvg-logo antiguos para forzar los correctos de #0 HD
              linea = re.sub(r'tvg-id="[^"]*"', f'tvg-id="{TGV_ID_M0}"', linea, flags=re.IGNORECASE)
              linea = re.sub(r'tvg-logo="[^"]*"', f'tvg-logo="{URL_LOGO_M0}"', linea, flags=re.IGNORECASE)
              if 'tvg-id=' not in linea:
                  linea = linea.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-id="{TGV_ID_M0}"')
              if 'tvg-logo=' not in linea:
                  linea = linea.replace('#EXTINF:-1', f'#EXTINF:-1 tvg-logo="{URL_LOGO_M0}"')
              return linea

          def numero_canal(nombre):
              coincidencia = re.search(r"\b([1-9])\b", nombre)
              return int(coincidencia.group(1)) if coincidencia else 0

          def calidad_canal(nombre):
              if "4K" in nombre: return 0
              if "1080" in nombre: return 1
              if "720" in nombre: return 2
              return 3

          def es_tdt_abierto(nombre):
              canales_abiertos = (
                  "CUATRO", "TELECINCO", "TELEDEPORTE", "ESPORT3", "A PUNT", "APUNT",
                  "LA 1", "LA 2", "LA 3", "TVE", "ANTENA 3", "ANTENA3", "LA SEXTA", "LASEXTA",
                  "REAL MADRID TV", "ONETORO", "ONE TORO"
              )
              return any(c in nombre for c in canales_abiertos)

          # ==========================================================
          # ORDEN ESTRICTO DE CANALES
          # ==========================================================
          def prioridad_canal(canal):
              nombre_original = canal["nombre"]
              nombre = normalizar(nombre_original)
              numero = numero_canal(nombre)
              calidad = calidad_canal(nombre)

              # 1. M+ 0: Primero absoluto
              if re.search(r"\bM\+\s*0\b", nombre):
                  return (0, 0, calidad, canal["indice"])

              # 2. Movistar Plus clásico
              if nombre.startswith("MOVISTAR PLUS") or nombre.startswith("MOVISTAR+"):
                  return (1, 0, calidad, canal["indice"])

              # 3. LaLiga (excluyendo Hypermotion)
              if ("LALIGA" in nombre or "LA LIGA" in nombre or "DAZN LALIGA" in nombre) and "HYPERMOTION" not in nombre:
                  suborden = 0 if nombre.startswith("M+") else (1 if "DAZN" in nombre else 2)
                  return (2, suborden, numero, calidad, canal["indice"])

              # 4. Campeones / Champions (del 1 al 8)
              if "CAMPEONES" in nombre or "CHAMPIONS" in nombre:
                  return (3, numero, calidad, canal["indice"])

              # 5. Movistar Deportes (principal y numerados del 2 al 8 juntos)
              if "DEPORTES" in nombre and "BALONCESTO" not in nombre:
                  return (4, numero, calidad, canal["indice"])

              # 6. DAZN F1 y DAZN MotoGP
              if "F1" in nombre or "FORMULA 1" in nombre:
                  return (5, 0, calidad, canal["indice"])
              if "MOTOGP" in nombre:
                  return (5, 1, calidad, canal["indice"])

              # 7. DAZN generales (1 al 4)
              if "DAZN" in nombre and not any(p in nombre for p in ("F1", "FORMULA", "MOTOGP", "LALIGA", "BALONCESTO")):
                  return (6, numero, calidad, canal["indice"])

              # 8. M+ Vamos y LaLiga Hypermotion (juntos)
              if "VAMOS" in nombre:
                  return (7, 0, numero, calidad, canal["indice"])
              if "HYPERMOTION" in nombre:
                  return (7, 1, numero, calidad, canal["indice"])

              # 9. Golf, Eurosport, Tenis y Sport TV
              if "GOLF" in nombre:
                  return (8, 0, numero, calidad, canal["indice"])
              if "EUROSPORT" in nombre:
                  return (8, 1, numero, calidad, canal["indice"])
              if "TENIS" in nombre or "TENNIS" in nombre:
                  return (8, 2, numero, calidad, canal["indice"])
              if "SPORT TV" in nombre:
                  return (8, 3, numero, calidad, canal["indice"])

              # 10. Otros canales generales de Elcano
              if "BALONCESTO" not in nombre and not nombre.startswith("NBA") and "RFEF" not in nombre and "PRIMERA FEDERACION" not in nombre and not es_tdt_abierto(nombre):
                  return (9, 0, nombre, calidad, canal["indice"])

              # 11. Baloncesto y NBA (¡Justo antes de RFEF!)
              if "BALONCESTO" in nombre or nombre.startswith("NBA"):
                  return (10, numero, calidad, canal["indice"])

              # 12. Primera Federación / RFEF (¡Debajo del baloncesto!)
              if "RFEF" in nombre or "PRIMERA FEDERACION" in nombre:
                  return (11, 0, nombre, calidad, canal["indice"])

              # 13. TDT y abiertos al final absoluto
              if es_tdt_abierto(nombre):
                  return (12, 0, nombre, calidad, canal["indice"])

              return (9, 0, nombre, calidad, canal["indice"])

          lineas_elcano = fuente_elcano.splitlines()
          canales = []
          indice = 0

          while indice < len(lineas_elcano):
              linea = lineas_elcano[indice].strip()
              if not linea.startswith("#EXTINF:"):
                  indice += 1
                  continue

              url = None
              siguiente = indice + 1
              while siguiente < len(lineas_elcano):
                  candidata = lineas_elcano[siguiente].strip()
                  if candidata and not candidata.startswith("#"):
                      url = candidata
                      break
                  siguiente += 1

              if not url:
                  indice += 1
                  continue

              nombre = linea.rsplit(",", 1)[-1].strip()
              nombre_normalizado = normalizar(nombre)
              extinf_mod = linea

              # Aplicar tratamiento especial a M+ 0
              if re.search(r"\bM\+\s*0\b", nombre_normalizado):
                  extinf_mod = limpiar_y_forzar_m0(extinf_mod)
              elif nombre_normalizado.startswith("MOVISTAR PLUS") or nombre_normalizado.startswith("MOVISTAR+"):
                  extinf_mod = poner_atributo(extinf_mod, "tvg-id", TGV_ID_MOVISTAR_PLUS)

              extinf_mod = poner_atributo(extinf_mod, "group-title", GROUP_TITLE)

              coincidencia_hash = re.search(r"([0-9a-fA-F]{40})", url)
              url_final = f"http://127.0.0.1:6878/ace/getstream?id={coincidencia_hash.group(1)}" if coincidencia_hash else url

              canales.append({
                  "nombre": nombre,
                  "extinf": extinf_mod,
                  "url": url_final,
                  "indice": len(canales)
              })
              indice = siguiente + 1

          if not canales:
              sys.exit("ERROR: Elcano no ha proporcionado canales válidos.")

          canales_ordenados = sorted(canales, key=prioridad_canal)

          bloque_automatico = [
              "# ==========================================",
              "# ZONA AUTOMATICA: ⭐ ELCANO [MÁXIMA CALIDAD]",
              "# =========================================="
          ]
          for canal in canales_ordenados:
              bloque_automatico.append(canal["extinf"])
              bloque_automatico.append(canal["url"])

          texto_nuevo_elcano = salto.join(bloque_automatico)

          cabecera_m3u = (
              '#EXTM3U url-tvg="https://raw.githubusercontent.com/davidmuma/EPG_dobleM/refs/heads/master/guiatv.xml,'
              'https://epgshare01.online/epgshare01/epg_ripper_NL1.xml.gz,'
              'https://raw.githubusercontent.com/davidmuma/EPG_dobleM/master/guiatv.xml" refresh="3600"' + salto +
              '#EXTVLCOPT:network-caching=1000' + salto +
              '#EXTGRP: group-title="⭐ ELCANO [MÁXIMA CALIDAD]" group-logo="https://raw.githubusercontent.com/davidmuma/picons_dobleM/master/icon/M%2B%20LaLiga.png"' + salto + salto
          )

          separador = salto + salto
          texto_final = cabecera_m3u + texto_nuevo_elcano + separador + cuerpo_personal
          bloque_tailscale = texto_nuevo_elcano.replace("127.0.0.1:6878", "100.90.204.66:6878")
          texto_tailscale = cabecera_m3u + bloque_tailscale + separador + cuerpo_personal
          texto_amigos = texto_final

          archivo_casa.write_bytes(texto_final.encode("utf-8"))
          archivo_tailscale.write_bytes(texto_tailscale.encode("utf-8"))
          archivo_amigos.write_bytes(texto_amigos.encode("utf-8"))

          print("¡Sincronización perfecta y ordenada completada con éxito!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          
          if ! git diff --cached --quiet; then
            git commit -m "Orden definitivo corregido: Hypermotion, RFEF y M0"
            git push
          else
            echo "No hay cambios que guardar."
          fi
