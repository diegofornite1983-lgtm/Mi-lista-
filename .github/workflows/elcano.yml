name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronización limpia de Elcano y listas personales
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://workers.dev"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          # 1. Parsear los canales nuevos de la red Elcano y empaquetarlos únicamente en la carpeta superior ELCANO
          lineas_elcano = fuente_elcano.splitlines()
          canales_raw = []
          i = 0
          while i < len(lineas_elcano):
              linea = lineas_elcano[i].strip()
              if linea.startswith("#EXTINF:"):
                  url = None
                  j = i + 1
                  while j < len(lineas_elcano):
                      candidata = lineas_elcano[j].strip()
                      if candidata and not candidata.startswith("#"):
                          url = candidata
                          break
                      j += 1
                  if url:
                      match_h = re.search(r'([0-9a-fA-F]{40})', url)
                      if match_h:
                          h_id = match_h.group(1)
                          url_local = f"http://127.0.0{h_id}"
                      else:
                          url_local = url

                      # Forzar group-title="ELCANO" de forma estricta para estos canales dinámicos
                      extinf_mod = re.sub(r'group-title="[^"]*"', 'group-title="ELCANO"', linea)
                      if 'group-title=' not in extinf_mod:
                          extinf_mod = extinf_mod.replace('#EXTINF:-1', '#EXTINF:-1 group-title="ELCANO"')

                      nombre_c = linea.rsplit(",", 1)[-1].upper()
                      canales_raw.append((nombre_c, extinf_mod, url_local))
                      i = j
              i += 1

          def prioridad_elcano(item):
              n = item[0]
              if "M+ LALIGA" in n: return 1
              if "DAZN LALIGA" in n: return 2
              if "CAMPEONES" in n: return 3
              if "DAZN 1" in n or "DAZN 2" in n or "DAZN 3" in n or "DAZN 4" in n: return 4
              if "F1" in n: return 5
              if "MOTOGP" in n: return 6
              if "DEPORTES" in n or "VAMOS" in n: return 7
              if "BALONCESTO" in n: return 8
              return 9

          canales_ordenados = sorted(canales_raw, key=prioridad_elcano)

          # Preparar el bloque de canales dinámicos aislados de Elcano
          bloque_elcano = []
          for _, inf, u in canales_ordenados:
              bloque_elcano.append(inf)
              bloque_elcano.append(u)

          # 2. Filtrar tu archivo original de forma segura línea a línea sin tocar tus canales personales
          lineas_casa = contenido_casa.splitlines()
          lineas_personales = []
          
          idx = 0
          en_bloque_elcano_anterior = False
          
          while idx < len(lineas_casa):
              linea = lineas_casa[idx].strip()
              
              # Omitir cabeceras globales viejas para evitar duplicados en la reconstrucción
              if linea.startswith("#EXTM3U") or linea.startswith("#EXTVLCOPT"):
                  idx += 1
                  continue
                  
              # Detectar si entramos en un bloque automático de ELCANO previo para limpiarlo
              if "ZONA AUTOMATICA: CARPETA ELCANO" in linea:
                  en_bloque_elcano_anterior = True
                  idx += 1
                  continue
              
              if "FIN ZONA AUTOMATICA" in linea:
                  en_bloque_elcano_anterior = False
                  idx += 1
                  continue
                  
              if en_bloque_elcano_anterior:
                  idx += 1
                  continue
              
              # Si no es basura de ejecuciones anteriores, guardamos tu línea tal cual (con tus grupos, canales y espacios)
              lineas_personales.append(lineas_casa[idx])
              idx += 1

          # 3. Ensamblar el archivo final con las cabeceras estándar
          cabecera_global = (
              '#EXTM3U url-tvg="https://githubusercontent.com,'
              'https://epgshare01.online,'
              'https://githubusercontent.com" refresh="3600"\n'
              '#EXTVLCOPT:network-caching=1000\n'
              '#EXTGRP: group-title="ELCANO" group-logo="https://githubusercontent.com"\n'
          )

          # Marcadores invisibles para que el script sepa qué borrar en la próxima hora sin tocar tus canales
          zona_elcano_auto = "# ZONA AUTOMATICA: CARPETA ELCANO\n" + "\n".join(bloque_elcano) + "\n# FIN ZONA AUTOMATICA\n"

          texto_final_casa = cabecera_global + "\n" + zona_elcano_auto + "\n" + "\n".join(lineas_personales) + "\n"

          # Guardar lista local
          archivo_casa.write_text(texto_final_casa, encoding="utf-8")

          # Generar lista para Tailscale reemplazando IPs locales
          texto_final_ts = texto_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(texto_final_ts, encoding="utf-8")

          print("¡Lista sincronizada con éxito! Carpeta ELCANO creada arriba sin tocar el resto.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática de listas y ELCANO"
            git push
          else
            echo "No hay cambios que guardar."
          fi
