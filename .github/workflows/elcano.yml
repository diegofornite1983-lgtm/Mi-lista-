name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualización inteligente respetando esqueleto y hashes
        run: |
          python <<'PY'
          import re
          import sys
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          try:
              peticion = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente_elcano = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          def normalizar(texto):
              # Limpieza estricta para emparejar canales por su nombre base o tvg-id
              t = texto.upper()
              t = re.sub(r'M\+\s?|MOVISTAR\+\s?|MOVISTAR\s?PLUS\s?', 'MOVISTARPLUS', t)
              t = re.sub(r'(HD|1080P|720P|4K|\⭐️|SHICKAT|[A-F0-9]{4,5})', '', t)
              return "".join(t.split())

          # Parsear Elcano para sacar un mapa rápido de tvg-id / nombre limpio -> hash nuevo
          def parsear_elcano(texto):
              lineas = texto.splitlines()
              mapa = {}
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = ""
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                            j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              # Extraer tvg-id si existe
                              m_tvg = re.search(r'tvg-id="([^"]*)"', linea)
                              if m_tvg:
                                  mapa[normalizar(m_tvg.group(1))] = h_id
                              # Extraer nombre del canal
                              nombre_crudo = linea.rsplit(",", 1)[-1].strip()
                              mapa[normalizar(nombre_crudo)] = h_id
                      i = j
                  i += 1
              return mapa

          mapa_elcano = parsear_elcano(fuente_elcano)

          # Recorrer tu lista de casa línea por línea para actualizar hashes manteniendo tu estructura intacta
          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          i = 0

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  # Intentar identificar el canal para buscar su nuevo hash si está obsoleto
                  m_tvg = re.search(r'tvg-id="([^"]*)"', linea)
                  nombre_crudo = linea.rsplit(",", 1)[-1].strip()
                  
                  norm_tvg = normalizar(m_tvg.group(1)) if m_tvg else ""
                  norm_nombre = normalizar(nombre_crudo)

                  # Mirar si la siguiente línea es una URL local de acestream
                  if i + 1 < len(lineas_casa):
                      url_siguiente = lineas_casa[i + 1].strip()
                      if "127.0.0.1:6878" in url_siguiente and "id=" in url_siguiente:
                          # Buscar si tenemos un hash fresco en Elcano para este canal
                          nuevo_hash = None
                          if norm_tvg in mapa_elcano:
                              nuevo_hash = mapa_elcano[norm_tvg]
                          elif norm_nombre in mapa_elcano:
                              nuevo_hash = mapa_elcano[norm_nombre]

                          if nuevo_hash:
                              # Sustituir manteniendo la estructura del enlace original (getstream o manifest)
                              url_actualizada = re.sub(r'id=[0-9a-fA-F]{40}', f'id={nuevo_hash}', url_siguiente)
                              lineas_actualizadas.append(url_actualizada)
                              i += 1
                              print(f"Actualizado hash para: {nombre_crudo}")
                          else:
                              # Si no hay nuevo hash, conservar el que ya tenía el usuario
                              lineas_actualizadas.append(url_siguiente)
                              i += 1
                      else:
                          # Si es un enlace web directo (como las TDT de RTVE), dejarlo intacto
                          pass
              i += 1

          lista_final_casa = "\n".join(lineas_actualizadas) + "\n"
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          # Espejo para Tailscale cambiando la IP del motor local
          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("Sincronización de estructura y hashes completada con éxito.")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualización de hashes manteniendo esqueleto y nombres de usuario"
            git push
          else
            echo "No hay cambios que guardar."
          fi
