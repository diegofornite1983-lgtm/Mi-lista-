name: Actualizador Super Limpio

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sincronizar
        run: |
          python <<'PY'
          import re
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          f_casa = Path("Mi lista acestream")
          f_ts = Path("Canales m3u")
          f_amigos = Path("lista-amigos")

          if not f_casa.is_file():
              import sys
              sys.exit("ERROR: Falta Mi lista acestream")

          contenido = f_casa.read_text(encoding="utf-8-sig", errors="replace")

          # Descargar Elcano
          req = urllib.request.Request(URL_ELCANO, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=60) as resp:
              fuente = resp.read().decode("utf-8-sig", errors="replace")

          # Extraer canales limpios
          lineas = fuente.splitlines()
          nuevo_auto = ["# ==========================================", "# ZONA AUTOMATICA: ELCANO", "# =========================================="]
          
          i = 0
          while i < len(lineas):
              l = lineas[i].strip()
              if l.startswith("#EXTINF:"):
                  u = None
                  j = i + 1
                  while j < len(lineas):
                      cand = lineas[j].strip()
                      if cand and not cand.startswith("#"):
                          u = cand
                          break
                      j += 1
                  if u:
                      m = re.search(r'([0-9a-fA-F]{40})', u)
                      link = f"http://127.0.0.1:6878/ace/getstream?id={m.group(1)}" if m else u
                      nuevo_auto.append(l)
                      nuevo_auto.append(link)
                      i = j
              i += 1

          texto_auto = "\n".join(nuevo_auto)

          # Mantener la zona personal inferior intacta
          partes = re.split(r'(?i)#\s*={5,}\s*\n#\s*CARPETA:', contenido, maxsplit=1)
          if len(partes) > 1:
              cuerpo_per = "# CARPETA:" + partes[1]
          else:
              partes_alt = re.split(r'(?i)#\s*={5,}\s*\n#\s*SECCIÓN:', contenido, maxsplit=1)
              cuerpo_per = partes_alt[1] if len(partes_alt) > 1 else contenido

          cuerpo_per = re.sub(r'#\s*Ultima sincronizacion:.*', '', cuerpo_per).strip()

          # Montar archivo final
          final = "#EXTM3U\n#EXTVLCOPT:network-caching=1000\n\n" + texto_auto + "\n\n\n# ==========================================\n# ZONA PERSONAL\n# ==========================================\n\n" + cuerpo_per + "\n"

          f_casa.write_text(final, encoding="utf-8")
          f_ts.write_text(final.replace("127.0.0.1:6878", "100.90.204.66:6878"), encoding="utf-8")
          f_amigos.write_text(final, encoding="utf-8")
          print("¡Listo!")
          PY

      - name: Guardar en GitHub
        run: |
          git config user.name "Bot"
          git config user.email "bot@github.com"
          git add "Mi lista acestream" "Canales m3u" "lista-amigos"
          git diff --cached --quiet || git commit -m "Actualizacion limpia" && git push
