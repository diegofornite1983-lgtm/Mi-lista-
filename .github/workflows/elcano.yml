

name: Actualizador Automatico Elcano y Tailscale

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar CloudScraper avanzado
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper

      - name: Sincronización con bypass de Cloudflare
        run: |
          python <<'PY'
          import re
          import sys
          import time
          from pathlib import Path
          import cloudscraper

          URLS_ELCANO = [
              "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://tokyo.elcano-ipfs.workers.dev/k51qzi5uqu5di462t7j4vu4akwfhvtjhy88qbupktvoacqfqe9uforjvhyi4wr/hashes_acestream.m3u",
              "https://ipfs.io/ipns/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u",
              "https://k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs.ipns.dweb.link/hashes_acestream.m3u"
          ]

          archivo_casa = Path("Mi lista acestream")
          archivo_tailscale = Path("Canales m3u")

          if not archivo_casa.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream'.")

          try:
              contenido_casa = archivo_casa.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              contenido_casa = archivo_casa.read_text(encoding="latin-1")

          # Creamos el scraper inteligente anti-Cloudflare
          scraper = cloudscraper.create_scraper(
              browser={
                  'browser': 'firefox',
                  'platform': 'windows',
                  'desktop': True
              }
          )

          fuente_elcano = None

          for url in URLS_ELCANO:
              print(f"Intentando descargar desde: {url}")
              for intento in range(3):
                  try:
                      resp = scraper.get(url, timeout=25)
                      if resp.status_code == 200 and "#EXTM3U" in resp.text:
                          fuente_elcano = resp.text
                          print("¡Lista de Elcano descargada con éxito mediante CloudScraper!")
                          break
                      elif resp.status_code == 429:
                          print(f"Límite 429 detectado. Esperando 10s... (Intento {intento + 1}/3)")
                          time.sleep(10)
                      else:
                          print(f"Código HTTP {resp.status_code}. Probando siguiente...")
                          break
                  except Exception as e:
                      print(f"Error de red: {e}. Reintentando...")
                      time.sleep(5)
              if fuente_elcano:
                  break

          if not fuente_elcano:
              sys.exit("ERROR: Ninguna fuente de Elcano ha respondido debido a restricciones de la red de GitHub.")

          def parsear_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          match_hash = re.search(r'([0-9a-fA-F]{40})', url)
                          if match_hash:
                              h_id = match_hash.group(1)
                              url_limpia = f"http://127.0.0.1:6878/ace/getstream?id={h_id}"
                          else:
                              url_limpia = url
                          
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          entradas.append({
                              "extinf": linea,
                              "url": url_limpia,
                              "nombre": nombre,
                              "raw_url": url
                          })
                          i = j
                  i += 1
              return entradas

          canales_elcano = parsear_m3u(fuente_elcano)
          print(f"Total canales parseados de Elcano: {len(canales_elcano)}")

          lineas_casa = contenido_casa.splitlines()
          lineas_actualizadas = []
          i = 0

          def normalizar(n):
              return "".join(n.upper().split())

          mapa_elcano = {normalizar(c["nombre"]): c["url"] for c in canales_elcano}

          while i < len(lineas_casa):
              linea = lineas_casa[i]
              lineas_actualizadas.append(linea)

              if linea.startswith("#EXTINF:"):
                  nombre_canal = linea.rsplit(",", 1)[-1].strip()
                  nombre_norm = normalizar(nombre_canal)
                  
                  if i + 1 < len(lineas_casa) and not lineas_casa[i+1].strip().startswith("#"):
                      url_actual = lineas_casa[i+1].strip()
                      if nombre_norm in mapa_elcano:
                          lineas_actualizadas.append(mapa_elcano[nombre_norm])
                      else:
                          lineas_actualizadas.append(url_actual)
                      i += 1
              i += 1

          lista_final_casa = "\n".join(lineas_actualizadas) + "\n"
          archivo_casa.write_text(lista_final_casa, encoding="utf-8")

          lista_final_ts = lista_final_casa.replace("127.0.0.1:6878", "100.90.204.66:6878")
          archivo_tailscale.write_text(lista_final_ts, encoding="utf-8")

          print("¡Sincronización completada con éxito!")
          PY

      - name: Guardar cambios en GitHub
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add "Mi lista acestream" "Canales m3u"
          
          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion automatica de hashes de Elcano"
            git push
          else
            echo "No hay cambios nuevos que guardar."
          fi
