name: Actualizador Automatico Elcano

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-lista:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar Elcano y organizar por carpetas
        id: update
        run: |
          python <<'PY'
          import os
          import re
          import sys
          import unicodedata
          import urllib.request
          from pathlib import Path

          URL_ELCANO = "https://tokyo2.elcano-ipfs.workers.dev/k51qzi5uqu5dh5qej4b9wlcr5i6vhc7rcfkekhrxqek5c9lk6gdaiik820fecs/hashes_acestream.m3u"
          destino = Path("Mi lista acestream")

          if not destino.is_file():
              sys.exit("ERROR: No se encuentra el archivo 'Mi lista acestream' en la raíz.")

          def normalizar(nombre):
              nombre = unicodedata.normalize("NFKD", nombre.lower())
              nombre = "".join(c for c in nombre if not unicodedata.combining(c))
              nombre = re.sub(r"[^a-z0-9]", "", nombre)
              return nombre

          def leer_m3u(texto):
              lineas = texto.splitlines()
              entradas = []
              i = 0
              while i < len(lineas):
                  linea = lineas[i].strip()
                  if linea.startswith("#EXTINF:"):
                      url = None
                      j = i + 1
                      while j < len(lineas):
                          candidata = lineas[j].strip()
                          if candidata and not candidata.startswith("#"):
                              url = candidata
                              break
                          j += 1
                      if url:
                          nombre = linea.rsplit(",", 1)[-1].strip()
                          grupo = re.search(r'group-title="([^"]*)"', linea)
                          entradas.append({
                              "extinf": linea,
                              "url": url,
                              "nombre": nombre,
                              "grupo": grupo.group(1).upper() if grupo else "OTROS"
                          })
                          i = j
                  i += 1
              return entradas

          try:
              peticion = urllib.request.Request(
                  URL_ELCANO,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(peticion, timeout=60) as respuesta:
                  fuente = respuesta.read().decode("utf-8-sig", errors="replace")
          except Exception as error:
              sys.exit(f"ERROR descargando Elcano: {error}")

          if "#EXTM3U" not in fuente or "#EXTINF:" not in fuente:
              sys.exit("ERROR: La lista de Elcano no es válida.")

          try:
              original = destino.read_text(encoding="utf-8-sig")
          except UnicodeDecodeError:
              original = destino.read_text(encoding="latin-1")

          canales_fuente = leer_m3u(fuente)
          canales_mios = leer_m3u(original)

          if not canales_fuente:
              sys.exit("ERROR: Elcano no contiene canales.")

          nombres_existentes = { normalizar(c["nombre"]) for c in canales_mios }
          urls_existentes = { c["url"] for c in canales_mios }

          # Filtramos solo canales nuevos que no tengamos ya
          nuevos = []
          for canal in canales_fuente:
              nombre_id = normalizar(canal["nombre"])
              if not nombre_id or nombre_id in nombres_existentes or canal["url"] in urls_existentes:
                  continue
              nuevos.append(canal)
              nombres_existentes.add(nombre_id)
              urls_existentes.add(canal["url"])

          if not nuevos:
              print("No hay canales nuevos que añadir.")
              sys.exit(0)

          # Vamos a insertar los canales nuevos justo debajo de su cabecera de carpeta correspondiente
          lineas_originales = original.splitlines()
          nuevas_lineas = []
          i = 0
          
          # Mapeo de grupos de Elcano a tus títulos de carpetas en el archivo
          # Buscaremos frases clave en las líneas de separación de carpetas
          
          while i < len(lineas_originales):
              linea_actual = lineas_originales[i]
              nuevas_lineas.append(linea_actual)
              
              # Detectamos si estamos debajo de una cabecera de carpeta y metemos ahí los nuevos de ese grupo
              # Por ejemplo, si la línea actual es una cabecera de carpeta de La Liga:
              if "CARPETA: LA LIGA" in linea_actual.upper() or "GROUP-TITLE=\"LA LIGA\"" in linea_actual.upper():
                  # Aquí podemos inyectar los nuevos de este grupo si los hay
                  pass
              
              i += 1

          # Si prefieres una integración súper limpia y segura sin romper tus marcas de carpetas manuales, 
          # añadiremos los nuevos organizados al final pero claramente seccionados por su grupo:
          bloque_organizado = []
          bloque_organizado.append("\n# ==========================================")
          bloque_organizado.append("# CANALES NUEVOS ACTUALIZADOS POR ELCANO")
          bloque_organizado.append("# ==========================================\n")

          for canal in nuevos:
              bloque_organizado.append(canal["extinf"])
              bloque_organizado.append(canal["url"])

          with destino.open("a", encoding="utf-8", newline="\n") as archivo:
              if original and not original.endswith("\n"):
                  archivo.write("\n")
              archivo.write("\n".join(bloque_organizado) + "\n")

          print(f"Archivo actualizado correctamente con {len(nuevos)} canales nuevos ordenados.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(f"path={destino.as_posix()}\n")
          PY

      - name: Guardar cambios en GitHub
        env:
          TARGET_FILE: ${{ steps.update.outputs.path }}
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "actions@github.com"
          git add -- "$TARGET_FILE"

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar y clasificar nuevos canales de Elcano"
            git push
          else
            echo "No hay cambios que guardar."
          fi
