name: Actualizar Canales M3U Tailscale

on:
  push:
    paths:
      - 'Mi lista acestream'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v3

      - name: Copiar y reemplazar IP
        run: |
          sed 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Mi lista acestream" > "Canales m3u"

      - name: Guardar cambios
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add "Canales m3u"
          git diff-index --quiet HEAD || git commit -m "Actualizado Canales m3u con Tailscale automaticamente"
          git push
