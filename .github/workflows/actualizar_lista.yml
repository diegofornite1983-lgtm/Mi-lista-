name: Actualizar Canales M3U Tailscale y Lista Amigos

on:
  push:
    paths:
      - 'Mi lista acestream'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Copiar a Canales m3u (Tailscale) y lista-amigos
        run: |
          # 1. Copia para Tailscale reemplazando IP local por la IP publica/Tailscale
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"

          # 2. Copia exacta para lista-amigos (mantiene IP local 127.0.0.1)
          cp "Mi lista acestream" "lista-amigos"

      - name: Guardar cambios
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add "Canales m3u" "lista-amigos"
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Canales M3U Tailscale y lista-amigos"
            git push
          else
            echo "No hay cambios que guardar."
          fi
