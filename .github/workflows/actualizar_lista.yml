name: Actualizar Canales M3U Tailscale

on:
  push:
    paths:
      - 'Mi lista acestream'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Copiar y reemplazar IP para Tailscale
        run: |
          cp "Mi lista acestream" "Canales m3u"
          sed -i 's/127\.0\.0\.1:6878/100.90.204.66:6878/g' "Canales m3u"

      - name: Guardar cambios
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add "Canales m3u"
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar Canales M3U Tailscale"
            git push
          else
            echo "No hay cambios que guardar."
          fi
